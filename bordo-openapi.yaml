            retryable:
              type: boolean
              description: true 면 동일 요청 재시도가 의미 있다. `DUPLICATE_EVENT` 처럼 false 인 경우 재시도 금지.
            details:
              type: object
              additionalProperties: true
              description: '코드별 부가 정보. 예: `approval_type`, `idempotency_key`'
          required:
