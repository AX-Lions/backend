                end_at: '2026-08-07T15:00:00+09:00'
                status: CONFIRMED
                participant_ids:
                - usr_backend_01
                - usr_front_01
                related_meeting: mtg_88
                discord_notified: true
                outbox_event_id: obx_614
                local_times:
                  usr_front_01: '2026-08-06T22:00:00-07:00'
                  usr_backend_01: '2026-08-07T14:00:00+09:00'
