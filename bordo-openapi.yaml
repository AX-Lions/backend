        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '404':
          $ref: '#/components/responses/E404'
      security:
      - serviceToken: []
      parameters:
      - name: meeting_id
        in: path
        required: true
        schema:
          type: string
        description: 회의 ID
        example: meeting_3
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                events:
                  type: array
                  items:
                    type: object
                    properties:
                      discord_id:
                        type: string
                      action:
                        type: string
                        enum:
                        - JOIN
                        - LEAVE
                      at:
                        type: string
                        format: date-time
                        description: RFC3339 (오프셋 포함)
                    required:
                    - discord_id
                    - action
              required:
              - events
            example:
              events:
              - discord_id: '111'
                action: JOIN
                at: '2026-08-07T10:01:00Z'
              - discord_id: '222'
                action: LEAVE
                at: '2026-08-07T10:30:00Z'
  /internal/v1/outbox:
    get:
      tags:
      - 13. Internal API (Discord Bot)
      summary: 발송함 Polling
      description: |-
        `PENDING → CLAIMED → SENT → ACKED` / 실패 시 `RETRY_WAIT → DEAD`

        Bot 이 주기적으로 호출하면 서버는 만료되지 않고 아직 ACK 되지 않은 작업을 **`CLAIMED` 로 바꿔** 반환한다.
        서버는 요청 트랜잭션 안에서 Discord 를 직접 호출하지 않고, 항상 이 발송함을 거친다.

        **발송 유형 6종**

        | type | 대상 | 내용 |
        |---|---|---|
        | `agent_utterance` | 회의 채널 | 대리인 이름, 답변, **근거 수**, 신뢰도, 유보 상태 |
        | `meeting_announcement` | 공지 채널 | 일정, 참석자, 현지 시간, 안건 |
        | `meeting_reminder` | 채널/DM | 남은 시간, 대리 참석 상태 |
        | `pending_question` | 사용자 DM | 질문, 질문자, 답변 링크 |
        | `meeting_report` | 회의 스레드 | 요약, 결정 후보, 태스크 후보, 미해결 질문 |
        | `schedule_changed` | 참석자 | 변경 전후 시간과 사유 |
      operationId: pollOutbox
      responses:
        '200':
          description: Claim 됨
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/OutboxEvent'
                  claim_expires_at:
                    type: string
                    format: date-time
                    description: RFC3339 (오프셋 포함)
                required:
                - results
              example:
                count: 2
                claim_expires_at: '2026-08-07T10:12:30+09:00'
                results:
                - id: obx_501
                  status: CLAIMED
                  type: agent_utterance
                  target:
                    kind: channel
                    channel_id: '876543210987654321'
                  idempotency_key: team_deputy:meeting_3:run_72
                  retry_count: 0
                  payload:
                    agent_name: 최비성의 AI 대리인
                    text: 구현 가능합니다. users 와 teams 사이에 team_members 중간 테이블을 두면 됩니다.
                    evidence_count: 2
                    confidence: 0.91
                    deferred: false
                    detail_url: https://app.bordo.dev/t/team_deputy/flow?run=run_72
                - id: obx_502
                  status: CLAIMED
                  type: pending_question
                  target:
                    kind: dm
                    discord_user_id: '111'
                  idempotency_key: team_deputy:q_12:notify
                  retry_count: 1
                  payload:
                    question: VIEWER 가 대리인 발언을 트리거할 수 있나요?
                    asked_by: 임수연
                    answer_url: https://app.bordo.dev/t/team_deputy/agent?question=q_12
        '401':
          $ref: '#/components/responses/E401'
      security:
      - serviceToken: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 20
        description: 최대 개수
  /internal/v1/outbox/{outbox_id}/ack:
    post:
      tags:
      - 13. Internal API (Discord Bot)
      summary: 발송 성공 ACK
      description: 게시 성공 시 실제 Discord `message_id` 와 함께 보고한다. 동일 `idempotency_key` 로 다시 ACK 하면 **기존 결과를 그대로 반환**한다(재게시 없음).
      operationId: ackOutbox
      responses:
        '200':
          description: ACK 됨
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  status:
                    type: string
                    enum:
                    - SENT
                    - ACKED
                  previous_status:
                    type: string
                  discord_message_id:
                    type: string
                  idempotency_key:
                    type: string
                  delivered_at:
                    type: string
                    format: date-time
                    description: RFC3339 (오프셋 포함)
              example:
                id: obx_501
                status: ACKED
                previous_status: CLAIMED
                discord_message_id: '1234567890'
                idempotency_key: team_deputy:meeting_3:run_72
                delivered_at: '2026-08-07T10:12:03+09:00'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '404':
          $ref: '#/components/responses/E404'
      security:
      - serviceToken: []
      parameters:
      - name: outbox_id
        in: path
        required: true
        schema:
          type: string
        description: Outbox 이벤트 ID
        example: obx_501
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                discord_message_id:
                  type: string
                discord_event_id:
                  anyOf:
                  - type: string
                  - type: 'null'
                delivered_at:
                  type: string
                  format: date-time
                  description: RFC3339 (오프셋 포함)
              required:
              - discord_message_id
            example:
              discord_message_id: '1234567890'
              delivered_at: '2026-08-07T10:12:03Z'
  /internal/v1/outbox/{outbox_id}/fail:
    post:
      tags:
      - 13. Internal API (Discord Bot)
      summary: 발송 실패 FAIL
      description: 실패 코드와 함께 보고하면 서버가 `retry_count` 와 `next_retry_at` 을 계산한다(지수 Backoff). 최대 재시도를 넘기면 `DEAD` 로 전이한다.
      operationId: failOutbox
      responses:
        '200':
          description: 재시도 예약 또는 DEAD
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  status:
                    type: string
                    enum:
                    - RETRY_WAIT
                    - DEAD
                  previous_status:
                    type: string
                  error_code:
                    $ref: '#/components/schemas/ErrorCode'
                  message:
                    type: string
                  retry_count:
                    type: integer
                  max_retries:
                    type: integer
                  backoff_seconds:
                    type: integer
                  next_retry_at:
                    anyOf:
                    - type: string
                      format: date-time
                      description: RFC3339 (오프셋 포함)
                    - type: 'null'
              example:
                id: obx_501
                status: RETRY_WAIT
                previous_status: CLAIMED
                error_code: DISCORD_DELIVERY_FAILED
                message: Missing Permissions
                retry_count: 1
                max_retries: 5
                backoff_seconds: 30
                next_retry_at: '2026-08-07T10:12:35+09:00'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '404':
          $ref: '#/components/responses/E404'
      security:
      - serviceToken: []
      parameters:
      - name: outbox_id
        in: path
        required: true
        schema:
          type: string
        description: Outbox 이벤트 ID
        example: obx_501
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                error_code:
                  $ref: '#/components/schemas/ErrorCode'
                message:
                  type: string
                failed_at:
                  type: string
                  format: date-time
                  description: RFC3339 (오프셋 포함)
              required:
              - error_code
            example:
              error_code: DISCORD_DELIVERY_FAILED
              message: Missing Permissions
              failed_at: '2026-08-07T10:12:05Z'
  /mcp:
    post:
      tags:
      - 14. MCP (개인 AI · JSON-RPC 2.0)
      summary: MCP JSON-RPC 엔드포인트 (1단계 — 쓰기 도구 3종)
      description: |-
        개인 AI 클라이언트(Claude Code · Codex · Cursor)가 붙는 단일 엔드포인트.
        **1단계는 쓰기 도구 3종**입니다 — 읽기 도구가 없어야 이 장기 토큰이 새더라도 가져갈 게 없습니다.
        나머지 10종은 아래 `x-deferred-tools` 에 이름만 남깁니다(2단계).

        ---

        **전송** HTTPS + JSON-RPC 2.0, 요청 하나에 JSON 응답 하나. SSE 스트림 · 세션(`Mcp-Session-Id`) · 배치 요청은 **없습니다.**
        **인증** `Authorization: Bearer brd_...` — `POST /api/v1/me/mcp-token` 으로 발급. 실패는 본문을 읽기 전이라 HTTP `401`.
        `GET` · `DELETE /mcp` 는 `405`.

        ### dual-era — 두 세대의 클라이언트를 모두 받습니다

        | 세대 | 판별 | 흐름 |
        |---|---|---|
        | **legacy** (≤ `2025-11-25`) | 본문 `params._meta` 에 판 번호가 **없다** | `initialize` → `notifications/initialized`(**202 · 본문 없음**) → `tools/list` → `tools/call` |
        | **modern** (`2026-07-28`) | `params._meta["io.modelcontextprotocol/protocolVersion"]` 이 **있다** | `server/discover` → `tools/list` → `tools/call`. `MCP-Protocol-Version` · `Mcp-Method` · `Mcp-Name` 헤더가 오면 본문과 대조 |

        한쪽만 만들면 어느 클라이언트를 쓰느냐에 따라 연결 자체가 안 됩니다.

        ### 오류 — 어디로 오는가

        | 종류 | 예 | 오는 곳 | HTTP |
        |---|---|---|---|
        | 인증 실패 | 토큰 없음·틀림·폐기 | 공통 오류 형식 (`error.code`) | **401** |
        | Origin 불일치 | 브라우저에서 남의 도메인 | 공통 오류 형식 | **403** |
        | 호출 상한 | 사용자당 분당 120 | 공통 오류 형식 | **429** |
        | JSON 파싱 · 형식 | 깨진 본문, `jsonrpc` 없음 | JSON-RPC `error` `-32700` / `-32600` | 200 |
        | 모르는 method | `resources/list` | JSON-RPC `error` `-32601` | 200 (**modern 은 404**) |
        | 모르는 도구 · 인자 형식 | `bordo_nope` | JSON-RPC `error` `-32602` (`data.available`) | 200 |
        | 헤더·본문 불일치 | `Mcp-Name` ≠ `params.name` | JSON-RPC `error` `-32020` | **400** |
        | 모르는 프로토콜 판 | `2030-01-01` | JSON-RPC `error` `-32022` (`data.supported`) | **400** |
        | **도구 실행 오류** | 검증 실패 · 권한 없음 · 대상 없음 · 서버 예외 | **`result.isError: true`** + `content[0].text` 에 사유 | 200 |

        도구 실행 오류를 JSON-RPC `error` 로 내면 클라이언트가 프로토콜 문제로 취급해 모델에게 안 보여주고, AI 는 왜 실패했는지 모른 채 같은 호출을 반복합니다.
        서버 예외는 고정 문구만 나갑니다 — 원문 오류에는 제약 조건 이름과 값이 섞여 있고 그게 개발자 컴퓨터의 AI 대화창에 그대로 찍힙니다.

        ### 1단계 도구 3종 (`bordo_` 접두)

        | Tool | 하는 일 | 멱등 |
        |---|---|---|
        | `bordo_record_work` | 지금 하는 일 기록. `(project, owner, title)` 이 같으면 **갱신** | 재시도 = 갱신 |
        | `bordo_upload_document` | 문서 업로드. 비밀키를 **저장 전에** 지우고 `masked_secrets` 건수를 돌려줌 | `(project, title, content_hash)` 같으면 안 만듦 |
        | `bordo_complete_work` | `work_item_id` 또는 `title` 로 찾아 `DONE` · 100% | 이미 완료면 `ALREADY_DONE` 성공 |

        `project_id` 를 생략하면 **가장 최근에 연 프로젝트**로 갑니다. 그 사실은 결과 `project.resolved_by: "default"` 로 반드시 돌려줍니다.
        핸드셰이크(`initialize` · `server/discover`) 결과의 `instructions` 에 쓸 수 있는 프로젝트 목록이 실립니다 — 읽기 도구 없이 클라이언트가 `project_id` 를 아는 유일한 경로입니다.
        기록된 항목은 `source: "mcp"` 가 붙어 화면이 「개인 AI가 기록함」 뱃지를 답니다.
      operationId: mcpJsonRpc
      x-deferred-tools:
        description: 2단계. 이름만 예약합니다. 호출하면 `-32602` 입니다.
        tools:
        - bordo_initialize_workspace
        - bordo_get_team_context
        - bordo_sync_status
        - bordo_push_current_state
        - bordo_pull_documents
        - bordo_search_context
        - bordo_get_policy
        - bordo_propose_policy_update
        - bordo_log_work_session
        - bordo_catch_up
        - bordo_ask_agent
        - bordo_answer_pending_question
      security:
      - mcpToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JsonRpcRequest'
            examples:
              initialize (legacy):
                summary: legacy 핸드셰이크
                value:
                  jsonrpc: '2.0'
                  id: init-1
                  method: initialize
                  params:
                    protocolVersion: '2025-11-25'
                    clientInfo:
                      name: claude-code
                      version: 1.0.0
                    capabilities: {}
              notifications/initialized (legacy):
                summary: 핸드셰이크 직후 클라이언트가 보냄 — 응답은 202 · 본문 없음
                value:
                  jsonrpc: '2.0'
                  method: notifications/initialized
              server/discover (modern):
                summary: 'modern 핸드셰이크. 헤더 `MCP-Protocol-Version: 2026-07-28` · `Mcp-Method: server/discover`'
                value:
                  jsonrpc: '2.0'
                  id: d-1
                  method: server/discover
                  params:
                    _meta:
                      io.modelcontextprotocol/protocolVersion: '2026-07-28'
              tools/list:
                summary: 도구 카탈로그
                value:
                  jsonrpc: '2.0'
                  id: list-1
                  method: tools/list
                  params: {}
              bordo_record_work:
                summary: bordo_record_work — 지금 하는 일 기록 (modern 이면 `_meta` 와 `Mcp-Name` 헤더 추가)
                value:
                  jsonrpc: '2.0'
                  id: 7
                  method: tools/call
                  params:
                    name: bordo_record_work
                    arguments:
                      title: MCP 연동
                      summary: dual-era 분기와 헤더 검증
                      progress: 80
                      status: IN_PROGRESS
                      blockers: []
                      category: backend
                      visibility: team
                      project_id: prj_b
              bordo_upload_document:
                summary: bordo_upload_document — 문서 업로드
                value:
                  jsonrpc: '2.0'
                  id: 8
                  method: tools/call
                  params:
                    name: bordo_upload_document
                    arguments:
                      title: MCP 연결 설계
                      content: "# 설계\n..."
                      category: backend
                      visibility: team
              bordo_complete_work:
                summary: bordo_complete_work — 완료 보고
                value:
                  jsonrpc: '2.0'
                  id: 9
                  method: tools/call
                  params:
                    name: bordo_complete_work
                    arguments:
                      title: MCP 연동
                      note: 클라이언트 두 종으로 연결 확인
      responses:
        '200':
          description: 정상 결과 · JSON-RPC 오류 · 도구 실행 오류(`result.isError`). 셋 다 200 입니다.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/JsonRpcResult'
                - $ref: '#/components/schemas/JsonRpcError'
              examples:
                initialize (legacy):
                  value:
                    jsonrpc: '2.0'
                    id: init-1
                    result:
                      protocolVersion: '2025-11-25'
                      serverInfo:
                        name: bordo
                        version: 1.0.0
                      capabilities:
                        tools:
                          listChanged: false
                      instructions: |-
                        당신은 서재민의 Bordo 계정으로 기록합니다.
                        쓸 수 있는 프로젝트:
                          - prj_b (Bordo / 백엔드)  ← project_id 를 생략하면 여기에 기록됩니다
                          - prj_a (Bordo / Discord 봇)
                        기록한 것은 팀 Flow 화면에 「개인 AI가 기록함」으로 표시되고, 자리를 비운 동안 대리인이 이 내용을 근거로 답합니다.
                server/discover (modern):
                  value:
                    jsonrpc: '2.0'
                    id: d-1
                    result:
                      resultType: complete
                      supportedVersions:
                      - '2026-07-28'
                      - '2025-11-25'
                      capabilities:
                        tools: {}
                      instructions: 당신은 서재민의 Bordo 계정으로 기록합니다. ...
                      _meta:
                        io.modelcontextprotocol/serverInfo:
                          name: bordo
                          version: 1.0.0
                tools/list:
                  value:
                    jsonrpc: '2.0'
                    id: list-1
                    result:
                      tools:
                      - name: bordo_record_work
                        description: 지금 하고 있는 일을 Bordo 에 기록합니다. 같은 제목이 있으면 갱신합니다.
                        inputSchema:
                          type: object
                          properties:
                            title: {type: string, maxLength: 200}
                            summary: {type: string}
                            progress: {type: integer, minimum: 0, maximum: 100}
                            status: {type: string, enum: [TODO, IN_PROGRESS, BLOCKED, DONE]}
                            blockers: {type: array, items: {type: string}}
                            category: {type: string}
                            visibility: {type: string, enum: [team, private]}
                            project_id: {type: string}
                          required: [title]
                      - name: bordo_upload_document
                        description: 문서를 올립니다. 비밀키는 저장 전에 마스킹됩니다.
                        inputSchema:
                          type: object
                          properties:
                            title: {type: string, maxLength: 200}
                            content: {type: string}
                            category: {type: string}
                            visibility: {type: string, enum: [team, private]}
                            project_id: {type: string}
                          required: [title, content]
                      - name: bordo_complete_work
                        description: 하고 있던 일을 완료로 표시합니다.
                        inputSchema:
                          type: object
                          properties:
                            work_item_id: {type: string}
                            title: {type: string}
                            note: {type: string}
                            project_id: {type: string}
                bordo_record_work · 성공:
                  summary: 결과는 content 배열 + structuredContent 입니다 (MCP 규격)
                  value:
                    jsonrpc: '2.0'
                    id: 7
                    result:
                      content:
                      - type: text
                        text: 백엔드 프로젝트에 「MCP 연동」을(를) 진행 중 80% 로 기록했습니다.
                      structuredContent:
                        work_item_id: work_44
                        action: UPDATED
                        title: MCP 연동
                        status: IN_PROGRESS
                        progress: 80
                        project:
                          id: prj_b
                          name: 백엔드
                          team_name: Bordo
                          resolved_by: default
                        source: mcp
                      isError: false
                bordo_upload_document · 성공:
                  value:
                    jsonrpc: '2.0'
                    id: 8
                    result:
                      content:
                      - type: text
                        text: 백엔드 프로젝트에 「MCP 연결 설계」을(를) 올렸습니다. 비밀키로 보이는 값 1건을 지웠습니다 — 사용자에게 알리십시오.
