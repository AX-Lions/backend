  /api/v1/meetings/{meeting_id}/flow:
    get:
      tags:
      - 09. 회의
      summary: 플로우 그래프
      description: |-
        회의 화면의 중심. **누가 누구에게 무엇을 전달했는지**를 노드-엣지로 돌려줍니다.

        v1 의 `GET /meetings/{id}/report` 는 요약문 한 덩어리였지만, 와이어프레임은 이걸
        그래프로 그리므로 구조가 다릅니다. 보고서는 그대로 두고 이 엔드포인트를 추가했습니다.

        `category` 에 따라 `content_types` 의 유효값이 달라집니다.

        | category | 유효 content_type | 인덱스 |
        |---|---|---|
        | `WORK` | `DOCUMENT` · `PLAN` | 문서 목록 |
        | `MEETING` | `OPINION` · `REQUEST` · `REVISION` | 안건 목록 |
      operationId: getMeetingFlow
      responses:
        '200':
          description: 조회됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingFlow'
              example:
                meeting_id: mtg_88
                meeting_label: 8/7 회의이름
                category: MEETING
                nodes:
                - id: nd_a
                  kind: USER
                  user_id: usr_a
                  name: A
                  avatar_url: null
                - id: nd_b
                  kind: USER
                  user_id: usr_b
                  name: B
                  avatar_url: null
                - id: nd_d_agent
                  kind: AGENT
                  user_id: usr_d
                  name: 임수연의 Bordo
                  avatar_url: null
                edges:
                - id: edg_1
                  from_node_id: nd_a
                  to_node_ids:
                  - nd_b
                  content_type: OPINION
                  label: 의견
                  direction_label: A → B
                  participant_avatar_urls: []
                  extra_participant_count: 0
                  document_id: null
                  agenda_id: agd_1
                  occurred_at: '2026-08-07T14:12:00+09:00'
                - id: edg_2
                  from_node_id: nd_d_agent
                  to_node_ids:
                  - nd_a
                  - nd_b
                  content_type: REQUEST
                  label: 요청 사항
                  direction_label: AI 대리인 → A, B
                  participant_avatar_urls: []
                  extra_participant_count: 3
                  document_id: null
                  agenda_id: agd_3
                  occurred_at: '2026-08-07T14:31:00+09:00'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
      security:
      - bearerAuth: []
      parameters:
      - name: meeting_id
        in: path
        required: true
        schema:
          type: string
        description: 회의 ID
        example: mtg_88
      - name: category
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/FlowCategory'
        description: '`WORK`(작업) / `MEETING`(회의). 좌측 카테고리 탭.'
        example: MEETING
      - name: participant_ids
        in: query
        required: false
        schema:
          type: string
        description: 쉼표 구분. 필터 `참여자` 체크박스. AI 대리인은 `usr_d:agent` 형태.
        example: usr_a,usr_b,usr_d:agent
      - name: content_types
        in: query
        required: false
        schema:
          type: string
        description: 쉼표 구분. 필터 `내용` 체크박스.
        example: OPINION,REQUEST
      - name: order
        in: query
        required: false
        schema:
          type: string
          enum:
          - time
        description: 필터 `시간순`
        example: time
  /api/v1/meetings/{meeting_id}/indexes:
    get:
      tags:
      - 09. 회의
      summary: 인덱스 (문서 / 안건)
      description: |-
        좌측 사이드바 `인덱스` 그룹.

        각 항목에 `related_edge_ids` 가 붙어 있어야 **`인덱스 선택 시 인덱스에 해당되는 화살표나
        자료들이 포커싱됨`** 을 클라이언트가 추가 요청 없이 처리할 수 있습니다.

        **`category=WORK` 은 회의가 아니라 프로젝트·기간으로 봅니다.** 경로에 회의
        id 가 붙어 있지만 작업 엣지에는 회의가 없습니다(`/projects/{id}/flow` 참고 —
        작업 플로우의 스코프는 기간입니다). 회의로 좁히면 조건에 맞는 행이 하나도
        없어 이 목록이 언제나 빈 배열이 됩니다. 회의 id 는 어느 프로젝트인지를
        알아내는 데만 씁니다.

        기간 기본값은 `/projects/{id}/flow` · `/flow/participants/{user_id}` 와
        같습니다(최근 7일). 인덱스와 캔버스가 다른 구간을 보면 인덱스의 문서를
        눌러도 강조될 화살표가 판에 없습니다.

        비공개(`private`) 문서는 목록에서 뺍니다. 작업 플로우는 팀 관점 화면이라
        제목만 스쳐도 비공개로 둔 뜻이 사라집니다.
      operationId: listMeetingIndexes
      responses:
        '200':
          description: 조회됨
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/MeetingIndexItem'
                required:
                - results
              example:
                count: 3
                results:
                - id: agd_1
                  label: 안건 1
                  kind: AGENDA
                  related_edge_ids:
                  - edg_1
                - id: agd_2
                  label: 안건 2
                  kind: AGENDA
                  related_edge_ids: []
                - id: agd_3
                  label: 안건 3
                  kind: AGENDA
                  related_edge_ids:
                  - edg_2
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
      security:
      - bearerAuth: []
      parameters:
      - name: meeting_id
        in: path
        required: true
        schema:
          type: string
        description: 회의 ID
        example: mtg_88
      - name: category
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/FlowCategory'
        description: ''
        example: MEETING
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: '`category=WORK` 일 때만. 생략하면 `to - 7일`.'
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: '`category=WORK` 일 때만. 생략하면 지금.'
  /api/v1/meetings/{meeting_id}/summary-table:
    get:
      tags:
      - 09. 회의
      summary: 요약 표 (3열)
      description: 플로우 캔버스 가운데의 `발견한 문제` / `변동 사항` / `이후 계획` 표.
      operationId: getMeetingSummaryTable
      responses:
        '200':
          description: 조회됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingSummaryTable'
              example:
                discovered_issues:
                - team_members 조회가 N+1
                - 타임존 표기 불일치
                changes:
                - 중간 테이블 도입
                - RFC3339 오프셋 표기로 통일
                next_plans:
                - 인덱스 추가 후 재측정
                - 프론트 표기 일괄 수정
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
      security:
      - bearerAuth: []
      parameters:
      - name: meeting_id
        in: path
        required: true
        schema:
          type: string
        description: 회의 ID
        example: mtg_88
  /api/v1/meetings/{meeting_id}/context:
    get:
      tags:
      - 09. 회의
      summary: 회의 맥락
      description: 우측 사이드바 `회의 맥락` 의 `펼치기` 안에 들어가는 참가자별 발언.
      operationId: getMeetingContext
      responses:
        '200':
          description: 조회됨
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/Utterance'
                required:
                - results
              example:
                count: 2
                results:
                - participant_id: usr_a
                  participant_name: 참가자 A
                  utterance: 인덱스부터 확인하는 게 맞습니다.
                  spoken_at: '2026-08-07T14:12:00+09:00'
                - participant_id: usr_b
                  participant_name: 참가자 B
                  utterance: 마이그레이션 순서를 먼저 정하죠.
                  spoken_at: '2026-08-07T14:15:00+09:00'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
      security:
      - bearerAuth: []
      parameters:
      - name: meeting_id
        in: path
        required: true
        schema:
          type: string
        description: 회의 ID
        example: mtg_88
  /api/v1/meetings/{meeting_id}/agendas/{agenda_id}:
    get:
      tags:
      - 09. 회의
      summary: 안건 상세
      description: |-
        우측 사이드바 `주요 안건` 의 한 항목.

        `direction_label` 은 서버가 만들어 내려줍니다 — 클라이언트가 노드 ID 를 이름으로
        되짚어 조립하면 AI 대리인 표기(`AI 대리인 → A, B, C`)가 어긋나기 쉽습니다.
      operationId: getAgendaDetail
      responses:
        '200':
          description: 조회됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgendaDetail'
              example:
                id: agd_3
                title: 안건 3
                direction_label: AI 대리인 → A, B, C
                content: D 대신 대리인이 마이그레이션 일정 조정을 요청했습니다.
                related_edge_ids:
                - edg_2
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
      security:
      - bearerAuth: []
      parameters:
      - name: meeting_id
        in: path
        required: true
        schema:
          type: string
        description: 회의 ID
        example: mtg_88
      - name: agenda_id
        in: path
        required: true
        schema:
          type: string
        description: 안건 ID
        example: agd_3
    patch:
      tags:
      - 09. 회의
      summary: 안건 수정
      description: |-
        제목과 순서를 고칩니다.

        AI 가 만든 안건은 `CANDIDATE` 로 시작합니다. `status` 를 `CONFIRMED` 로 올리는 것이
        **사람의 승인 행위**이며, 이 필드만은 여기서 바꿀 수 있습니다.
      operationId: updateAgenda
      responses:
        '200':
          description: 수정됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgendaItem'
              example:
                id: agd_3
                title: 마이그레이션 순서
                order: 3
                category: database
                owner_id: usr_backend_01
                status: DISCUSSED
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
      security:
      - bearerAuth: []
      parameters:
      - name: meeting_id
        in: path
        required: true
        schema:
          type: string
        description: 회의 ID
        example: mtg_88
      - name: agenda_id
        in: path
        required: true
        schema:
          type: string
        description: 안건 ID
        example: agd_3
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                order:
                  type: integer
                category:
                  $ref: '#/components/schemas/Category'
                status:
                  type: string
                  enum:
                  - PENDING
                  - DISCUSSED
                  - DEFERRED
            example:
              title: 마이그레이션 순서
              status: DISCUSSED
    delete:
      tags:
      - 09. 회의
      summary: 안건 삭제
      description: |-
        회의가 시작되기 전(`DRAFT` · `SCHEDULED` · `CONFIRMED`)에만 지울 수 있습니다.

        이미 이 안건으로 오간 플로우 엣지가 있으면 `409` 입니다 — 논의가 있었는데 안건만 사라지면
        플로우에 주인 없는 화살표가 남습니다.
      operationId: deleteAgenda
      responses:
        '204':
          description: 삭제됨
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
      security:
      - bearerAuth: []
      parameters:
      - name: meeting_id
        in: path
        required: true
        schema:
          type: string
        description: 회의 ID
        example: mtg_88
      - name: agenda_id
        in: path
        required: true
        schema:
          type: string
        description: 안건 ID
        example: agd_3
      - $ref: '#/components/parameters/IdempotencyKey'
  /api/v1/flow-edges/{edge_id}:
    get:
      tags:
      - 09. 회의
      summary: 화살표 상세
      description: |-
        플로우에서 화살표를 클릭했을 때 우측에 뜨는 내용.

        `WORK` 모드면 `document`, `MEETING` 모드면 `agenda` 가 채워집니다.
        우선순위 규칙 — `포커싱된 화살표를 선택하면 그 화살표에 해당하는 내용이 우선적으로 사이드바에 뜨고
        선택 안 하면 인덱스에서 선택된 안건에 대한 내용이 우선적으로 뜸` — 은 클라이언트 로직입니다.
      operationId: getFlowEdge
      responses:
        '200':
          description: 조회됨
          content:
            application/json:
              schema:
                type: object
                properties:
                  edge:
                    $ref: '#/components/schemas/FlowEdge'
                  delivery_context:
                    type: array
                    items:
                      $ref: '#/components/schemas/Utterance'
                  document:
                    anyOf:
                    - $ref: '#/components/schemas/Document'
                    - type: 'null'
                  agenda:
                    anyOf:
                    - $ref: '#/components/schemas/AgendaDetail'
                    - type: 'null'
                  lookup_id:
                    anyOf:
                    - type: string
                    - type: 'null'
                    description: |-
                      `AI 조회` 화살표의 4단 상세로 가는 열쇠.
                      `GET /agent-lookups/{lookup_id}` 로 이어집니다.

                      `document` · `agenda` 는 내용을 통째로 싣는데 여기만 id 인 이유는,
                      조회 기록이 대리인 쪽 모델이라 여기서 합치면 모듈이 순환하기 때문입니다.

                      `content_type` 이 `AI_LOOKUP` 이 아니면 `null` 입니다.
              example:
                edge:
                  id: edg_2
                  from_node_id: nd_d_agent
                  to_node_ids:
                  - nd_a
                  - nd_b
                  content_type: REQUEST
                  label: 요청 사항
