          retryable: false
          details:
            approval_type: schedule_change
    TeamRole:
      type: string
      enum:
      - OWNER
      - ADMIN
      - MEMBER
      - VIEWER
      description: 팀 내 권한. **Agent Capability 와는 별개다** — AI는 사용자 권한을 그대로 승계하지 않는다.
    Visibility:
      type: string
      enum:
      - team
      - private
      description: '`private` 는 소유자 Agent 만 접근한다. 다른 Agent 에게는 **존재 여부도 반환하지 않으며** 조회 시 403 이 아니라 404 를 준다.'
    Priority:
