  /api/v1/calendar/events/{event_id}:
    patch:
      tags:
      - 08. 캘린더
      summary: 일정 수정
      description: |-
        `schedule_adjustment` POLICY 대상이다.

        - 정책이 `SUGGEST_ONLY` 면 AI 호출은 **제안만** 만들고 확정하지 않는다
        - `max_shift_hours` 를 넘기면 `409 POLICY_HUMAN_APPROVAL_REQUIRED`
      operationId: updateCalendarEvent
      responses:
        '200':
          description: 수정됨
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/CalendarEvent'
                - type: object
                  properties:
                    shift_hours:
                      type: integer
                    reason:
                      type: string
                    policy_decision:
                      $ref: '#/components/schemas/PolicyEvaluation'
                    notified:
                      type: object
                      properties:
                        participants:
                          type: boolean
                        discord_outbox_event_id:
                          type: string
              example:
                id: evt_2
                title: DB 스키마 리뷰
                status: CONFIRMED
                start_at: '2026-08-07T14:00:00+09:00'
                end_at: '2026-08-07T15:00:00+09:00'
                shift_hours: 4
                reason: 해외 팀원 현지 시각 고려
                policy_decision:
                  decision: SUGGEST_ONLY
                  policy_version: 7
                  reason_codes:
                  - WITHIN_MAX_SHIFT
                notified:
                  participants: true
                  discord_outbox_event_id: obx_614
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          description: '`POLICY_HUMAN_APPROVAL_REQUIRED` — 정책 한도 초과, 사람 승인 필요'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                success: false
                request_id: 9a1c...
                error:
                  code: POLICY_HUMAN_APPROVAL_REQUIRED
                  message: 사용자 승인이 필요합니다.
                  retryable: false
                  details:
                    approval_type: schedule_change
                    requested_shift_hours: 9
                    max_shift_hours: 4
      security:
      - bearerAuth: []
      parameters:
      - name: event_id
        in: path
        required: true
        schema:
          type: string
        description: 일정 ID
        example: evt_2
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                start_at:
                  type: string
                  format: date-time
                  description: RFC3339 (오프셋 포함)
                end_at:
                  type: string
                  format: date-time
                  description: RFC3339 (오프셋 포함)
                reason:
                  type: string
            example:
              start_at: '2026-08-07T14:00:00+09:00'
              end_at: '2026-08-07T15:00:00+09:00'
              reason: 해외 팀원 현지 시각 고려
    get:
      tags:
      - 08. 캘린더
      summary: 일정 상세
      description: '`local_times` 에 참석자별 현지 시각이 들어 있습니다 — 시간대가 다른 팀이 전제라 서버가 계산해 내려줍니다.'
