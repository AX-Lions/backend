  /api/v1/meetings/{meeting_id}/ai-briefing:
    get:
      tags:
      - 10. AI 대리인
      summary: AI 브리핑
      description: |-
        `AI` 버튼을 눌렀을 때 열리는 우측 사이드바.

        와이어프레임 본문 그대로 **`회의의 어느 부분에서 논쟁점 답변을 활용했고 회의의 어느 부분에서
        답변을 유보했는지`** 를 돌려줍니다. `used_answers` / `deferred_answers` 의 앵커에는
        `edge_id` 가 들어 있어, 클릭하면 플로우에서 그 화살표를 포커싱할 수 있습니다.

        `needs_answer` 는 `답변 필요` 섹션입니다. **질문을 클릭하면 답변용 채팅창이 활성화되므로**
        각 항목에 `chat_room_id` 가 함께 옵니다.
      operationId: getAiBriefing
      responses:
        '200':
          description: 조회됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiBriefing'
              example:
                meeting_id: mtg_88
                narrative: 인덱스 설계 논쟁에서는 저장된 근거로 답했고, 마이그레이션 일정은 판단을 유보했습니다.
                used_answers:
                - edge_id: edg_1
                  agenda_id: agd_1
                  excerpt: 인덱스는 team_members(team_id, user_id) 복합으로 갑니다.
                  reason: null
                deferred_answers:
                - edge_id: edg_2
                  agenda_id: agd_3
                  excerpt: 마이그레이션 일정은 제가 정할 수 없습니다.
                  reason: allow_schedule_change=false
                needs_answer:
                - question_id: q_11
                  asker_name: 서재민
                  title: 타 팀원의 질문 1
                  body: 인덱스 추가 시 다운타임이 생기나요?
                  asked_at: '2026-08-07T15:02:00+09:00'
                  chat_room_id: room_412
                settings_version: 8
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
      security:
      - bearerAuth: []
      parameters:
      - name: meeting_id
        in: path
        required: true
        schema:
          type: string
        description: 회의 ID
        example: mtg_88
      - name: mark_read
        in: query
        required: false
        schema:
          type: boolean
          default: true
        description: |-
          읽음으로 찍을지. `false` 면 안 찍습니다.

          플로우 화면은 브리핑 패널을 열든 말든 회의를 열 때 이것을 부릅니다.
          그대로 두면 **회의 화면에 잠깐 들른 것만으로 홈의 `Bordo 브리핑
          보러가기` 가 사라집니다** — 사용자는 읽은 적이 없는데 읽은 것이 됩니다.
          서버는 패널을 열었는지 알 수 없으므로 부르는 쪽이 알려 줘야 합니다.

          기본은 `true` 입니다. 기본을 끄면 이 값을 안 보내는 쪽에서 브리핑이
          영영 안 읽힌 상태로 남아 홈 팝업이 매번 뜹니다.
      - name: q
        in: query
        required: false
        schema:
          type: string
        description: |-
          브리핑 안 검색(`Zero 브리핑` 헤더의 돋보기).
          제목·본문·질문에 걸쳐 걸러서 각 섹션을 좁혀 돌려줍니다.
        example: 일정
