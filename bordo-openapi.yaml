  /api/v1/me/agent/settings/history:
    get:
      tags:
      - 06. AI 대리인 설정
      summary: 정책 버전 이력
      description: |-
        🕓 **2차 범위** — 1차에서는 사람이 직접 입력합니다. 회의 대리인 기능이 안정화된 뒤에 MCP·로컬 AI 연동과 함께 붙입니다. 감사 추적 목적이라면 서버에만 남기고 API 는 빼도 됩니다.

        ---

        각 버전과 그 버전으로 내려진 판정 수를 함께 반환한다.
      operationId: listPolicyHistory
      responses:
        '200':
          description: 조회됨
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        version:
                          type: integer
                        activated_at:
                          type: string
                          format: date-time
                          description: RFC3339 (오프셋 포함)
                        deactivated_at:
                          anyOf:
                          - type: string
                            format: date-time
                            description: RFC3339 (오프셋 포함)
                          - type: 'null'
                        decisions:
                          type: integer
                          description: 이 버전으로 내려진 판정 수
                        changed_by:
                          type: string
                        reason:
                          anyOf:
                          - type: string
                          - type: 'null'
                required:
                - results
              example:
                count: 2
                results:
                - version: 7
                  activated_at: '2026-08-02T11:00:00+09:00'
                  deactivated_at: null
                  decisions: 12
                  changed_by: usr_backend_01
                  reason: null
                - version: 6
                  activated_at: '2026-08-01T09:00:00+09:00'
                  deactivated_at: '2026-08-02T11:00:00+09:00'
                  decisions: 31
                  changed_by: usr_backend_01
                  reason: 초기 설정
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
      security:
      - bearerAuth: []
      parameters: []
  /api/v1/me/agent/settings/rollback:
    post:
      tags:
      - 06. AI 대리인 설정
      summary: 이전 버전으로 롤백
      description: |-
        🕓 **2차 범위** — 1차에서는 사람이 직접 입력합니다. 회의 대리인 기능이 안정화된 뒤에 MCP·로컬 AI 연동과 함께 붙입니다. 감사 추적 목적이라면 서버에만 남기고 API 는 빼도 됩니다.

        ---

        지정 버전을 활성으로 되돌린다. **롤백 자체도 이력에 남는다.**
      operationId: activatePolicyVersion
      responses:
        '200':
          description: 롤백됨
          content:
            application/json:
              schema:
                type: object
                properties:
                  team_id:
                    type: string
                  active_version:
                    type: integer
                  previous_version:
                    type: integer
                  rollback:
                    type: boolean
                  reason:
                    type: string
                  history_entry_id:
                    type: string
                  activated_at:
                    type: string
                    format: date-time
                    description: RFC3339 (오프셋 포함)
              example:
                team_id: team_deputy
                active_version: 6
                previous_version: 8
                rollback: true
                reason: 선제 질문 허용 범위가 너무 넓었음
                history_entry_id: polh_44
                activated_at: '2026-08-03T19:32:00+09:00'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                version:
                  type: integer
                reason:
                  type: string
              required:
              - version
            example:
              version: 6
              reason: 선제 질문 허용 범위가 너무 넓었음
