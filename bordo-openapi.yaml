  /api/v1/sync-conflicts/{conflict_id}/resolve:
    post:
      tags:
      - 11. 동기화
      summary: 충돌 해결
      description: |-
        🕓 **2차 범위** — 1차에서는 사람이 직접 입력합니다. 회의 대리인 기능이 안정화된 뒤에 MCP·로컬 AI 연동과 함께 붙입니다.

        ---

        **허용되는 값은 4가지뿐이며 자동 확정 병합은 금지된다.**

        | resolution | 동작 |
        |---|---|
        | `keep_local` | 로컬 내용으로 새 서버 버전 생성 |
        | `keep_server` | 서버 버전 유지, 로컬 덮어쓰기 |
        | `keep_both` | 양쪽 모두 별도 문서로 보존 |
        | `manual_merge` | 사용자가 병합한 결과를 본문으로 제출 |

        `manual_merge` 가 아닌데 `merged_content` 를 함께 보내면 `VALIDATION_ERROR`.
      operationId: resolveSyncConflict
      responses:
        '200':
          description: 해결됨
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  resolution:
                    $ref: '#/components/schemas/ConflictResolution'
                  resolved_by:
                    type: string
                  note:
                    type: string
                  result:
                    type: object
                    properties:
                      server_document:
                        type: object
                        properties:
                          id:
                            type: string
                          version:
                            type: integer
                      created_document:
                        anyOf:
                        - type: object
                          properties:
                            id:
                              type: string
                            version:
                              type: integer
                            title:
                              type: string
                        - type: 'null'
                  sync_run_id:
                    type: string
                  resolved_at:
                    type: string
                    format: date-time
                    description: RFC3339 (오프셋 포함)
              example:
                id: cf_1
                resolution: keep_both
                resolved_by: usr_backend_01
                note: 로컬 초안과 서버 확정본 모두 보존
                result:
                  server_document:
                    id: doc_030
                    version: 6
                  created_document:
                    id: doc_031
                    version: 1
                    title: current/plan/index.json (로컬 사본)
                sync_run_id: sync_89
                resolved_at: '2026-08-03T19:50:00+09:00'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
      security:
      - bearerAuth: []
      parameters:
      - name: conflict_id
        in: path
        required: true
        schema:
          type: string
        description: 충돌 ID
        example: cf_1
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                resolution:
                  $ref: '#/components/schemas/ConflictResolution'
                note:
                  type: string
                merged_content:
                  anyOf:
                  - type: string
                    description: '`manual_merge` 일 때만 허용'
                  - type: 'null'
              required:
              - resolution
            example:
              resolution: keep_both
              note: 로컬 초안과 서버 확정본 모두 보존
  /api/v1/teams/{team_id}/discord/link:
    post:
      tags:
      - 12. Discord 연동 (웹)
      summary: Discord 계정·길드 연결
      description: |-
        연결 절차 (Discord 설계서 §4)

        1. 사용자가 Discord 에서 `/deputy-connect` 실행
        2. Bot 이 Backend 에 Discord user_id 로 **1회용 연결 코드** 요청
        3. Bot 이 코드를 DM 으로 전달
        4. 사용자가 웹 설정 화면에서 코드 입력 → **이 API 호출**
        5. 관리자가 Guild·채널을 팀에 연결

        코드는 만료·재사용 방지가 적용된다 → `DISCORD_CODE_EXPIRED`, `DISCORD_CODE_ALREADY_USED`

        **구현 메모.** 계정 연결(코드)은 팀 멤버 누구나, `guild_id` 로 서버까지 붙이는 것은 OWNER·ADMIN 만이다.
        일반 멤버가 `guild_id` 를 같이 보내면 계정 연결은 되고 서버 연결만 `403` 이다.
        `channels` 는 아직 저장하지 않는다 — 봇이 회의 스레드를 스스로 만들므로 채널 지정이 필요 없다.
        설정 화면에서 계정만 잇는다면 `POST /me/discord/link` 가 짧다.
      operationId: linkDiscord
      responses:
        '200':
          description: 연결됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscordLink'
              example:
                linked: true
                team_id: team_deputy
                user_id: usr_backend_01
                discord_user_id: '111'
                guild_id: '123456789012345678'
                guild_name: Deputy Dev
                channels:
                  meeting:
                    id: '876543210987654321'
                    name: 회의
                  announcement:
                    id: '998877665544332211'
                    name: 공지
                permissions_ok: true
                linked_at: '2026-08-03T19:51:00+09:00'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '409':
          $ref: '#/components/responses/E409'
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TeamId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                connect_code:
                  type: string
                guild_id:
                  type: string
                channels:
                  type: object
                  additionalProperties:
                    type: string
              required:
              - connect_code
            example:
              connect_code: DPT-4F2A-91C7
              guild_id: '123456789012345678'
              channels:
                meeting: '876543210987654321'
                announcement: '998877665544332211'
    delete:
      tags:
      - 12. Discord 연동 (웹)
      summary: Discord 연결 해제
      description: |-
        `OWNER` · `ADMIN`.

        해제하면 **대기 중인 Outbox 이벤트가 전부 `DEAD` 로 떨어집니다.** 보낼 곳이 없어졌는데
        `RETRY_WAIT` 로 남겨두면 큐가 영원히 비지 않습니다. 응답의 `dropped_outbox_count` 로
        몇 건이 버려졌는지 알려줍니다.
      operationId: unlinkDiscord
      responses:
        '200':
          description: 해제됨
          content:
            application/json:
              schema:
                type: object
                properties:
                  team_id:
                    type: string
                  unlinked_at:
                    type: string
                    format: date-time
                    description: RFC3339 (오프셋 포함)
                  dropped_outbox_count:
                    type: integer
              example:
                team_id: team_a
                unlinked_at: '2026-08-10T11:55:00+09:00'
                dropped_outbox_count: 3
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TeamId'
      - $ref: '#/components/parameters/IdempotencyKey'
  /api/v1/teams/{team_id}/discord/status:
    get:
      tags:
      - 12. Discord 연동 (웹)
      summary: 연결 상태 진단
      description: |-
        필수 Intent 와 권한 보유 여부를 반환한다. 부족하면 `warnings` 에 진단이 담긴다.

        **필수 Intent** `GUILDS`, `GUILD_MESSAGES`, `MESSAGE_CONTENT`, `GUILD_VOICE_STATES`
        **필수 권한** `SEND_MESSAGES`, `EMBED_LINKS`, `CREATE_PUBLIC_THREADS`, `MANAGE_EVENTS`
      operationId: getDiscordStatus
      responses:
        '200':
          description: 조회됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscordStatus'
              example:
                connected: true
                guild_id: '123456789012345678'
                bot_status: READY
                gateway:
                  resumed: true
                  last_heartbeat_at: '2026-08-03T19:51:40+09:00'
                intents:
                  GUILDS: true
                  GUILD_MESSAGES: true
                  MESSAGE_CONTENT: false
                  GUILD_VOICE_STATES: true
                permissions:
                  SEND_MESSAGES: true
                  EMBED_LINKS: true
                  CREATE_PUBLIC_THREADS: true
                  MANAGE_EVENTS: false
                warnings:
                - code: INTENT_MISSING
                  detail: MESSAGE_CONTENT 인텐트가 없어 질문 본문을 분석할 수 없습니다.
                - code: PERMISSION_MISSING
                  detail: MANAGE_EVENTS 권한이 없어 Discord 예약 이벤트를 만들 수 없습니다.
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TeamId'
  /internal/v1/meetings/participants:
    get:
      tags:
      - 13. Internal API (Discord Bot)
      summary: 이 회의의 참석·대리 상태
      description: |-
        봇이 회의를 열 때 `○○ 님은 Bordo 가 대신 참석합니다` 를 게시하고, 참석 여부를 물을 대상을 고르는 데 쓴다.

        **봇의 인메모리 상태를 대신한다.** 지금 봇은 대리 대상자를 모듈 전역 `set` 에, 진행 중 회의를 cog 의 dict 에 들고 있어
        재시작하면 통째로 잃는데 서버에 되물을 경로가 없었다. 진실의 원본을 서버 하나로 모은다(설계 2원칙).

        | 필드 | 뜻 |
        |---|---|
        | `will_speak` | 이 발언에 대리인이 깨어날 사람인가. **서버의 대상 판정(`targeting.candidates`)과 같은 식**이다 |
        | `asked` | 참석 여부를 이미 정했는가. `false` 면 팝업으로 물어볼 대상 |
        | `prepared` | 준비 화면을 얼마나 채웠는가 (`points` 는 회의 전체, `stances` 는 그 사람 것) |
        | `has_note` | 회의 한정 지시가 있는가. 봇은 내용을 해석하지 않는다 — 대리인이 쓴다 |

        `will_speak` 을 봇이 자기 규칙으로 판단하면 "대신 참석합니다" 라고 알렸는데 정작 대리인이 안 깨어난다.
      operationId: internalMeetingParticipants
      responses:
        '200':
          description: 조회됨
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  meeting_id:
                    type: string
                  title:
                    type: string
                  status:
                    type: string
                  project_id:
                    type: string
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        user_id: {type: string}
                        discord_user_id: {type: string, nullable: true}
                        name: {type: string}
                        attendance: {type: string}
                        delegated: {type: boolean}
                        agent_name: {type: string}
                        will_speak: {type: boolean}
                        asked: {type: boolean}
                        has_note: {type: boolean}
                        prepared:
                          type: object
                          properties:
                            points: {type: integer}
                            stances: {type: integer}
              example:
                count: 2
                meeting_id: meeting_3
                title: 글로벌 회의 일정 및 개발 방향 논의
                status: ACTIVE
                project_id: prj_b
                results:
                - user_id: usr_backend_01
                  discord_user_id: '111'
                  name: 서재민
                  attendance: DELEGATED
                  delegated: true
                  agent_name: 서재민의 Bordo
                  will_speak: true
                  asked: true
                  has_note: true
                  prepared:
                    points: 3
                    stances: 2
                - user_id: usr_front_01
                  discord_user_id: '222'
                  name: 임수연
                  attendance: PENDING
                  delegated: false
                  agent_name: 임수연의 Bordo
                  will_speak: false
                  asked: false
                  has_note: false
                  prepared:
                    points: 3
                    stances: 0
        '400':
          description: '`thread_id` 없음. 빈 값으로 조회하면 웹에서 만든 회의(`discord_channel_id=""`)가 잡힌다.'
        '401':
          $ref: '#/components/responses/E401'
        '404':
          description: 이 스레드에 연결된 회의 없음 (`MEETING_NOT_FOUND`)
      security:
      - serviceToken: []
      parameters:
      - name: thread_id
        in: query
        required: true
        schema:
          type: string
        description: Discord 스레드 id
        example: '876543210987654321'
  /internal/v1/meetings/absence:
    post:
      tags:
      - 13. Internal API (Discord Bot)
      summary: 회의 하나에 대한 불참 등록 / 해제
      description: |-
        회의 시작 팝업의 `불참하기` 가 여기로 들어온다.

        **`/internal/v1/delegate/on` 과 다르다.** 그쪽은 그 사용자의 예정·확정·진행 중 회의를 **한꺼번에** 뒤집는다 —
        팝업에서 불참을 한 번 누르면 오늘 남은 회의가 전부 넘어간다.

        웹의 `POST /api/v1/meetings/{id}/absence` 와 **같은 함수를 지난다.**
        봇으로 들어왔다고 다른 상태가 되면 화면 뱃지가 경로에 따라 갈린다.
      operationId: internalMeetingAbsence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                thread_id:
                  type: string
                discord_user_id:
                  type: string
                delegated:
                  type: boolean
                  default: true
                  description: '`false` 면 참여로 되돌린다'
              required:
              - thread_id
              - discord_user_id
            example:
              thread_id: '876543210987654321'
              discord_user_id: '111'
              delegated: true
      responses:
        '200':
          description: 반영됨
          content:
            application/json:
              schema:
                type: object
                properties:
                  meeting_id: {type: string}
                  user_id: {type: string}
                  delegated: {type: boolean}
                  attendance: {type: string}
              example:
                meeting_id: meeting_3
                user_id: usr_backend_01
                delegated: true
                attendance: DELEGATED
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '404':
          description: 연결된 계정 없음(`USER_NOT_FOUND`) · 스레드에 연결된 회의 없음(`MEETING_NOT_FOUND`)
        '409':
          description: 이미 끝난 회의 (`MEETING_LOCKED`)
      security:
      - serviceToken: []
  /internal/v1/discord/messages:
    post:
      tags:
      - 13. Internal API (Discord Bot)
      summary: Discord 메시지 전달
      description: |-
        **이 서비스에서 가장 중요한 진입점.** Bot 이 `MESSAGE_CREATE` 를 필터링해 전달한다.
        Bot·대리인이 보낸 메시지는 제외하고, 연결된 팀 채널만 올린다.

        **멱등 키** `guild_id + channel_id + message_id`
        같은 키가 다시 오면 `409 DUPLICATE_EVENT` 를 반환한다. **Bot 은 이를 성공으로 처리하고 재게시하지 않는다.**

        이 요청 이후 서버 내부 흐름:
        `Meeting Coordinator(대상 판정) → Agent Router → ReAct Engine → Search → POLICY → Outbox → Discord`
      operationId: internalDiscordMessage
      responses:
        '202':
          description: 수락됨 — 대리인에게 라우팅
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted:
                    type: boolean
                  message_id:
                    type: string
                  meeting_id:
                    anyOf:
                    - type: string
                    - type: 'null'
                  idempotency_key:
                    type: string
                  coordinator:
                    type: object
                    properties:
                      decision:
                        type: string
                        enum:
                        - ROUTE_AGENT
                        - ROUTE_HUMAN
                        - ASK_CLARIFICATION
                        - BLOCK_DUPLICATE
                        - BLOCK_LOOP
                      target_user_id:
                        anyOf:
                        - type: string
                        - type: 'null'
                      reason_codes:
                        type: array
                        items:
                          type: string
                      hop_count:
                        type: integer
                      max_hops:
                        type: integer
                  run_id:
                    anyOf:
                    - type: string
                    - type: 'null'
                  accepted_at:
                    type: string
                    format: date-time
                    description: RFC3339 (오프셋 포함)
              example:
                accepted: true
                message_id: mm_1042
                meeting_id: meeting_3
                idempotency_key: 123:456:789
                coordinator:
                  decision: ROUTE_AGENT
                  target_user_id: usr_backend_01
                  reason_codes:
                  - CATEGORY_MATCH
                  - OWNER_ABSENT
                  - DELEGATION_ENABLED
                  hop_count: 1
                  max_hops: 3
                run_id: run_72
                accepted_at: '2026-08-07T10:10:22+09:00'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          description: '`AUTH_SERVICE_TOKEN_INVALID`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                success: false
                request_id: 88bb...
                error:
                  code: AUTH_SERVICE_TOKEN_INVALID
                  message: 유효하지 않은 서비스 토큰입니다.
                  retryable: false
        '409':
          description: '`DUPLICATE_EVENT` — **Bot 은 성공으로 처리하고 재게시하지 않는다**'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                success: false
                request_id: 77aa...
                error:
                  code: DUPLICATE_EVENT
                  message: 이미 처리된 Discord 메시지입니다.
                  retryable: false
                  details:
                    idempotency_key: 123:456:789
                    original_message_id: mm_1042
                    original_run_id: run_72
      security:
      - serviceToken: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                guild_id:
                  type: string
                channel_id:
                  type: string
                message_id:
                  type: string
                author_discord_id:
                  type: string
                content:
                  type: string
                mentions:
                  type: array
                  items:
                    type: string
                thread_id:
                  anyOf:
                  - type: string
                  - type: 'null'
                meeting_id:
                  anyOf:
                  - type: string
                  - type: 'null'
                created_at:
                  type: string
                  format: date-time
                  description: RFC3339 (오프셋 포함)
                idempotency_key:
                  type: string
              required:
              - guild_id
              - channel_id
              - message_id
              - author_discord_id
              - content
              - idempotency_key
            example:
              guild_id: '123456789012345678'
              channel_id: '876543210987654321'
              message_id: '789'
              author_discord_id: '111'
              content: 현재 DB 구조에서 여러 팀을 지원할 수 있나요?
              mentions: []
              thread_id: null
              meeting_id: meeting_3
              created_at: '2026-08-07T10:10:22Z'
              idempotency_key: 123:456:789
  /internal/v1/discord/interactions:
    post:
      tags:
      - 13. Internal API (Discord Bot)
      summary: Slash Command / 버튼 인터랙션
      description: |-
        등록된 Slash Command·버튼만 전달한다.

        | 명령 | 동작 |
        |---|---|
        | `/deputy-connect` | 계정 연결 코드 DM |
        | `/deputy-team` | 연결 팀 확인·선택 |
        | `/meeting-start` | 참석자 수집, 세션 시작 |
        | `/meeting-end` | 회의 종료, 보고서 처리 시작 |
        | `/meeting-status` | 현재 회의·대리 참석자 표시 |
        | `/ask-deputy` | 특정 대리인에게 질문 |
        | `/delegate-on` · `/delegate-off` | 내 대리 참석 on/off |
      operationId: internalDiscordInteraction
      responses:
        '202':
          description: 수락됨
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted:
                    type: boolean
                  command:
                    type: string
                  run_id:
                    anyOf:
                    - type: string
                    - type: 'null'
                  reply:
                    type: object
                    additionalProperties: true
                    description: Bot 이 즉시 표시할 임시 응답
              example:
                accepted: true
                command: ask-deputy
                run_id: run_75
                reply:
                  ephemeral: true
                  text: 최비성님의 대리인에게 질문을 전달했습니다.
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '409':
          $ref: '#/components/responses/E409'
      security:
      - serviceToken: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                interaction_id:
                  type: string
                type:
                  type: string
                  enum:
                  - APPLICATION_COMMAND
                  - MESSAGE_COMPONENT
                command:
                  type: string
                guild_id:
                  type: string
                channel_id:
                  type: string
                author_discord_id:
                  type: string
                options:
                  type: object
                  additionalProperties: true
                idempotency_key:
                  type: string
              required:
              - interaction_id
              - type
              - idempotency_key
            example:
              interaction_id: i_9001
              type: APPLICATION_COMMAND
              command: ask-deputy
              guild_id: '123456789012345678'
              channel_id: '876543210987654321'
              author_discord_id: '111'
              options:
                target: usr_backend_01
                question: 인덱스 전략 어떻게 가나요?
              idempotency_key: i_9001
  /internal/v1/discord/presence:
    post:
      tags:
      - 13. Internal API (Discord Bot)
      summary: Bot Presence 보고 · 사람 접속 상태
      description: |-
        두 용도를 한 경로로 받는다.

        - **봇 생존 신호** — `discord_user_id` 없이 `{status, at}` 만 보내면 (`on_ready` · `on_resumed`) 서버 캐시에 남고 `GET /teams/{id}/discord/status` 의 `bot_status` 가 `READY` 가 된다. 응답 `202`.
        - **사람 접속 상태** — `discord_user_id` + `status`(online·idle·dnd·offline·invisible). 진행 중 회의의 참석 상태를 갱신한다. 대리 참석을 켠 사람은 건드리지 않는다.

        Gateway 종료 시 Bot 은 **Resume 우선, 실패하면 Identify** 로 재연결한다.
      operationId: internalDiscordPresence
      responses:
        '200':
          description: 기록됨
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  bot_status:
                    type: string
                  guilds_linked:
                    type: integer
                  intents_ok:
                    type: boolean
                  diagnostics:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                        detail:
                          type: string
                  recorded_at:
                    type: string
                    format: date-time
                    description: RFC3339 (오프셋 포함)
              example:
                ok: true
                bot_status: READY
                guilds_linked: 1
                intents_ok: true
                diagnostics: []
                recorded_at: '2026-08-07T09:59:00+09:00'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
      security:
      - serviceToken: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bot_status:
                  type: string
                  enum:
                  - READY
                  - RESUMING
                  - DISCONNECTED
                guild_ids:
                  type: array
                  items:
                    type: string
                intents_ok:
                  type: boolean
                resumed:
                  type: boolean
              required:
              - bot_status
            example:
              bot_status: READY
              guild_ids:
              - '123456789012345678'
              intents_ok: true
              resumed: false
  /internal/v1/meetings/start:
    post:
      tags:
      - 13. Internal API (Discord Bot)
      summary: 회의 시작
      description: |-
        `/meeting-start` 처리. 음성 채널 참석자와 텍스트 채널 좌표를 전달한다.

        Backend 는 `meeting_id` 와 **대리 참석자 정보**를 돌려주고, Bot 은 이를 메모리에 보관해 이후 메시지에 `meeting_id` 를 붙인다.
      operationId: internalMeetingStart
      responses:
        '201':
          description: 회의 ACTIVE
          content:
            application/json:
              schema:
                type: object
                properties:
                  meeting_id:
                    type: string
                  status:
                    type: string
                    enum:
                    - ACTIVE
                  title:
                    type: string
                  started_at:
                    type: string
                    format: date-time
                    description: RFC3339 (오프셋 포함)
                  started_by:
                    type: string
                  present:
                    type: array
                    items:
                      type: object
                      properties:
                        discord_id:
                          type: string
                        user_id:
                          type: string
                        name:
                          type: string
                  delegates:
                    type: array
                    items:
                      $ref: '#/components/schemas/Delegate'
                  agenda:
                    type: array
                    items:
                      $ref: '#/components/schemas/AgendaItem'
              example:
                meeting_id: meeting_3
                status: ACTIVE
                title: 다중 팀 DB 구조 리뷰
                started_at: '2026-08-07T10:01:00+09:00'
                started_by: usr_front_01
                present:
                - discord_id: '222'
                  user_id: usr_front_01
                  name: 임수연
                delegates:
                - user_id: usr_backend_01
                  name: 최비성
                  enabled: true
                  allowed_categories:
                  - database
                  - backend
                  speak_mode: AUTO
                  policy_version: 7
                agenda:
                - id: ag_1
                  title: team_members 스키마
                  category: database
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '409':
          description: '`MEETING_ALREADY_STARTED`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - serviceToken: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                guild_id:
                  type: string
                voice_channel_id:
                  type: string
                text_channel_id:
                  type: string
                started_by_discord_id:
                  type: string
                participants:
                  type: array
                  items:
                    type: object
                    properties:
                      discord_id:
                        type: string
                agenda_ids:
                  type: array
                  items:
                    type: string
              required:
              - guild_id
              - text_channel_id
              - started_by_discord_id
            example:
              guild_id: '123456789012345678'
              voice_channel_id: '112233445566778899'
              text_channel_id: '876543210987654321'
              started_by_discord_id: '222'
              participants:
              - discord_id: '222'
              agenda_ids: []
  /internal/v1/meetings/end:
    post:
      tags:
      - 13. Internal API (Discord Bot)
      summary: 회의 종료
      description: |-
        `/meeting-end` 처리.

        **Bot 은 즉시 보고서를 만들지 않는다.** Backend 가 `PROCESSING_REPORT` 로 전이해 Celery 로 생성하고, 완료되면 Outbox 로 보고서 링크와 미해결 질문 알림을 내보낸다.
      operationId: internalMeetingEnd
      responses:
        '200':
          description: 보고서 생성 대기
          content:
            application/json:
              schema:
                type: object
                properties:
                  meeting_id:
                    type: string
                  status:
                    type: string
                    enum:
                    - PROCESSING_REPORT
                    - ENDED
                  ended_at:
                    type: string
                    format: date-time
                    description: RFC3339 (오프셋 포함)
                  ended_by:
                    type: string
                  duration_min:
                    type: integer
                  message_count:
                    type: integer
                  report_task_id:
                    type: string
              example:
                meeting_id: meeting_3
                status: PROCESSING_REPORT
                ended_at: '2026-08-07T11:02:00+09:00'
                ended_by: usr_front_01
                duration_min: 61
                message_count: 27
                report_task_id: celery_rp_9044
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '409':
          description: '`MEETING_ALREADY_ENDED`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - serviceToken: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                meeting_id:
                  type: string
                ended_by_discord_id:
                  type: string
                ended_at:
                  type: string
                  format: date-time
                  description: RFC3339 (오프셋 포함)
                participants:
                  type: array
                  items:
                    type: object
                    properties:
                      discord_id:
                        type: string
              required:
              - meeting_id
              - ended_by_discord_id
            example:
              meeting_id: meeting_3
              ended_by_discord_id: '222'
              ended_at: '2026-08-07T11:02:00Z'
              participants:
              - discord_id: '111'
              - discord_id: '222'
  /internal/v1/meetings/{meeting_id}/participant-events:
    post:
      tags:
      - 13. Internal API (Discord Bot)
      summary: 참석자 입퇴장 이벤트
      description: '`VOICE_STATE_UPDATE` 중 활성 회의의 음성 채널만 전달한다. 소유자가 실제로 들어오면 대리 발언 모드를 승인형으로 전환할 수 있다.'
      operationId: internalParticipantEvents
      responses:
        '200':
          description: 기록됨
          content:
            application/json:
              schema:
                type: object
                properties:
                  meeting_id:
                    type: string
                  recorded:
                    type: integer
                  present_now:
                    type: array
                    items:
                      type: string
                  delegate_changes:
                    type: array
                    items:
                      type: object
                      properties:
                        user_id:
                          type: string
                        from:
                          type: string
                        to:
                          type: string
                        reason:
                          type: string
                  recorded_at:
                    type: string
                    format: date-time
                    description: RFC3339 (오프셋 포함)
