  /api/v1/meetings/{meeting_id}/delegate:
    post:
      tags:
      - 09. 회의
      summary: 대리 참석 활성화 / 해제
      description: |-
        **이 서비스의 핵심 엔드포인트.** 자리를 비우는 팀원이 자신의 대리인에게 *어떤 카테고리에서 무엇까지* 허용할지 지정한다.
        이 요청 없이는 대리인이 회의에서 한 마디도 하지 않는다.

        | 필드 | 의미 |
        |---|---|
        | `allowed_categories` | 발언 허용 카테고리. **여기 없는 주제는 무조건 유보** |
        | `capabilities` | `ANSWER_QUESTIONS`, `ASK_QUESTIONS`, `PROPOSE_TASK`, `PROPOSE_SCHEDULE`, `SPEAK_IN_MEETING` |
        | `policy_version` | 이 회의에 **고정**할 정책 버전. 회의 중 정책을 바꿔도 흔들리지 않는다 |
        | `speak_mode` | `AUTO` / `APPROVE_BEFORE_SPEAK` / `SILENT` |

        사용자가 회의에 직접 들어오면 프론트가 `enabled=false` 또는 `speak_mode=APPROVE_BEFORE_SPEAK` 로 자동 전환할 수 있다.

        ---

        ⚠️ **구현은 아래 모양입니다.** 위 표는 v1 잔재이고 `allowed_categories` ·
        `capabilities` · `speak_mode` · `policy_version` 은 서버에 없습니다.
        화면(불참 등록 팝업)에 대응하는 입력이 없어 만들지 않았습니다.

        ```
        요청   { "enabled": true,
                 "sources": ["work", "plan", "thought", "document"],
                 "prompt": "일정 확정은 하지 말고 의견만 전해 주세요." }

        응답   { "meeting_id", "user_id", "delegated", "attendance",
                 "prompt", "sources" }
        ```

        `sources` 는 이 회의에서 대리인이 **근거로 쓸 자료 종류**입니다. 개인
        설정의 공개 범위와 **둘 다** 통과해야 나갑니다.

        | 보낸 값 | 뜻 |
        |---|---|
        | 키 없음 | 지금 값을 그대로 둔다 |
        | `null` | 고른 적 없음으로 되돌린다 (제한 없음) |
        | `[]` | **아무 자료도 쓰지 않는다** — 회의 발언만 듣고 답하거나 유보한다 |
        | `["work"]` | 작업 현황만 |

        목록에 없는 값은 `400 VALIDATION_ERROR` 입니다.

        `prompt` 는 **키가 없어도 빈 문자열로 덮어씁니다.** 자료 범위만 다시
        고르려던 사람이 지시를 잃지 않도록 화면이 항상 함께 보냅니다.
      operationId: setDelegation
      responses:
        '200':
          description: 설정됨
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Delegate'
                - type: object
                  properties:
                    meeting_id:
                      type: string
                    disabled_reason:
                      anyOf:
                      - type: string
                      - type: 'null'
                    pending_utterances_cancelled:
                      type: integer
              examples:
                활성화:
                  summary: 대리 참석 ON
                  value:
                    meeting_id: meeting_3
                    user_id: usr_backend_01
                    name: 최비성
                    enabled: true
                    allowed_categories:
                    - database
                    - backend
                    capabilities:
                    - READ_TEAM_CONTEXT
                    - ANSWER_QUESTIONS
                    - SPEAK_IN_MEETING
                    - PROPOSE_TASK
                    speak_mode: AUTO
                    policy_version: 7
                해제 (사용자 직접 참석):
                  summary: enabled=false. 대기 중이던 발화도 취소된다
                  value:
                    meeting_id: meeting_3
                    user_id: usr_backend_01
                    enabled: false
                    disabled_reason: USER_JOINED_MEETING
                    pending_utterances_cancelled: 1
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
      security:
      - bearerAuth: []
      parameters:
      - name: meeting_id
        in: path
        required: true
        schema:
          type: string
        description: 회의 ID
        example: meeting_3
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
                allowed_categories:
                  type: array
                  items:
                    $ref: '#/components/schemas/Category'
                capabilities:
                  type: array
                  items:
                    $ref: '#/components/schemas/AgentCapability'
                policy_version:
                  type: integer
                speak_mode:
                  type: string
                  enum:
                  - AUTO
                  - APPROVE_BEFORE_SPEAK
                  - SILENT
              required:
              - enabled
            example:
              enabled: true
              allowed_categories:
              - database
              - backend
              capabilities:
              - READ_TEAM_CONTEXT
              - ANSWER_QUESTIONS
              - SPEAK_IN_MEETING
              - PROPOSE_TASK
              policy_version: 7
              speak_mode: AUTO
  /api/v1/meetings/{meeting_id}/absence:
    post:
      tags:
      - 09. 회의
      summary: 회의 불참 등록 (= 대리 참석 켜기)
      description: |-
        홈 「오늘 일정」의 `회의에 참여하지 않아요` 와 Discord 회의 시작 팝업의 `불참하기` 가 여기로 들어온다.

        **불참 등록은 곧 대리 참석 켜기다.** 화면 문구는 `회의에 참여하지 않아요` 지만 뱃지는 `Bordo 대리 참석 예정` 이다 —
        자리를 비우는 것과 대리인을 보내는 것이 이 서비스에서는 같은 행위다.
        `delegated=false` 로 두면 회의 후 브리핑이 통째로 안 생겨(브리핑은 대리 참석자에게만 만들어진다)
        사용자는 없는 사이 무슨 일이 있었는지 못 본다.

        본문이 없다. 세부 설정은 준비 화면에서 따로 저장한다 — 여기서 함께 받으면 버튼 하나가 준비 화면의 입력을 덮는다.
        이미 켜져 있으면 `200` + `created: false` 다(오류가 아니다).

        **`delegate_prompt` 와 `allowed_sources` 는 건드리지 않는다.** 껐다 켰다 할 때 준비 화면에서 적어 둔 것이 사라지면 안 된다.

        > `POST /meetings/{id}/delegate` 와 다르다. 그쪽은 `prompt` 키가 없으면 빈 문자열로 덮어쓰는 **전량 교체** 계약이고
        > 홈의 대리 참석 팝업이 이미 그 계약으로 붙어 있다. `delegated` 플래그의 단일 진입점은 이쪽이다.
      operationId: registerMeetingAbsence
      responses:
        '201':
          description: 등록됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingPrepHeader'
              example:
                meeting_id: meeting_3
                title: 글로벌 회의 일정 및 개발 방향 논의
                project_name: 멋사 중앙해커톤
                team_name: AX Lions
                scheduled_at: '2026-08-18T14:00:00+09:00'
                ends_at: '2026-08-18T15:00:00+09:00'
                when: 8월 18일 14:00 - 15:00
                location: Discord
                status: CONFIRMED
                delegated: true
                badge: 서재민의 Bordo 대리 참석 예정
                prep_url: /api/v1/meetings/meeting_3/prep
                created: true
        '200':
          description: '이미 등록돼 있었음 (`created: false`)'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          description: 이 회의의 참석자가 아님 (`STATE_NOT_FOUND`). **403 이 아니다** — 권한 문제로 읽히면 초대해 달라고 해야 할 사람이 관리자에게 권한을 달라고 한다.
        '409':
          description: 이미 끝난 회의 (`MEETING_LOCKED`)
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/MeetingId'
    delete:
      tags:
      - 09. 회의
      summary: 불참 해제 (참여로 되돌리기)
      description: |-
        진행 중인 회의면 `PRESENT`, 아직 안 열렸으면 `PENDING` 이다. 열리지도 않은 회의를 `PRESENT` 로 두면 참석자 목록에 이미 와 있는 사람으로 그려진다.

        **적어 둔 입장과 설정은 지우지 않는다.** 마음을 바꿔 다시 불참을 누르는 일이 실제로 있고, 그때 다시 쓰게 하면 화면을 두 번 채우게 된다.
      operationId: cancelMeetingAbsence
      responses:
        '200':
          description: '해제됨 (`delegated: false`)'
        '401':
          $ref: '#/components/responses/E401'
        '404':
          $ref: '#/components/responses/E404'
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/MeetingId'
  /api/v1/meetings/{meeting_id}/prep:
    get:
      tags:
      - 09. 회의
      summary: 회의 대리 참석 준비 화면
      description: |-
        헤더 · 예상 논쟁점 · 내 입장 · Bordo 활동 설정을 **한 번에** 내려준다.
        화면이 네 번 부르면 그 사이 불참을 취소했을 때 헤더는 `참석 예정` 인데 아래는 대리인 설정을 그리고 있는 상태가 나온다.

        ### 논쟁점 상태 뱃지

        | 값 | 화면 |
        |---|---|
        | `NEEDED` | `답변필요` |
        | `ANSWERED` | `답변완료` |

        `답변중...` 은 서버에 없다. 펼쳐 놓고 타이핑 중이라는 뜻이라 서버가 알 수 없고, 저장되면 곧 `답변완료` 다.

        ### 예상 논쟁점은 언제 생기는가

        불참을 등록하면 서버가 예측을 걸어 둔다(비동기). 다 만들어지면 WebSocket `meeting.debate.ready` 가 나간다.
        모델이 없거나 실패하면 **회의 안건에서 규칙으로** 만들고 `created_by_agent: false` 로 표시한다 —
        화면이 `Bordo가 예상했어요` 문구를 붙이지 않게 하기 위해서다.

        ### 설정을 둘 다 내려주는 이유

        화면에 `현재 설정 사용` 과 `이번에만 다르게 사용` 이 나란히 있다. 되돌렸을 때 무엇으로 돌아가는지 보여주려면 실제 적용값(`settings`)과 평소 값(`standing_settings`)이 둘 다 있어야 한다.
        `standing_prompt_limit` 은 평소 지시가 실제로 몇 개 실리는지다(최근 5개) — 화면이 이 수를 모르면 여섯 번째 카드가 조용히 무시되는데 사용자는 적어 둔 것이 지켜진다고 믿는다.
      operationId: getMeetingPrep
      responses:
        '200':
          description: 조회됨
          content:
            application/json:
              schema:
                type: object
                properties:
                  header:
                    $ref: '#/components/schemas/MeetingPrepHeader'
                  debate:
                    type: object
                    properties:
                      notice:
                        type: string
                        description: 화면 부제. 개수가 들어가므로 서버가 완성한다.
                      count:
                        type: integer
                      answered_count:
                        type: integer
                      points:
                        type: array
                        items:
                          $ref: '#/components/schemas/DebatePoint'
                  agent_setup:
                    $ref: '#/components/schemas/MeetingAgentSetup'
                required:
                - header
                - debate
                - agent_setup
              example:
                header:
                  meeting_id: meeting_3
                  title: 글로벌 회의 일정 및 개발 방향 논의
                  project_name: 멋사 중앙해커톤
                  team_name: AX Lions
                  when: 8월 18일 14:00 - 15:00
                  location: Discord
                  status: CONFIRMED
                  delegated: true
                  badge: 서재민의 Bordo 대리 참석 예정
                debate:
                  notice: Bordo가 회의 자료와 이전 논의를 바탕으로 3개의 논쟁점을 예상했어요.
                  count: 3
                  answered_count: 1
                  points:
                  - id: dp_2
                    order: 2
                    label: 논쟁점 02
                    title: 개발 범위를 축소할 것인가, 기존 범위를 유지할 것인가?
                    options:
                    - key: A
                      title: 핵심 기능만 구현
                      description: 남은 기간을 고려해 기능 범위를 축소
                    - key: B
                      title: 기존 기획 범위 유지
                      description: 계획한 기능을 최대한 구현
                    rationale: 이전 회의에서 기능 범위를 축소하자는 의견이 있었고, 이후 개발 일정이 하루 지연되었어요.
                    evidence:
                    - kind: meeting
                      title: 8월 15일 · 기능 구현 범위 논의
                      who: 최비성
                      at: '2026-08-15T14:32:00+09:00'
                      body: 남은 기간을 생각하면 핵심 기능부터 구현해야 할 것 같아요.
                      link:
                        label: 회의에서 보기
                        meeting_id: meeting_2
                    - kind: work
                      title: 8월 16일 · 작업 변경사항
                      who: 서재민의 작업
                      at: '2026-08-16T09:10:00+09:00'
                      body: 완료 예정일이(가) 8월 17일 → 8월 18일 로 바뀌었어요.
                      link:
                        label: 작업에서 보기
                        work_item_id: work_44
                    created_by_agent: true
                    status: NEEDED
                    status_label: 답변필요
                    stance: null
                agent_setup:
                  mode: ONCE
                  mode_label: 이번에만 다르게 사용
                  settings:
                    mention_feasibility: true
                    allow_schedule_change: true
                    allow_midmeeting_question: false
                    disclose_work: false
                    disclose_plan: true
                    disclose_thought: false
                    tone: FORMAL
                  standing_settings:
                    disclose_work: true
                    disclose_plan: true
                    disclose_thought: true
                  overridden_keys:
                  - disclose_work
                  - disclose_thought
                  prompts:
                  - 상단에 입력한 메시지들은 개인적인 내용이니 공유하지 마
                  standing_prompts:
                  - id: ap_1
                    body: 상단에 입력한 메시지들은 개인적인 내용이니 공유하지 마
                  standing_prompt_limit: 1
                  extra_note: 이번 회의에서는 일정 얘기를 꺼내지 마
                  sources:
                  - work
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/MeetingId'
  /api/v1/meetings/{meeting_id}/agent-setup:
    put:
      tags:
      - 09. 회의
      summary: 이번 회의에만 적용할 Bordo 활동 설정
      description: |-
        **보낸 것만 바꾼다.** 화면에 `적용하기` 가 셋(현재 설정 사용 · 이번에만 다르게 · 추가 설정)이라
        전량 교체로 두면 한 버튼이 다른 버튼의 입력을 지운다.

        | `mode` | 동작 |
        |---|---|
        | `STANDING` | 덮어쓴 것을 전부 지우고 평소 설정으로 돌아간다. 함께 온 `settings` 는 무시한다 |
        | `ONCE` | `settings` · `prompts` 를 이번 회의에만 적용한다 |
        | 없음 | 보낸 키만 바꾼다 |

        `prompts` 의 `null` 과 `[]` 는 다르다 — `null` 은 "평소 것 그대로", `[]` 는 "아무 프롬프트도 안 씀" 이다.
        같게 다루면 프롬프트를 전부 지운 사람의 대리인이 평소 지시를 그대로 쓴다. (`sources` 와 같은 규칙)

        바꿀 수 있는 설정은 화면의 토글 6개 + `tone` 뿐이다. `agent_name` · `active_version` 은 `400` 이다 —
        회의 하나 때문에 대리인 호칭이 바뀌면 다른 회의의 플로우 노드와 이름이 갈린다.
        모르는 키를 조용히 버리지 않는 이유는, 화면은 저장됐다고 하는데 대리인은 그 설정을 안 보기 때문이다.

        **평소 설정(`/me/agent/settings`)은 건드리지 않는다.** 회의 하나 때문에 평소 설정을 바꿔 두면
        끝난 뒤 되돌리는 것이 사람 몫이 되고 대개 잊는다 — 다음 회의에서 켜 둔 줄 알았던 것이 꺼져 있다.
      operationId: setMeetingAgentSetup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mode:
                  type: string
                  enum:
                  - STANDING
                  - ONCE
                settings:
                  type: object
                  description: 토글 6개 + tone. 바꿀 것만 담는다.
                  additionalProperties: true
                prompts:
                  anyOf:
                  - type: array
                    items:
                      type: string
                  - type: 'null'
                  description: '`null` = 평소 것 그대로, `[]` = 아무것도 안 씀'
                extra_note:
                  type: string
                  description: 「추가 설정」 자유 입력. 평소 지시보다 뒤에 실려 우선한다.
                sources:
                  anyOf:
                  - type: array
                    items:
                      type: string
                  - type: 'null'
            example:
              mode: ONCE
              settings:
                disclose_work: false
                disclose_thought: false
              extra_note: 이번 회의에서는 일정 얘기를 꺼내지 마
      responses:
        '200':
          description: 저장됨. 본문은 `prep` 의 `agent_setup` 과 같은 모양이다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingAgentSetup'
        '400':
          description: 모르는 설정 키 · 없는 말투 · 잘못된 `mode` · 모르는 `sources` 값
        '401':
          $ref: '#/components/responses/E401'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          description: 이미 끝난 회의 (`MEETING_LOCKED`)
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/MeetingId'
  /api/v1/debate-points/{point_id}/stance:
    put:
      tags:
      - 09. 회의
      summary: 논쟁점에 대한 나의 입장 저장
      description: |-
        `PUT` 인 이유는 **사람마다 하나**이기 때문이다. 같은 쟁점에 내 입장이 둘이면 대리인이 어느 쪽으로 말할지 정할 수 없다.
        두 번 보내면 갱신이다.

        여기 적은 것은 **대리인 프롬프트의 맨 뒤**에 실린다. 쟁점 하나에 대한 본인의 답이라 평소 지시·회의별 지시보다 구체적이고,
        어긋날 때 이쪽이 이겨야 한다.

        `option_key` 는 선택이다. 화면의 A/B 를 고르지 않고 글만 적는 것이 정상이라 저장을 막지 않는다.
        다만 그 논쟁점에 **없는** 키를 보내면 `400` + 고를 수 있었던 목록이다 — 조용히 버리면 사용자는 A 를 골랐는데 대리인은 아무것도 안 고른 채 말한다.
      operationId: setDebateStance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                body:
                  type: string
                option_key:
                  type: string
                  description: 고른 선택지. 비워 둘 수 있다.
              required:
              - body
            example:
              body: 남은 기간을 보면 핵심 기능부터 구현하는 쪽이 맞아요.
              option_key: A
      responses:
        '201':
          description: 처음 저장됨. 본문은 `DebatePoint`(내 입장 포함).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DebatePoint'
        '200':
          description: 갱신됨
        '400':
          description: 빈 본문 · 그 논쟁점에 없는 `option_key`
        '401':
          $ref: '#/components/responses/E401'
        '404':
          description: 논쟁점 없음(`DEBATE_POINT_NOT_FOUND`) · 이 회의의 참석자가 아님(`STATE_NOT_FOUND`)
        '409':
          description: 이미 끝난 회의 (`MEETING_LOCKED`)
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/DebatePointId'
    delete:
      tags:
      - 09. 회의
      summary: 내 입장 삭제
      description: |-
        화면의 ⋮ 메뉴. 없는 입장을 지우면 `404` 다 — `204` 를 주면 애초에 저장이 안 됐던 것을 사용자가 못 알아챈다.
      operationId: deleteDebateStance
      responses:
        '204':
          description: 삭제됨
        '401':
          $ref: '#/components/responses/E401'
        '404':
          $ref: '#/components/responses/E404'
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/DebatePointId'
  /api/v1/meetings/{meeting_id}/prebrief/generate:
    post:
      tags:
      - 09. 회의
      summary: 사전 브리핑 생성 (비동기) — ⛔ 대체됨
      description: |-
        ⛔ **`POST /meetings/{id}/absence` + `GET /meetings/{id}/prep` 으로 대체됐다.**
        읽을 오퍼레이션(`poll_url` 이 가리키는 `GET .../prebrief`)이 스펙에 아예 정의돼 있지 않아,
        만들라는 경로만 있고 결과를 꺼낼 길이 없었다. 예측은 이제 불참을 등록할 때 서버가 걸어 두고
        준비 화면 조회에 함께 실려 온다.

        ---

        회의 전에 팀 상태를 분석해 **예상 쟁점·예상 질문·충돌 지점**을 만든다.

        모델 호출이 필요하므로 Celery 로 처리하고 `202` 를 반환한다. 완료는 WebSocket `meeting.prebrief.completed` 로 알린다.
      operationId: generatePrebrief
      responses:
        '202':
          description: 수락됨 (처리 중)
          content:
            application/json:
              schema:
                type: object
                properties:
                  prebrief_id:
                    type: string
                  meeting_id:
                    type: string
                  task_id:
                    type: string
                  status:
                    type: string
                    enum:
                    - PROCESSING
                  estimated_seconds:
                    type: integer
                  completion_event:
                    type: string
                  poll_url:
                    type: string
              example:
                prebrief_id: pb_1
                meeting_id: meeting_3
                task_id: celery_pb_9021
                status: PROCESSING
                estimated_seconds: 20
                completion_event: meeting.prebrief.completed
                poll_url: /api/v1/meetings/meeting_3/prebrief
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
      security:
      - bearerAuth: []
      parameters:
      - name: meeting_id
        in: path
        required: true
        schema:
          type: string
        description: 회의 ID
        example: meeting_3
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                focus_categories:
                  type: array
                  items:
                    $ref: '#/components/schemas/Category'
            example:
              focus_categories:
              - database
              - backend
  /api/v1/meetings/{meeting_id}/preanswers:
    post:
      tags:
      - 09. 회의
      summary: 사전 답변 저장 — ⛔ 대체됨
      description: |-
        ⛔ **`PUT /debate-points/{id}/stance` 로 대체됐다.**
        이쪽은 `topic` + `pattern`(정규식) 기반이라 논쟁점 하나에 묶을 필드가 없고 `GET`·`PATCH`·`DELETE` 도 없는데,
        화면은 논쟁점별 답변 카드마다 수정·삭제 ⋮ 메뉴를 요구한다. `pattern` 은 화면 어디에도 없는 낱말이다.

        ---

        "이런 패턴의 질문이 오면 이렇게 답해라"를 사용자가 미리 등록한다.

        `allowed_to_speak=false` 면 대리인은 이 답변을 **알고 있어도 발언하지 않고 유보한다.**
      operationId: createPreanswer
      responses:
        '201':
          description: 저장됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preanswer'
              example:
                id: pa_1
                meeting_id: meeting_3
                user_id: usr_backend_01
                topic: 다중 팀 지원 가능 여부
                pattern: 여러 팀|multi-team|다중 팀
                answer: team_members 중간 테이블로 다대다 구성하면 가능합니다.
                allowed_to_speak: true
                created_at: '2026-08-03T19:43:00+09:00'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
      security:
      - bearerAuth: []
      parameters:
      - name: meeting_id
        in: path
        required: true
        schema:
          type: string
        description: 회의 ID
        example: meeting_3
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                topic:
                  type: string
                pattern:
                  type: string
                answer:
                  type: string
                allowed_to_speak:
                  type: boolean
              required:
              - topic
              - answer
            example:
              topic: 다중 팀 지원 가능 여부
              pattern: 여러 팀|multi-team|다중 팀
              answer: team_members 중간 테이블로 다대다 구성하면 가능합니다.
              allowed_to_speak: true
