                    items:
                      type: object
                      properties:
                        team_id:
                          type: string
                        team_name:
                          type: string
                        members:
                          type: array
                          items:
                            type: object
                            properties:
                              user_id:
                                type: string
                              name:
                                type: string
                              avatar_url:
                                anyOf:
                                - type: string
                                - type: 'null'
                              has_agent:
                                type: boolean
                            required:
                            - user_id
                            - name
                      required:
                      - team_id
                      - team_name
                      - members
              example:
                teams:
                - team_id: team_a
                  team_name: 팀 A
                  members:
                  - user_id: usr_lsy
                    name: 임수연
                    avatar_url: null
                    has_agent: true
                - team_id: team_b
                  team_name: 팀 B
                  members:
                  - user_id: usr_cbs
                    name: 최비성
                    avatar_url: null
                    has_agent: false
        '401':
          $ref: '#/components/responses/E401'
      security:
      - bearerAuth: []
      parameters:
      - name: query
        in: query
        required: false
        schema:
          type: string
        description: 이름 검색. 새 채팅 화면 상단 검색바.
        example: 임수
      - name: type
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/ChatRoomType'
        description: 채팅 종류로 후보를 좁힌다
        example: DIRECT
  /api/v1/chat/rooms:
    post:
      tags:
      - 16. 채팅
      summary: 채팅 시작하기
      description: |-
        `새 채팅 생성` → 종류 선택 → 대화상대 선택 → `채팅 시작하기`.

        - `DIRECT` 는 이미 방이 있으면 **새로 만들지 않고 기존 방을 200 으로 돌려줍니다.**
          플로우 화면의 `팀원 오른쪽 클릭 → 메시지 보내기` 도 이 엔드포인트를 씁니다.
        - `TEAM` / `PROJECT` 는 팀·프로젝트당 1개뿐이라 `member_ids` 를 무시합니다.
        - `PEER_AGENT` 는 상대 1명 필수 — 분할화면의 `임수연의 Bordo` 가 이 타입입니다.
      operationId: createChatRoom
      responses:
        '201':
          description: 생성됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatRoomSummary'
              example:
                id: room_920
                type: DIRECT
                title: 임수연
                team_id: team_a
                team_name: 팀 A
                project_id: prj_b
                project_name: 프로젝트 b
                path_label: 팀 A - 프로젝트 b
                avatar_urls: []
                last_message: null
                unread_count: 0
                has_important: false
        '200':
          description: 이미 있는 방 — 기존 방 반환
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatRoomSummary'
              example:
                id: room_412
                type: DIRECT
                title: 임수연
                team_id: team_a
                team_name: 팀 A
                project_id: prj_b
                project_name: 프로젝트 b
                path_label: 팀 A - 프로젝트 b
                avatar_urls: []
                last_message: null
                unread_count: 0
                has_important: false
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  $ref: '#/components/schemas/ChatRoomType'
                member_ids:
                  type: array
                  items:
                    type: string
                team_id:
                  anyOf:
                  - type: string
                  - type: 'null'
                project_id:
                  anyOf:
                  - type: string
                  - type: 'null'
              required:
              - type
            example:
              type: DIRECT
              member_ids:
              - usr_lsy
              team_id: team_a
              project_id: prj_b
  /api/v1/chat/rooms/{room_id}:
    get:
      tags:
      - 16. 채팅
      summary: 채팅방 헤더
      description: 헤더의 상대 이름(`임수연`)과 소속 표기(`팀 A(프로젝트b)`)를 그립니다.
      operationId: getChatRoom
      responses:
        '200':
          description: 조회됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatRoomSummary'
              example:
                id: room_412
                type: DIRECT
                title: 임수연
                team_id: team_a
                team_name: 팀 A
                project_id: prj_b
                project_name: 프로젝트 b
                path_label: 팀 A - 프로젝트 b
                avatar_urls: []
                last_message: null
                unread_count: 8
                has_important: true
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/RoomId'
    patch:
      tags:
      - 16. 채팅
      summary: 채팅방 수정
      description: |-
        단체방(`TEAM` · `PROJECT`)의 이름을 바꿉니다.

        `DIRECT` · `AI` · `PEER_AGENT` 는 이름이 상대에게서 파생되므로 `409` 입니다.
      operationId: updateChatRoom
      responses:
        '200':
          description: 수정됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatRoomSummary'
              example:
                id: room_301
                type: PROJECT
                title: 결제 모듈 논의
                team_id: team_a
                team_name: 팀 A
                project_id: prj_b
                project_name: 프로젝트 b
                path_label: 팀 A - 프로젝트 b
                avatar_urls: []
                last_message: null
                unread_count: 0
                has_important: false
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/RoomId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
              required:
              - title
            example:
              title: 결제 모듈 논의
    delete:
      tags:
      - 16. 채팅
      summary: 채팅방 나가기 / 삭제
      description: |-
        방 종류에 따라 동작이 다릅니다.

        | 종류 | 동작 |
        |---|---|
        | `DIRECT` · `PEER_AGENT` | **내 목록에서만 숨김.** 상대는 그대로 보이고, 새 메시지가 오면 다시 나타납니다 |
        | `TEAM` · `PROJECT` | 방에서 나감. 팀·프로젝트 소속은 유지됩니다 |
        | `AI` | `409` — 나의 Bordo 방은 없앨 수 없습니다 |

        **어느 경우에도 메시지는 지워지지 않습니다.** 1:1 대화를 한쪽이 지운다고 상대의 기록까지
        사라지면 안 되기 때문입니다.

        `TEAM` · `PROJECT` 방 자체를 없애려면 팀·프로젝트를 지우십시오 — 방은 그것에 딸린 자원입니다.
      operationId: leaveChatRoom
      responses:
        '200':
          description: 처리됨
          content:
            application/json:
              schema:
                type: object
                properties:
                  room_id:
                    type: string
                  action:
                    type: string
                    enum:
                    - HIDDEN
                    - LEFT
                  at:
                    type: string
                    format: date-time
                    description: RFC3339 (오프셋 포함)
              example:
                room_id: room_412
                action: HIDDEN
                at: '2026-08-10T12:00:00+09:00'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/RoomId'
      - $ref: '#/components/parameters/IdempotencyKey'
  /api/v1/chat/rooms/{room_id}/messages:
    get:
      tags:
      - 16. 채팅
      summary: 메시지 목록
      description: |-
        **커서 페이징입니다.** 오프셋은 새 메시지가 들어올 때마다 경계가 밀려 중복·누락이 생깁니다.

        달력에서 날짜를 고르면 `date` 로 점프하고, 위로 스크롤하면 `before` 로 이어 붙입니다.

        ⚠️ **가정** — 와이어프레임에 근거가 없어 관례대로 정했습니다. 기획 확정 시 알려주시면 반영합니다. 페이지 크기 50 은 관례값입니다.
      operationId: listChatMessages
      responses:
        '200':
          description: 조회됨
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/ChatMessage'
                  next_before:
                    anyOf:
                    - type: string
                      description: null 이면 더 과거가 없다
                    - type: 'null'
              example:
                results:
                - id: msg_8990
                  room_id: room_412
                  sender:
                    id: usr_lsy
                    name: 임수연
                    avatar_url: null
                    is_agent: false
                  body: 이 부분 확인 부탁드립니다
                  attachments: []
                  sent_at: '2026-08-09T11:26:00+09:00'
                  is_mine: false
                  is_important: false
                  important_confirmed_at: null
                  read_count: 1
                - id: msg_8992
                  room_id: room_412
                  sender:
                    id: usr_me
                    name: 유수인
                    avatar_url: null
                    is_agent: false
                  body: 확인했습니다
                  attachments: []
                  sent_at: '2026-08-09T15:48:00+09:00'
                  is_mine: true
                  is_important: false
                  important_confirmed_at: null
                  read_count: 1
                next_before: msg_8989
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/RoomId'
      - name: before
        in: query
        required: false
        schema:
          type: string
        description: 이 커서보다 과거로 거슬러 올라간다 (무한 스크롤)
        example: msg_9001
      - name: date
        in: query
        required: false
        schema:
          type: string
          format: date
        description: 특정 날짜만. 달력에서 날짜를 고르면 이 파라미터로 점프한다.
        example: '2026-08-09'
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 50
        description: 기본 50
        example: 50
    post:
      tags:
      - 16. 채팅
      summary: 메시지 전송
      description: |-
        첨부는 먼저 `POST /chat/rooms/{room_id}/attachments` 로 올리고
        반환된 `attachment_ids` 를 여기에 실어 보냅니다. 본문·첨부 둘 다 비면 `400` 입니다
        (입력창이 비었을 때 전송 버튼이 비활성인 것과 같은 규칙).
      operationId: sendChatMessage
      responses:
        '201':
          description: 전송됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessage'
              example:
                id: msg_9010
                room_id: room_412
                sender:
                  id: usr_me
                  name: 유수인
                  avatar_url: null
                  is_agent: false
                body: 확인했습니다
                attachments: []
                sent_at: '2026-08-10T10:31:00+09:00'
                is_mine: true
                is_important: false
                important_confirmed_at: null
                read_count: 0
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/RoomId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                body:
                  type: string
                attachment_ids:
                  type: array
                  items:
                    type: string
            example:
              body: 확인했습니다
              attachment_ids: []
  /api/v1/chat/rooms/{room_id}/attachments:
    post:
      tags:
      - 16. 채팅
      summary: 사진·파일 첨부
      description: |-
        입력창 `+` → `사진 및 파일 첨부하기`.

        `multipart/form-data` 로 받습니다. 업로드만 하고 아직 메시지에 붙지 않은 상태이며,
        전송 요청에 `attachment_ids` 로 실어야 실제로 게시됩니다.

        ⚠️ **가정** — 와이어프레임에 근거가 없어 관례대로 정했습니다. 기획 확정 시 알려주시면 반영합니다. 용량·형식 제한이 와이어프레임에 없어 서버 정책으로 두었습니다.
      operationId: uploadChatAttachment
      responses:
        '201':
          description: 업로드됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatAttachment'
              example:
                id: att_55
                kind: IMAGE
                name: 스키마.png
                size_bytes: 284412
                mime_type: image/png
                url: https://cdn.bordo.dev/att/55
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/RoomId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
  /api/v1/chat/rooms/{room_id}/read:
    post:
      tags:
      - 16. 채팅
      summary: 읽음 처리
      description: '`up_to_message_id` 까지 읽은 것으로 처리하고, 갱신된 미읽음 수를 돌려줍니다. 생략하면 방 전체를 읽음 처리합니다.'
      operationId: markChatRead
      responses:
        '200':
          description: 처리됨
          content:
            application/json:
              schema:
                type: object
                properties:
                  room_id:
                    type: string
                  unread_count:
                    type: integer
                  total_unread:
                    type: integer
              example:
                room_id: room_412
                unread_count: 0
                total_unread: 2
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/RoomId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                up_to_message_id:
                  anyOf:
                  - type: string
                  - type: 'null'
            example:
              up_to_message_id: msg_9010
  /api/v1/chat/messages/{message_id}/important:
    patch:
      tags:
      - 16. 채팅
      summary: 중요 표시 / 해제
      description: 표시하면 상단 `중요 채팅` 섹션에 올라갑니다.
      operationId: setMessageImportant
      responses:
        '200':
          description: 변경됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessage'
              example:
                id: msg_9001
                room_id: room_412
                sender:
                  id: usr_seojm
                  name: 서재민
                  avatar_url: null
                  is_agent: false
                body: 이 부분 최대한 빨리 확인부탁드립니다
                attachments: []
                sent_at: '2026-08-09T20:11:00+09:00'
                is_mine: false
                is_important: true
                important_confirmed_at: null
                read_count: 0
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
      security:
      - bearerAuth: []
      parameters:
      - name: message_id
        in: path
        required: true
        schema:
          type: string
        description: 메시지 ID
        example: msg_9001
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                is_important:
                  type: boolean
              required:
              - is_important
            example:
              is_important: true
  /api/v1/chat/messages/{message_id}/important/confirm:
    post:
      tags:
      - 16. 채팅
      summary: 중요 확인
      description: |-
        `중요표시된 메시지 - 확인되면 회색으로 - 상단 중요 채팅에서 제외됨`.

        **표시 해제와는 다릅니다.** `is_important` 는 true 로 남고 `important_confirmed_at` 만 채워집니다.
        "중요한 메시지였지만 내가 봤다"는 상태이므로, 나중에 중요 메시지 이력을 되짚을 수 있습니다.
      operationId: confirmImportantMessage
      responses:
        '200':
          description: 확인됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessage'
              example:
                id: msg_9001
                room_id: room_412
                sender:
                  id: usr_seojm
                  name: 서재민
                  avatar_url: null
                  is_agent: false
                body: 이 부분 최대한 빨리 확인부탁드립니다
                attachments: []
                sent_at: '2026-08-09T20:11:00+09:00'
                is_mine: false
                is_important: true
                important_confirmed_at: '2026-08-10T10:35:00+09:00'
                read_count: 1
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
      security:
      - bearerAuth: []
      parameters:
      - name: message_id
        in: path
        required: true
        schema:
          type: string
        description: 메시지 ID
        example: msg_9001
      - $ref: '#/components/parameters/IdempotencyKey'
  /api/v1/chat/rooms/{room_id}/active-dates:
    get:
      tags:
      - 16. 채팅
      summary: 대화 있는 날짜 (달력)
      description: |-
        달력 오버레이에서 **`채팅한 날짜만 검정색`** 으로 칠하기 위한 목록입니다.

        `has_prev_month` / `has_next_month` 는 화살표 활성화 판정에 씁니다 —
        `맨 끝 달이라 오른쪽 화살표 활성화 안 됨` 을 클라이언트가 스스로 알 수 없기 때문입니다.
      operationId: listChatActiveDates
      responses:
        '200':
          description: 조회됨
          content:
            application/json:
              schema:
                type: object
                properties:
                  month:
                    type: string
                  active_dates:
                    type: array
                    items:
                      type: string
                      format: date
                  has_prev_month:
                    type: boolean
                  has_next_month:
                    type: boolean
              example:
                month: 2026-08
                active_dates:
                - '2026-08-03'
                - '2026-08-05'
                - '2026-08-09'
                has_prev_month: true
                has_next_month: false
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/RoomId'
      - name: month
        in: query
        required: false
        schema:
          type: string
          pattern: ^\d{4}-\d{2}$
        description: 조회할 달
        example: 2026-08
  /api/v1/chat/rooms/{room_id}/daily-summary:
    get:
      tags:
      - 16. 채팅
      summary: 날짜별 채팅 요약
      description: |-
        달력에서 날짜를 고르면 아래에 뜨는 `2026년 8월 9일 채팅 요약` 패널.

        `한 줄 요약` 과 `내가 해야 할 것` 은 대화 내용을 AI 가 요약한 결과입니다.
        `schedules` 는 아직 확정 전 항목입니다 — 아래 스키마 설명을 참고하십시오.
      operationId: getDailyChatSummary
