    post:
      tags:
      - 07. 태스크
      summary: 승인 (사람 최종 확정)
      description: |-
        🕓 **2차 범위** — 1차에서는 사람이 직접 입력합니다. 회의 대리인 기능이 안정화된 뒤에 MCP·로컬 AI 연동과 함께 붙입니다. 태스크 승인은 **팀 관리** 영역이라 후순위입니다. 누락이 아닙니다. **설계 1원칙(사람 최종 승인)과 직결되는 화면**이므로 누락인지 범위 밖인지 확인이 필요합니다.

        ---

        `PENDING_APPROVAL → TODO`.

        **호출 자체가 승인 행위**이므로 별도 승인 게이트가 없다. 담당자 또는 관리자만 호출할 수 있다.
      operationId: approveTask
      responses:
        '200':
          description: 승인됨
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Task'
                - type: object
                  properties:
                    previous_status:
                      $ref: '#/components/schemas/TaskStatus'
                    approved_by:
                      type: string
                    notification:
                      type: object
                      properties:
                        sent_to:
                          type: array
                          items:
                            type: string
                        channel:
                          type: string
                        outbox_event_id:
                          type: string
                    approved_at:
                      type: string
                      format: date-time
                      description: RFC3339 (오프셋 포함)
              example:
                id: task_9
                title: team_members 인덱스 추가
                status: TODO
                previous_status: PENDING_APPROVAL
                approved_by: usr_backend_01
                assignee_id: usr_backend_01
                due_at: '2026-08-08T18:00:00+09:00'
                notification:
                  sent_to:
                  - usr_backend_01
                  channel: discord_dm
                  outbox_event_id: obx_612
                approved_at: '2026-08-03T19:34:00+09:00'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
      security:
      - bearerAuth: []
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
        description: 태스크 ID
        example: task_9
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                due_at:
                  anyOf:
                  - type: string
                    format: date-time
                    description: RFC3339 (오프셋 포함)
                  - type: 'null'
                assignee_id:
                  anyOf:
                  - type: string
                  - type: 'null'
