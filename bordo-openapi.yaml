    JsonRpcRequest:
      type: object
      properties:
        jsonrpc:
          type: string
          enum:
          - '2.0'
        id:
          anyOf:
          - type: string
          - type: integer
        method:
          type: string
          enum:
          - initialize
          - notifications/initialized
          - server/discover
          - ping
          - tools/list
          - tools/call
          description: '`initialize` · `notifications/initialized` 는 legacy, `server/discover` 는 modern. 알림(`notifications/*`)은 `id` 가 없다.'
        params:
          type: object
          additionalProperties: true
          description: 'modern 이면 `_meta["io.modelcontextprotocol/protocolVersion"]` 에 판 번호가 들어온다.'
      required:
      - jsonrpc
      - method
    JsonRpcError:
      type: object
      properties:
        jsonrpc:
          type: string
          enum:
          - '2.0'
        id:
          anyOf:
          - type: string
          - type: integer
        error:
          type: object
          properties:
            code:
              type: integer
              description: '`-32700` 파싱 · `-32600` 형식 · `-32601` method 없음 · `-32602` 도구·인자 · `-32020` 헤더 불일치(400) · `-32022` 프로토콜 판(400)'
            message:
              type: string
            data:
              type: object
              additionalProperties: true
          required:
          - code
          - message
      required:
      - jsonrpc
      - id
      - error
      description: '**프로토콜 오류만** 이 객체로 온다. 도구 실행 오류는 `JsonRpcResult.result.isError` 다.'
    JsonRpcResult:
      type: object
      properties:
        jsonrpc:
          type: string
          enum:
          - '2.0'
        id:
          anyOf:
          - type: string
          - type: integer
        result:
          type: object
          additionalProperties: true
          description: |-
            `tools/call` 이면 MCP 규격대로 `content[]` · `structuredContent` · `isError` 를 가진다.
            `content[0].text` 는 사람이 읽을 한 줄, `structuredContent` 가 프로그램이 읽을 본문이다.
            **도구 실행 오류는 `isError: true`** 로 온다 — JSON-RPC `error` 로 내면 모델이 사유를 못 읽는다.
          properties:
            content:
              type: array
              items:
                type: object
                properties:
                  type: {type: string, enum: [text]}
                  text: {type: string}
            structuredContent:
              type: object
              additionalProperties: true
            isError:
              type: boolean
      required:
      - jsonrpc
      - id
      - result
    ProjectSummary:
      type: object
      properties:
        id:
          type: string
        team_id:
          type: string
        name:
          type: string
        progress:
          type: integer
          minimum: 0
          maximum: 100
          description: 진행률 %. 홈 화면 카드의 진행 바에 그대로 쓰인다.
        thumbnail_url:
          anyOf:
          - type: string
          - type: 'null'
        is_favorite:
          type: boolean
          description: 사이드바 `즐겨찾기` 그룹 노출 여부
        last_opened_at:
          anyOf:
          - type: string
            format: date-time
            description: RFC3339 (오프셋 포함)
          - type: 'null'
      required:
      - id
      - team_id
      - name
      - progress
      description: 사이드바·홈 카드에 쓰는 축약형.
    Project:
      type: object
      properties:
        id:
          type: string
        team_id:
          type: string
        team_name:
          type: string
        name:
          type: string
        description:
          anyOf:
          - type: string
          - type: 'null'
        progress:
          type: integer
          minimum: 0
          maximum: 100
        is_favorite:
          type: boolean
        member_count:
          type: integer
        group_chat_room_id:
          type: string
          description: 사이드바 `단체 채팅 바로가기` 대상 방
        created_at:
          type: string
          format: date-time
          description: RFC3339 (오프셋 포함)
        last_opened_at:
          anyOf:
          - type: string
            format: date-time
            description: RFC3339 (오프셋 포함)
          - type: 'null'
      required:
      - id
      - team_id
      - name
      - progress
      description: '**팀 아래의 작업 단위.** 문서·회의·작업·태스크·캘린더가 전부 이 스코프에 매달린다.'
    ChatRoomType:
      type: string
      enum:
      - AI
      - DIRECT
      - TEAM
      - PROJECT
      - PEER_AGENT
      description: |-
        채팅방 종류.

        | 값 | 새 채팅 화면 라벨 | 설명 |
        |---|---|---|
        | `AI` | `AI 채팅` | `나의 Bordo`. 사용자당 1개, 팀과 무관 |
        | `DIRECT` | `개인채팅` | 1:1 |
        | `TEAM` | `팀 채팅` | 팀 단체 |
        | `PROJECT` | `프로젝트 채팅` | 프로젝트 단체. 사이드바 `단체 채팅 바로가기` 대상 |
        | `PEER_AGENT` | (생성 화면에 없음) | `임수연의 Bordo` — 상대의 대리인과 1:1. 분할화면에서 열린다 |
    ChatAttachment:
      type: object
      properties:
        id:
          type: string
        kind:
          type: string
          enum:
          - IMAGE
          - FILE
        name:
          type: string
        size_bytes:
          type: integer
        mime_type:
          type: string
        url:
          type: string
      required:
      - id
      - kind
      - name
      - url
      description: 입력창 `+` → `사진 및 파일 첨부하기` 로 올린 것.
    ChatMessage:
      type: object
      properties:
        id:
          type: string
        room_id:
          type: string
        sender:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            avatar_url:
              anyOf:
              - type: string
              - type: 'null'
            is_agent:
              type: boolean
              description: AI 대리인이 보낸 메시지
          required:
          - id
          - name
          - is_agent
        body:
          type: string
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/ChatAttachment'
        sent_at:
          type: string
          format: date-time
          description: RFC3339 (오프셋 포함)
        is_mine:
          type: boolean
          description: true 면 우측 정렬 버블
        is_important:
          type: boolean
          description: 중요 표시 여부
        important_confirmed_at:
          anyOf:
          - type: string
            format: date-time
            description: 확인 시각. **채워지면 회색으로 바뀌고 상단 `중요 채팅` 섹션에서 빠진다.**
          - type: 'null'
        read_count:
          type: integer
          description: 단체방에서 읽은 사람 수
        edited_at:
          anyOf:
          - type: string
            format: date-time
            description: 수정 시각. 채워져 있으면 화면에 `(수정됨)` 을 붙인다.
          - type: 'null'
        deleted_at:
          anyOf:
          - type: string
            format: date-time
            description: 삭제 시각. 채워져 있으면 `body` 는 빈 문자열이며 `삭제된 메시지입니다` 로 그린다.
          - type: 'null'
      required:
      - id
      - room_id
      - sender
      - body
      - sent_at
      - is_mine
      - is_important
    ChatRoomSummary:
      type: object
      properties:
        id:
          type: string
        type:
          $ref: '#/components/schemas/ChatRoomType'
        title:
          type: string
        team_id:
          anyOf:
          - type: string
          - type: 'null'
        team_name:
          anyOf:
          - type: string
          - type: 'null'
        project_id:
          anyOf:
          - type: string
          - type: 'null'
        project_name:
          anyOf:
          - type: string
          - type: 'null'
        path_label:
          type: string
          description: '중요 채팅 카드의 출처 표기. 예: `팀 A - 프로젝트 b`'
        avatar_urls:
          type: array
          items:
            type: string
          description: 단체방은 최대 4개(4분할 썸네일). `프로젝트 팀원 전원` 카드가 그 예.
        last_message:
          anyOf:
          - type: object
            properties:
              sender_name:
                type: string
                description: '**제일 최근에 보낸 사람 이름이 뜬다.**'
              preview:
                type: string
              sent_at:
                type: string
                format: date-time
                description: RFC3339 (오프셋 포함)
            required:
            - sender_name
            - preview
            - sent_at
          - type: 'null'
        unread_count:
          type: integer
        has_important:
          type: boolean
          description: 미확인 중요 메시지 존재. 접힌 상위 노드에도 `!` 뱃지를 띄우기 위해 필요.
      required:
      - id
      - type
      - title
      - unread_count
      - has_important
    ChatSidebar:
      type: object
      properties:
        my_agent_room:
          $ref: '#/components/schemas/ChatRoomSummary'
        important_rooms:
          type: array
          items:
            $ref: '#/components/schemas/ChatRoomSummary'
          description: 상단 `중요 채팅` 섹션. **확인된(confirmed) 메시지만 남은 방은 제외한다.**
        teams:
          type: array
          items:
            type: object
            properties:
              team_id:
                type: string
              team_name:
                type: string
              group_chat_room_id:
                type: string
                description: '`단체 채팅 바로가기`'
              unread_count:
                type: integer
                description: '**하위 프로젝트·방 미읽음 합계.** 접힌 상태에서 뱃지로 쓴다.'
              has_important:
                type: boolean
              projects:
                type: array
                items:
                  type: object
                  properties:
                    project_id:
                      type: string
                    project_name:
                      type: string
                    group_chat_room_id:
                      type: string
                    unread_count:
                      type: integer
                    has_important:
                      type: boolean
                    rooms:
                      type: array
                      items:
                        $ref: '#/components/schemas/ChatRoomSummary'
                  required:
                  - project_id
                  - project_name
            required:
            - team_id
            - team_name
            - unread_count
            - has_important
        total_unread:
          type: integer
          description: 좌측 아이콘 레일의 `+10` 뱃지
      required:
      - my_agent_room
      - important_rooms
      - teams
      - total_unread
      description: |-
        채팅 사이드바 전체를 한 번에 내려주는 조회.

        접힌 상태에서도 미읽음·중요 뱃지를 그려야 하므로 **상위 노드에 하위 합계가 미리 들어 있어야 한다.**
        클라이언트가 트리를 순회해 합산하지 않는다.
    DailyChatSummary:
      type: object
      properties:
        date:
          type: string
          format: date
        one_line:
          type: string
          description: '`한 줄 요약`'
        my_todos:
          type: array
          items:
            type: string
          description: '`내가 해야 할 것`'
        schedules:
          type: array
          items:
            type: object
            properties:
              at:
                type: string
                format: date-time
                description: RFC3339 (오프셋 포함)
              title:
                type: string
                description: '`뭐에 대해서`'
              kind:
                type: string
                enum:
                - MEETING
                - TASK
            required:
            - at
            - title
            - kind
          description: '`잡혀 있는 회의` 패널. ⚠️ **가정** — 와이어프레임에 근거가 없어 관례대로 정했습니다. 기획 확정 시 알려주시면 반영합니다. 와이어프레임 주석 `아니면 채팅 관계자?
            사이의 일정을 보여줘도 될 듯` 이 미정으로 남아 있어, 일단 **해당 채팅방 참여자들의 공통 일정**으로 정의했습니다.'
      required:
      - date
      - one_line
      - my_todos
    FlowCategory:
      type: string
      enum:
      - WORK
      - MEETING
      description: 좌측 사이드바 `카테고리` 탭. `WORK`=작업, `MEETING`=회의. 인덱스와 필터 항목이 함께 바뀐다.
    FlowContentType:
      type: string
      enum:
      - DOCUMENT
      - PLAN
      - OPINION
      - REQUEST
      - CHANGE
      - SCHEDULE
      - CONCLUSION
      - ETC
      description: |-
        엣지가 무엇을 전달했는지. 좌측 `필터링 > 내용` 체크박스와 1:1 대응한다.

        - `WORK` 모드: `DOCUMENT`(문서) · `PLAN`(계획)
        - `MEETING` 모드: `OPINION`(의견) · `REQUEST`(요청사항) · `CHANGE`(변동사항)
          · `SCHEDULE`(일정) · `CONCLUSION`(결론) · `ETC`(기타)

        와이어프레임 `필터링 > 내용` 의 체크박스가 6칸이고 화살표 뱃지에 `일정` 이
        실제로 붙어 있어 회의 모드를 6종으로 맞췄습니다.

        `REVISION` → `CHANGE` 로 바꾼 이유 — 화면 라벨과 중앙 요약표 헤더가 모두
        `변동 사항` 입니다. `수정사항` 으로 두면 화면에 없는 낱말이 API 에만 남습니다.
    FlowNode:
      type: object
      properties:
        id:
          type: string
        kind:
          type: string
          enum:
          - USER
          - AGENT
          description: |-
            `AGENT` 는 `임수연의 Bordo` 처럼 표기됩니다.

            **서비스 안에서 움직이는 대리인과 Discord 회의에 참석한 대리인은 노드 하나로 합칩니다.**
            데이터를 공유하는 같은 대리인인데 동그라미를 둘로 나누면 화살표만 두 배로 늘고
            사용자는 둘을 구분할 이유가 없습니다.
        user_id:
          type: string
        name:
          type: string
        avatar_url:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - id
      - kind
      - user_id
      - name
    FlowEdge:
      type: object
      properties:
        id:
          type: string
        from_node_id:
          type: string
        to_node_ids:
          type: array
          items:
            type: string
          description: 1:N 가능. 사이드바에 `A → B, C` 로 표기된다.
        content_type:
          $ref: '#/components/schemas/FlowContentType'
        label:
          type: string
          description: '화살표 위 라벨. 예: `문서`, `의견`, `요청 사항`'
        direction_label:
          type: string
          description: '사람이 읽는 방향 표기. 예: `AI 대리인 → A, B, C`'
        participant_avatar_urls:
          type: array
          items:
            type: string
          description: 화살표 위 아바타. 4개 초과분은 `+3` 로 접는다.
        extra_participant_count:
          type: integer
        document_id:
          anyOf:
          - type: string
          - type: 'null'
        agenda_id:
          anyOf:
          - type: string
          - type: 'null'
        occurred_at:
          type: string
          format: date-time
          description: RFC3339 (오프셋 포함)
        opacity:
          type: number
          minimum: 0
          maximum: 1
          description: |-
            화살표 진하기. **서버가 계산해 내려줍니다.**

            최근 것일수록 1 에 가깝고 오래될수록 0 에 가깝습니다. 선이 여러 개 겹쳐도
            무엇이 먼저였는지 눈으로 가늠할 수 있게 하는 장치입니다. 기준 시각은 조회 시점이 아니라
            **해당 회의의 종료 시각**이라 같은 회의를 언제 열어도 그림이 같습니다.
        surface:
          type: string
          enum:
          - SERVICE
          - DISCORD
          description: 이 전달이 어디서 일어났는지. 노드는 합치지만 **엣지에는 출처를 남겨** 필요하면 걸러 볼 수 있습니다.
        source:
          type: string
          enum:
          - GITHUB
          - FIGMA
          - NOTION
          - ''
          description: |-
            산출물이 **어디에 있는지**. 작업 모드 `필터링 > 출처` 입니다.

            `surface` 와 헷갈리기 쉬운데 다른 축입니다.

                surface   일이 일어난 곳      서비스 / Discord
                source    산출물이 있는 곳    Github / Figma / Notion

            회의 모드 엣지에서는 빈 문자열입니다. 맞는 출처가 없어도 빈 문자열입니다 —
            억지로 채우면 필터가 거짓말을 합니다.
        source_url:
          type: string
          description: |-
            산출물 주소. 뱃지를 누르면 여기로 갑니다.

            `source` 만 주고 이걸 빼면 뱃지가 눌리지 않는 장식이 됩니다.
      required:
      - id
      - from_node_id
      - to_node_ids
      - content_type
      - label
      - occurred_at
      description: |-
        **전달 한 건.** 화면에 그려지는 화살표가 아니라 그 안에 묶이는 낱개입니다.
        화살표는 `FlowArrow` 이며, 이 리소스는 `GET /flow-edges/{edge_id}` 상세에서 씁니다.
    FlowArrow:
      type: object
      properties:
        id:
          type: string
          description: '`{from_node_id}->{to_node_id}` 로 만든 합성 키. 같은 회의 안에서 안정적입니다.'
        from_node_id:
          type: string
        to_node_ids:
          type: array
          items:
            type: string
        direction_label:
          type: string
          description: '예: `AI 대리인 → A, B`'
        counts:
          type: array
          items:
            type: object
            properties:
              content_type:
                $ref: '#/components/schemas/FlowContentType'
              label:
                type: string
                description: '화면에 그대로 쓰는 한국어. 예: `의견`, `변동사항`'
              count:
                type: integer
              edge_ids:
                type: array
                items:
                  type: string
                description: 이 종류에 묶인 전달들. 뱃지를 누르면 이걸로 상세를 엽니다.
            required:
            - content_type
            - label
            - count
          description: |-
            **종류별 개수 뱃지.** 와이어프레임의 화살표에는 `의견 3` `요청사항 5`
            `변동사항 2` 처럼 종류마다 개수가 붙습니다.

            서버가 세서 내려주는 이유 — 클라이언트가 `edges[]` 를 받아
            `(from, to, content_type)` 으로 묶어 세면, 필터가 걸린 상태에서 숫자가
            화면마다 달라집니다. 집계 기준이 서버에 하나만 있어야 합니다.
        total_count:
          type: integer
        participant_avatar_urls:
          type: array
          items:
            type: string
        extra_participant_count:
          type: integer
        latest_occurred_at:
          type: string
          format: date-time
          description: RFC3339 (오프셋 포함). 화살표 정렬·진하기 계산의 기준입니다.
        opacity:
          type: number
          minimum: 0
          maximum: 1
        surfaces:
          type: array
          items:
            type: string
            enum:
            - SERVICE
            - DISCORD
          description: 이 화살표에 섞인 출처. 서비스와 Discord 가 함께면 둘 다 들어갑니다.
      required:
      - id
      - from_node_id
      - to_node_ids
      - counts
      - total_count
      - latest_occurred_at
      description: |-
        **화면에 그려지는 화살표 하나.** 보내는 사람과 받는 사람 쌍마다 하나이며,
        그 사이에 오간 전달들을 종류별로 세어 뱃지로 답니다.

        낱개 전달(`FlowEdge`)을 그대로 그리면 사람 둘 사이에 화살표가 열 개 겹칩니다.
    MeetingFlow:
      type: object
      properties:
        meeting_id:
          type: string
        meeting_label:
          type: string
          description: '헤더 표기. 예: `8/7 회의이름`'
        category:
          $ref: '#/components/schemas/FlowCategory'
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/FlowNode'
        arrows:
          type: array
          items:
            $ref: '#/components/schemas/FlowArrow'
          description: |-
            **캔버스에 그릴 화살표.** 보내는 사람·받는 사람 쌍마다 하나이며
            종류별 개수 뱃지가 붙어 있습니다. 필터를 걸면 개수도 함께 줄어듭니다.
        filter_options:
          type: object
          properties:
            participants:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  label:
                    type: string
                  kind:
                    type: string
                    enum:
                    - USER
                    - AGENT
                required:
                - id
                - label
                - kind
            content_types:
              type: array
              items:
                $ref: '#/components/schemas/FlowContentType'
            surfaces:
              type: array
              items:
                type: string
                enum:
                - SERVICE
                - DISCORD
          description: |-
            현재 회의에서 **실제로 존재하는** 필터 값만 내려줍니다.

            전체 목록을 내려주면 체크해도 아무것도 안 걸리는 항목이 생겨 사용자가 헷갈립니다.
      required:
      - meeting_id
      - category
      - nodes
      - arrows
    MeetingIndexItem:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
          description: '`WORK` 이면 문서명(`무슨무슨 기획안`), `MEETING` 이면 안건명(`안건 1`)'
        kind:
          type: string
          enum:
          - DOCUMENT
          - AGENDA
        related_edge_ids:
          type: array
          items:
            type: string
          description: '**인덱스 선택 시 포커싱할 화살표.** 와이어프레임 주석 `인덱스 선택 시 인덱스에 해당되는 화살표나 자료들이 포커싱됨` 을 만족시키려면 서버가 미리 물려줘야 한다.'
      required:
      - id
      - label
      - kind
      - related_edge_ids
    MeetingSummaryTable:
      type: object
      properties:
        discovered_issues:
          type: array
          items:
            type: string
          description: '`발견한 문제`'
        changes:
          type: array
          items:
            type: string
          description: '`변동 사항`'
        next_plans:
          type: array
          items:
            type: string
          description: '`이후 계획`'
      required:
      - discovered_issues
      - changes
      - next_plans
      description: 플로우 캔버스 중앙의 3열 표.
    Utterance:
      type: object
      properties:
        participant_id:
          type: string
        participant_name:
          type: string
        utterance:
          type: string
        spoken_at:
          anyOf:
          - type: string
            format: date-time
            description: RFC3339 (오프셋 포함)
          - type: 'null'
      required:
      - participant_name
      - utterance
      description: '`전달 맥락` / `회의 맥락` 의 `펼치기` 안에 들어가는 한 줄.'
    AgendaDetail:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        direction_label:
          type: string
          description: '예: `A → B, C` · `AI 대리인 → A, B, C`'
        content:
          type: string
        related_edge_ids:
          type: array
          items:
            type: string
      required:
      - id
      - title
      - content
    DocumentSection:
      type: object
      properties:
        heading:
          type: string
          description: '`소제목 1`'
        one_line_summary:
          type: string
          description: '`한 줄 요약`'
        body:
          type: string
          description: '`내용`'
      required:
      - heading
      - one_line_summary
      - body
    AgentSettings:
      type: object
      properties:
        mention_feasibility:
          type: boolean
          description: '`구현 가능성 언급`'
        allow_schedule_change:
          type: boolean
          description: '`일정 수정 여부`'
        allow_midmeeting_question:
          type: boolean
          description: '`회의 중간 질문`'
        disclose_work:
          type: boolean
          description: 작업 공개
        disclose_plan:
          type: boolean
          description: 계획 공개
        disclose_thought:
          type: boolean
          description: 생각 공개
        disclose_work_plan_thought:
          type: boolean
          readOnly: true
          description: '옛 이름. **셋 중 하나라도 켜져 있으면 참**인 파생값이라 읽기 전용이다. POLICY 의 STATUS 관문이 이 값을 본다.'
          description: '`작업/계획/생각 공개`'
        tone:
          type: string
          enum:
          - FORMAL
          - FRIENDLY
          - CONCISE
          description: |-
            개인 설정의 `대리인 말투` 세 칸. 기본은 `FORMAL`.

            **판정이 아니라 표현입니다.** 무엇을 말해도 되는가는 위 boolean 4개가
            정하고, 이 값은 같은 내용을 어떤 투로 옮길지만 바꿉니다.
        agent_name:
          type: string
          maxLength: 40
          description: |-
            개인 설정의 `내 Agent 이름`. 비우면 서버가 `{이름}의 Bordo` 를 만듭니다.

            플로우의 대리인 노드 · 대리인 채팅방 제목 · `AI 조회` 상세에 그대로
            찍힙니다. 조립은 **서버 한 군데서만** 합니다(`agent_display_name()`) —
            화면마다 붙이면 사람 이름을 바꿨을 때 어떤 화면만 옛 이름으로 남습니다.
        active_version:
          type: integer
          description: 저장할 때마다 1 증가. 모든 AI 발언이 판정 당시 버전과 연결된다.
        updated_at:
          type: string
          format: date-time
          description: RFC3339 (오프셋 포함)
      required:
      - mention_feasibility
      - allow_schedule_change
      - allow_midmeeting_question
      - disclose_work_plan_thought
      description: |-
        **AI 대리인 세부 설정 — 사용자 단위 (팀 단위 아님).**

        와이어프레임의 `세부 설정` 4항목이 그대로 4개의 boolean 입니다. O 가 `true`, X 가 `false`.

        v1 에 있던 `SUGGEST_ONLY` / `REQUIRE_APPROVAL` 3단 모드, `min_confidence`, `max_shift_hours` 같은
        수치 파라미터는 화면에 대응하는 입력이 없어 제거했습니다. 그 결과
        `POLICY_HUMAN_APPROVAL_REQUIRED` 판정도 `allow_schedule_change: false` 하나로 단순해집니다.

        ⚠️ **가정** — 와이어프레임에 근거가 없어 관례대로 정했습니다. 기획 확정 시 알려주시면 반영합니다. 세밀한 수치가 실제로 필요하면 되살려야 합니다.
    AgentPrompt:
      type: object
      properties:
        id:
          type: string
        body:
          type: string
        created_at:
          type: string
          format: date-time
          description: RFC3339 (오프셋 포함)
        updated_at:
          anyOf:
          - type: string
            format: date-time
            description: RFC3339 (오프셋 포함)
          - type: 'null'
      required:
      - id
      - body
      - created_at
      description: |-
        `시스템 프롬프트` 영역의 카드 하나.

        v1 은 정책 안의 `prompt` 단일 문자열이었지만, 와이어프레임은 입력창에서 저장할 때마다
        **카드가 누적되고 각각 `수정`/`삭제` 메뉴를 가지므로** 독립 리소스로 분리했습니다.
    BriefingAnchor:
      type: object
      properties:
        edge_id:
          anyOf:
          - type: string
          - type: 'null'
        agenda_id:
          anyOf:
          - type: string
          - type: 'null'
        excerpt:
          type: string
        reason:
          anyOf:
          - type: string
            description: 유보한 경우의 사유
          - type: 'null'
      required:
      - excerpt
      description: 회의 어느 지점인지 가리키는 앵커. 클릭하면 플로우에서 해당 화살표가 포커싱된다.
    NeedsAnswerQuestion:
      type: object
      properties:
        question_id:
          type: string
        asker_name:
          type: string
        title:
          type: string
        body:
          type: string
        asked_at:
          type: string
          format: date-time
          description: RFC3339 (오프셋 포함)
        chat_room_id:
          type: string
          description: '**질문을 클릭하면 답변용 채팅창이 활성화되므로** 방 ID 를 같이 내려준다.'
        answered_at:
          anyOf:
          - type: string
            format: date-time
            description: RFC3339 (오프셋 포함)
          - type: 'null'
          description: 답하면 채워지고 카드가 사라집니다.
      required:
      - question_id
      - asker_name
      - title
      - body
      - chat_room_id
    BriefingChip:
      type: object
      properties:
        content_type:
          $ref: '#/components/schemas/FlowContentType'
        label:
          type: string
          description: '화면에 그대로 쓰는 한국어. 예: `결정`, `요청`, `수정`, `미해결`'
        count:
          type: integer
        edge_ids:
          type: array
          items:
            type: string
          description: 칩을 누르면 포커싱할 화살표들
      required:
      - content_type
      - label
      - count
      description: |-
        `회의 한눈에 보기` 요약 아래의 **정보 위치 칩**.

        와이어프레임의 `결정 3` `요청 2` `수정 4` `미해결 2` 가 이것입니다.
        요약문을 읽고 곧바로 "그게 회의 어디였지"로 건너뛰는 통로입니다.
    BriefingConfirmation:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
          description: '예: `백엔드 개발 일정 변경`'
        body:
          type: string
          description: '예: `API 연동 완료일이 8/16 → 8/19로 변경됐어요.`'
        edge_id:
          anyOf:
          - type: string
          - type: 'null'
          description: '`해당 내용 보기 →` 가 가리키는 화살표'
        agenda_id:
          anyOf:
          - type: string
          - type: 'null'
        confirmed_at:
          anyOf:
          - type: string
            format: date-time
            description: RFC3339 (오프셋 포함)
          - type: 'null'
        occurred_at:
          type: string
          format: date-time
          description: RFC3339 (오프셋 포함)
      required:
      - id
      - title
      - body
      description: |-
        `확인이 필요해요` 카드.

        **`used_answers` / `deferred_answers` 와 다릅니다.** 그 둘은 *대리인이 무엇을
        답했나* 이고, 이건 *내가 없는 사이 무엇이 바뀌었나* 입니다. 자리를 비운 사람이
        돌아와서 가장 먼저 봐야 하는 것이라 별도 섹션으로 뺐습니다.
    BriefingRequest:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
          description: '예: `8/15까지 회의 화면 디자인 수정`'
        requester_name:
          type: string
          description: '예: `서재민`. 화면에는 `서재민님이 요청했어요` 로 그립니다.'
        note:
          type: string
          description: '기한이 없을 때 대신 붙는 문구. 예: `다음 회의 전까지 확인이 필요해요.`'
        due_at:
          anyOf:
          - type: string
            format: date-time
            description: RFC3339 (오프셋 포함)
          - type: 'null'
        edge_id:
          anyOf:
          - type: string
          - type: 'null'
        task_id:
          anyOf:
          - type: string
            description: 이 요청이 태스크로 승격됐으면 그 id
          - type: 'null'
      required:
      - id
      - title
      - requester_name
      description: |-
        `나에게 요청한 내용` 카드.

        태스크와 닮았지만 **아직 태스크가 아닙니다.** 회의에서 나에게 넘어온 요청을
        그대로 보여주는 자리이며, 사람이 받아들이면 `task_id` 가 붙습니다.
        곧바로 `PENDING_APPROVAL` 태스크로 만들면 승인 화면에 남의 회의 요청까지
        쏟아져 승인 큐가 뜻을 잃습니다.
    AiBriefing:
      type: object
      properties:
        meeting_id:
          type: string
        narrative:
          type: string
          description: |-
            `회의 한눈에 보기` 의 2~3줄 요약.

            와이어프레임 예시: `이번 회의에서는 백엔드 개발 진행 상황과 프론트엔드/디자인
            싱크를 중심으로 논의했어요. API 연동 일정이 변경되었으며, 디자인 최종안은
            다음 회의 전까지 확정하기로 했어요.`
        location_chips:
          type: array
          items:
            $ref: '#/components/schemas/BriefingChip'
          description: 요약 아래 `정보 위치 칩`
        needs_confirmation:
          type: array
          items:
            $ref: '#/components/schemas/BriefingConfirmation'
          description: '`확인이 필요해요` 섹션'
        requests_to_me:
          type: array
          items:
            $ref: '#/components/schemas/BriefingRequest'
          description: '`나에게 요청한 내용` 섹션'
        needs_answer:
          type: array
          items:
            $ref: '#/components/schemas/NeedsAnswerQuestion'
          description: '`답변이 필요해요` 섹션'
        used_answers:
          type: array
          items:
            $ref: '#/components/schemas/BriefingAnchor'
          description: 대리인이 실제로 답한 지점. 화면에는 안 그리고 감사·추적용으로 남깁니다.
        deferred_answers:
          type: array
          items:
            $ref: '#/components/schemas/BriefingAnchor'
          description: 판단을 유보한 지점. 화면에는 안 그리고 감사·추적용으로 남깁니다.
        settings_version:
          type: integer
          description: 이 브리핑이 어느 설정 버전으로 판정됐는지
        generated_at:
          anyOf:
          - type: string
            format: date-time
            description: RFC3339 (오프셋 포함)
          - type: 'null'
      required:
      - meeting_id
      - narrative
      - location_chips
      - needs_confirmation
      - requests_to_me
      - needs_answer
      description: |-
        우측 사이드바 `Zero 브리핑` 전체. **담당: B(AI 대리인).**

        와이어프레임의 섹션 순서를 그대로 따릅니다 —
        `회의 한눈에 보기`(+정보 위치 칩) → `확인이 필요해요` → `답변이 필요해요`
        → `나에게 요청한 내용`. 아래에는 `Zero 채팅창` 이 고정으로 붙습니다.
    AgentConversation:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
          description: '**서버가 자동 생성한다.** 와이어프레임 주석 `GPT처럼 메세지 분류되는 거` 근거.'
        last_message_preview:
          anyOf:
          - type: string
          - type: 'null'
        updated_at:
          type: string
          format: date-time
          description: RFC3339 (오프셋 포함)
      required:
      - id
      - title
      - updated_at
    HomeDashboard:
      type: object
      properties:
        user_name:
          type: string
        user_avatar_url:
          anyOf:
          - type: string
          - type: 'null'
          description: |-
            사이드바 하단 프로필. 없으면 `null` 이고, 그때 화면은 이름 첫 글자로
            원을 그립니다 — 그 판단을 하려면 값이 오기는 해야 합니다.
        greeting_mode:
          type: string
          enum:
          - WELCOME
          - BRIEFING_AVAILABLE
          description: |-
            환영 영역 분기.

            - `WELCOME` → 문구만. `안녕하세요, {user_name}님 Bordo에 오신 것을 환영합니다.`
            - `BRIEFING_AVAILABLE` → **문구는 그대로 두고** 우측에
              `Zero 브리핑 보러가기` 버튼이 함께 뜹니다.

            ⚠️ 이전 판은 "문구를 교체한다"고 적었지만, 와이어프레임 실물은 문구를
            유지한 채 버튼을 더합니다. 화면을 따릅니다 — 문구를 갈아끼우면
            사용자 이름으로 맞이하는 인사가 사라져 첫 화면의 인상이 바뀝니다.
        briefing_pending:
          type: object
          properties:
            exists:
              type: boolean
            meeting_id:
              anyOf:
              - type: string
              - type: 'null'
            always_open:
              type: boolean
              description: 사용자가 `항상 브리핑 보러가기` 를 체크해 둔 상태. true 면 팝업 없이 바로 이동.
          required:
          - exists
          - always_open
          description: 홈 진입 팝업 `최근에 AI 대리인이 활동한 내역이 있어요. 브리핑을 보러 갈까요?`
        recent_meetings:
          type: array
          items:
            type: object
            properties:
              meeting_id:
                type: string
              project_id:
                type: string
              title:
                type: string
              thumbnail_url:
                anyOf:
                - type: string
                - type: 'null'
              is_favorite:
                type: boolean
              progress:
                type: integer
                minimum: 0
                maximum: 100
              project_name:
                type: string
                description: 카드 첫 줄. 프로젝트 id 로 클라이언트가 이름을 다시 찾지 않게 같이 실어 보냅니다.
              missed:
                type: boolean
                description: |-
                  `불참한 회의` 뱃지.

                  이 화면이 있는 이유 자체가 "자리를 비운 사이 무슨 일이 있었나"
                  이므로, 내가 그 회의에 있었는지가 카드의 성격을 바꿉니다.
              scheduled_at:
                anyOf:
                - type: string
                  format: date-time
                  description: RFC3339 (오프셋 포함)
                - type: 'null'
              displayed_at:
                type: string
                description: |-
                  카드 하단에 그대로 찍히는 문자열. 예: `2026.08.12 · 11:32`

                  `recent_meeting_summary` 쪽도 이름이 `displayed_at` 이지만
                  **형태가 다릅니다** — 그쪽은 폭이 좁아 연도를 뺍니다.
                  같은 이름이라고 상수 하나로 합치면 한쪽이 잘립니다.

                  서버가 만드는 이유는 시간대입니다. 브라우저 시간대로 찍으면
                  같은 회의를 사람마다 다른 시각으로 보게 됩니다.
            required:
            - meeting_id
            - project_id
            - title
            - is_favorite
            - progress
          description: 상단 카드 5개. 별 아이콘 = `is_favorite`, 하단 바 = `progress`.
        today_schedule:
          type: array
          items:
            type: object
            properties:
              time_range:
                type: string
                description: |-
                  행 왼쪽에 그대로 찍히는 문자열. 예: `09:00 - 10:00`

                  사용자 시간대로 서버가 환산합니다. 팀원이 서로 다른 지역에
                  있는 것이 이 서비스의 전제라, 클라이언트가 환산하면 같은
                  일정을 사람마다 다른 시각으로 봅니다.
              location:
                type: string
                description: |-
                  행에 `{project_name} · {location}` 으로 붙습니다.
                  `Discord` 또는 `서비스`.

                  채널 id 로 클라이언트가 판단하게 두면 연결이 끊긴 회의에도
                  `Discord` 가 뜹니다.
              at:
                type: string
                format: date-time
                description: RFC3339 (오프셋 포함)
              ends_at:
                anyOf:
                - type: string
                  format: date-time
                  description: RFC3339 (오프셋 포함)
                - type: 'null'
              project_id:
                type: string
              project_name:
                type: string
              title:
                type: string
              meeting_id:
                anyOf:
                - type: string
                - type: 'null'
              action:
                type: object
                properties:
                  kind:
                    type: string
                    enum:
                    - JOIN_DISCORD
                    - OPEN_MEETING
                    - OPEN_PROJECT
                    description: 행 오른쪽 버튼이 무엇을 하는지
                  label:
                    type: string
                    description: '버튼에 쓰는 한국어. 예: `참여하기`, `보러가기`'
                  url:
                    anyOf:
                    - type: string
                      description: '`JOIN_DISCORD` 일 때 Discord 딥링크'
                    - type: 'null'
                required:
                - kind
                - label
                description: |-
                  **행마다 붙는 버튼.** 와이어프레임 `일정정보 + 버튼` 이 근거입니다.

                  회의가 Discord 에서 열리므로 버튼의 뜻이 일정마다 다릅니다 —
                  연결된 채널이 있으면 `참여하기`, 없으면 `보러가기` 입니다.
                  클라이언트가 필드 조합으로 추측하면 채널이 없는 회의에
                  참여 버튼이 뜹니다.
              delegation:
                anyOf:
                - type: object
                  properties:
                    delegated:
                      type: boolean
                      description: 대리 참석을 켜 뒀는가
                    prompt:
                      type: string
                      description: 이 회의에 한정된 사전 지시
                    absence_url:
                      type: string
                      description: '`회의에 참여하지 않아요` 를 누르면 부를 곳 (`POST`). 클라이언트가 경로를 조립하면 경로가 바뀔 때 두 곳을 고쳐야 한다.'
                      example: /api/v1/meetings/meeting_3/absence
                    prep_url:
                      type: string
                      description: 그다음 열 「회의 대리 참석 준비」 화면
                      example: /api/v1/meetings/meeting_3/prep
                    sources:
                      anyOf:
                      - type: array
                        items:
                          type: string
                          enum:
                          - work
                          - plan
                          - thought
                          - document
                      - type: 'null'
                      description: |-
                        이 회의에서 대리인이 근거로 쓸 자료 종류.

                        **`null` 과 `[]` 는 다릅니다.** `null` 은 고른 적이 없다
                        (제한 없음)이고, `[]` 는 아무것도 쓰지 말라는 뜻입니다.
                  required:
                  - delegated
                  - prompt
                - type: 'null'
                description: |-
                  행의 `회의에 참여하지 않아요` 버튼이 읽는 값.

                  참석자가 아니면 `null` 입니다. 화면은 이 값의 유무로 불참 등록
                  버튼과 회의 링크를 가릅니다 — 빈 객체를 주면 남의 회의에도
                  버튼이 떠서, 눌러 봐야 `참석자가 아닙니다` 로 막힙니다.
            required:
            - at
            - project_id
            - project_name
            - title
          description: '`오늘 일정`. 행 클릭 시 `해당 일정 프로젝트로 넘어가짐`.'
        recent_meeting_summary:
          anyOf:
          - type: object
            properties:
              meeting_id:
                type: string
              team_name:
                type: string
                description: '카드 첫 줄. 와이어프레임 예시 `멋사 중앙해커톤`'
              project_name:
                type: string
              title:
                type: string
                description: '카드 둘째 줄. 예: `글로벌 회의 일정 및 개발 방향 논의`'
              occurred_at:
                anyOf:
                - type: string
                  format: date-time
                  description: RFC3339 (오프셋 포함)
                - type: 'null'
                description: '우측 상단 `08.12 · 11:32`'
              missed:
                type: boolean
                description: |-
                  `불참한 회의` 뱃지.

                  이 카드가 존재하는 이유 자체가 "자리를 비운 사이 무슨 일이
                  있었나" 이므로, 내가 그 회의에 있었는지가 카드의 성격을 바꿉니다.
              main_decisions:
                type: array
                items:
                  type: string
                description: |-
                  `주요 결정`. 예: `8월 18일까지 디자인 시안 확정`, `개발 일정 1주 연장`

                  이전 판의 `main_agendas`(주요 안건)를 대체합니다 — 화면이 묻는 건
                  "무엇을 다뤘나"가 아니라 "무엇이 정해졌나" 입니다.
              zero_summary:
                type: string
                description: |-
                  `Zero 요약` — 대리인이 한 문장으로 줄인 것.
                  예: `"디자인 작업을 우선 진행한 후 개발팀에 전달하기로 결정했어요."`

                  이전 판의 `main_opinions[]`(발언자별 인용)를 대체합니다.
                  카드가 좁아 발언 목록이 들어가지 않습니다.

                  **`agent_summary` 에서 이름이 바뀌었습니다.** 화면 라벨이
                  `Zero 요약` 이고 대리인이 화자일 때의 호칭이 `Zero` 라 응답
                  필드도 그 이름을 씁니다.
              displayed_at:
                type: string
                description: |-
                  우측 상단에 그대로 찍히는 문자열. 예: `08.12 · 11:32`

                  `occurred_at` 과 같은 값이지만 **형태가 다릅니다** — 이 카드는
                  폭이 좁아 연도를 뺍니다(`recent_meetings[]` 쪽은 `2026.08.12`).
                  이름이 같다고 상수 하나로 합치면 한쪽이 잘립니다.
              status:
                type: string
                description: |-
                  뱃지 문구. `불참한 회의` 또는 `참석한 회의`.

                  `missed` 불리언만 주면 클라이언트마다 다른 낱말을 쓰게 되고,
                  화면 라벨을 바꿀 때 배포가 두 번 필요합니다.
            required:
            - meeting_id
            - title
            description: '`최근 회의 요약` 카드. 클릭 시 `해당 회의 페이지로 넘어가짐`.'
          - type: 'null'
        project_progress:
          type: array
          items:
            $ref: '#/components/schemas/ProjectSummary'
          description: '`프로젝트 진행 현황`'
        recent_projects:
          type: array
          items:
            $ref: '#/components/schemas/ProjectSummary'
          description: 사이드바 `최근 항목`
        favorite_projects:
          type: array
          items:
            $ref: '#/components/schemas/ProjectSummary'
          description: 사이드바 `즐겨찾기`
        shortcuts:
          type: object
          properties:
            agent_room_id:
              anyOf:
              - type: string
              - type: 'null'
              description: |-
                사이드바 `Zero 바로가기` 가 여는 방.

                이게 없으면 홈에서 대리인 방으로 가려고 채팅 사이드바
                (`GET /chat/sidebar`)를 통째로 한 번 더 불러야 합니다.
            discord:
              anyOf:
              - type: object
                properties:
                  guild_id:
                    type: string
                  url:
                    type: string
                    description: '브라우저에서 여는 주소. 예: `https://discord.com/channels/{guild_id}`'
                  connected:
                    type: boolean
                required:
                - connected
              - type: 'null'
              description: |-
                사이드바 `Discord 바로가기`.

                **주소를 서버가 조립해 내려줍니다.** 클라이언트가 guild_id 로
                URL 을 만들면 채널 연결이 안 된 팀에서도 버튼이 활성화됩니다.
          description: 사이드바 하단 `바로가기버튼모음`
      required:
      - user_name
      - greeting_mode
      - briefing_pending
      - recent_meetings
      - today_schedule
      - project_progress
      description: 홈 화면 한 장을 그리는 데 필요한 것 전부. 요청 1회로 끝내기 위한 집계 응답이다.
    BordoEvent:
      type: object
      properties:
        event_id:
          type: string
        event_type:
          type: string
          description: '`agent.run.step.*`, `discord.message.received`, `meeting.*`, `document.*`, `sync.*`, `task.*`, `calendar.*`'
        team_id:
          type: string
        occurred_at:
          type: string
          format: date-time
          description: RFC3339 (오프셋 포함)
        payload:
          type: object
          additionalProperties: true
      required:
      - event_id
      - event_type
      - team_id
      - occurred_at
      - payload
      description: '`/ws/teams/{team_id}` 로 흘러오는 공통 이벤트 형식. **트랜잭션 commit 이후에만 발행한다.**'
    DeletedResult:
      type: object
      properties:
        id:
          type: string
        deleted_at:
          type: string
          format: date-time
          description: RFC3339 (오프셋 포함)
        restorable_until:
          anyOf:
          - type: string
            format: date-time
            description: 이 시각까지는 복구할 수 있다. null 이면 즉시 영구 삭제.
          - type: 'null'
      required:
      - id
      - deleted_at
      description: 소프트 삭제 결과. 실제 행은 남고 `deleted_at` 만 채워진다.
    TeamRoleUpdate:
      type: object
      properties:
        team_role:
          $ref: '#/components/schemas/TeamRole'
      required:
      - team_role
    Skill:
      type: object
      properties:
        key:
          type: string
          description: '예: `create_voice_channel`'
        label:
          type: string
        surface:
          type: string
          enum:
          - DISCORD
          - SERVICE
          description: 이 스킬이 조작하는 대상. 1차는 `DISCORD` 만 구현합니다.
        description:
          type: string
          description: LLM 이 언제 쓸지 판단하는 근거가 되는 설명
        parameters:
          type: object
          additionalProperties: true
          description: JSON Schema. LLM 이 인자를 채울 때 쓴다.
        reversible:
          type: boolean
          description: false 면 실패 시 되돌릴 수 없어 계획 단계에서 사람 확인을 받는다.
      required:
      - key
      - label
      - surface
      - description
      description: |-
        **AI 가 호출할 수 있는 기능 하나.**

        LLM 이 매번 API 를 하나하나 조립하지 않도록, 기능을 클래스로 미리 구현해 두고
        목록만 넘겨줍니다. AI 는 "이런 스킬들이 있고 사용자가 이걸 요청했으니 이 순서로 실행" 을
        계획하기만 합니다. 실행은 서버 코드가 하므로 모델 호출 비용도 줄고 결과가 안정적입니다.
    SkillStep:
      type: object
      properties:
        seq:
          type: integer
        skill_key:
          type: string
        arguments:
          type: object
          additionalProperties: true
        status:
          type: string
          enum:
          - PENDING
          - RUNNING
          - SUCCEEDED
          - FAILED
          - SKIPPED
        result:
          anyOf:
          - type: object
            additionalProperties: true
          - type: 'null'
        error:
          anyOf:
          - $ref: '#/components/schemas/Error'
          - type: 'null'
      required:
      - seq
      - skill_key
      - status
    SkillRun:
      type: object
      properties:
        id:
          type: string
        surface:
          type: string
          enum:
          - DISCORD
          - SERVICE
        utterance:
          type: string
          description: 사용자가 자연어로 한 말 원문
        plan_summary:
          type: string
          description: AI 가 세운 계획을 사람이 읽을 수 있게 요약한 것
        status:
          type: string
          enum:
          - PLANNING
          - RUNNING
          - COMPLETED
          - PARTIALLY_FAILED
          - FAILED
        steps:
          type: array
          items:
            $ref: '#/components/schemas/SkillStep'
        started_at:
          type: string
          format: date-time
          description: RFC3339 (오프셋 포함)
        finished_at:
          anyOf:
          - type: string
            format: date-time
            description: RFC3339 (오프셋 포함)
          - type: 'null'
      required:
      - id
      - surface
      - utterance
      - status
      - steps
      - started_at
      description: |-
        자연어 요청 하나가 여러 스킬로 쪼개져 실행된 기록.

        **한 단계가 실패해도 나머지가 중단되지 않습니다.** 그래서 `COMPLETED` 와 `FAILED` 사이에
        `PARTIALLY_FAILED` 가 따로 있습니다 — "음성 채널은 만들었는데 역할 부여만 실패" 같은 상태를
        성공이나 실패 한쪽으로 뭉개면 사용자가 무엇을 다시 해야 하는지 알 수 없습니다.
    FlowFilterPreset:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          description: '예: `프론트 팀`'
        participant_ids:
          type: array
          items:
            type: string
        content_types:
          type: array
          items:
            $ref: '#/components/schemas/FlowContentType'
        surfaces:
          type: array
          items:
            type: string
            enum:
            - SERVICE
            - DISCORD
        since_minutes:
          anyOf:
          - type: integer
            description: 최근 N분만. null 이면 전체.
          - type: 'null'
        created_at:
          type: string
          format: date-time
          description: RFC3339 (오프셋 포함)
      required:
      - id
      - name
      description: |-
        **사용자 지정 필터 묶음.**

        필터 항목이 참여자·내용·출처·시간으로 늘어나면서, 볼 때마다 체크박스를 다시 누르는 게
        번거로워졌습니다. 자주 쓰는 조합을 저장해 두고 한 번에 적용합니다.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 웹 프론트용. `POST /api/v1/auth/login` 으로 발급.
    serviceToken:
      type: apiKey
      in: header
      name: X-Service-Token
      description: Discord Bot 전용. 서버에는 원문이 아닌 **해시로 저장**됩니다.
    mcpToken:
      type: http
      scheme: bearer
      description: 개인 AI 클라이언트용 `brd_` 토큰. `POST /api/v1/me/mcp-token` 으로 발급하며 서버에는 해시만 남습니다. 그 사용자로 동작하고 팀·프로젝트 권한은 웹과 같은 검사를 지납니다.
  parameters:
    TeamId:
      name: team_id
      in: path
      required: true
      schema:
        type: string
      example: team_deputy
      description: 팀 ID. 비멤버가 호출하면 `403 TEAM_ACCESS_DENIED`.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
      example: idem-1760000000-a1b2c3d4
      description: 외부 쓰기 요청의 중복 방지 키. 같은 키로 재요청하면 기존 결과를 그대로 돌려줍니다.
    MeetingId:
      name: meeting_id
      in: path
      required: true
      schema:
        type: string
      example: meeting_3
      description: 회의 ID. 프로젝트 참여자가 아니면 `403`, 없는 회의면 `404 MEETING_NOT_FOUND`.
    DebatePointId:
      name: point_id
      in: path
      required: true
      schema:
        type: string
      example: dp_2
      description: 예상 논쟁점 ID. 없으면 `404 DEBATE_POINT_NOT_FOUND`.
    ProjectId:
      name: project_id
      in: path
      required: true
      schema:
        type: string
      example: prj_b
      description: 프로젝트 ID. 비멤버가 호출하면 `403 TEAM_ACCESS_DENIED`.
    RoomId:
      name: room_id
      in: path
      required: true
      schema:
        type: string
      example: room_412
      description: 채팅방 ID. 참여자가 아니면 `404` (존재를 숨깁니다).
  responses:
    E400:
      description: '`VALIDATION_ERROR` — 입력 검증 실패'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            request_id: 7f3a91c2-4d5e-4b8a-9c1f-2e6d70b4a318
            error:
              code: VALIDATION_ERROR
              message: 요청 본문이 올바르지 않습니다.
              retryable: false
              details:
                fields:
                  email: 이미 사용 중인 형식이 아닙니다.
    E401:
      description: 인증 실패 — `AUTH_INVALID_TOKEN` / `AUTH_TOKEN_EXPIRED` / `AUTH_SERVICE_TOKEN_INVALID`
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            request_id: 7f3a91c2-4d5e-4b8a-9c1f-2e6d70b4a318
            error:
              code: AUTH_TOKEN_EXPIRED
              message: 액세스 토큰이 만료되었습니다. 재발급 후 다시 시도하세요.
              retryable: true
              details:
                expired_at: '2026-08-03T19:00:00+09:00'
    E403:
      description: 권한 없음 — `TEAM_ACCESS_DENIED` / `POLICY_DENIED`
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            request_id: 7f3a91c2-4d5e-4b8a-9c1f-2e6d70b4a318
            error:
              code: TEAM_ACCESS_DENIED
              message: 해당 팀의 멤버가 아닙니다.
              retryable: false
              details:
                team_id: team_deputy
    E404:
      description: 대상 없음. **PRIVATE 리소스도 403 이 아니라 여기로 응답해 존재 자체를 숨깁니다.**
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            request_id: 7f3a91c2-4d5e-4b8a-9c1f-2e6d70b4a318
            error:
              code: DOCUMENT_NOT_FOUND
              message: 문서를 찾을 수 없습니다.
              retryable: false
              details:
                document_id: doc_101
    E409:
      description: 충돌 또는 승인 필요 — `DUPLICATE_EVENT` / `POLICY_HUMAN_APPROVAL_REQUIRED` / `MEETING_ALREADY_*`
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            request_id: 7f3a91c2-4d5e-4b8a-9c1f-2e6d70b4a318
            error:
              code: POLICY_HUMAN_APPROVAL_REQUIRED
              message: 사용자 승인이 필요합니다.
              retryable: false
              details:
                approval_type: schedule_change
                policy_version: 7
    E429:
      description: '`MODEL_RATE_LIMIT` 등 호출 제한'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            request_id: 7f3a91c2-4d5e-4b8a-9c1f-2e6d70b4a318
            error:
              code: MODEL_RATE_LIMIT
              message: 모델 호출 한도를 초과했습니다. 잠시 후 재시도하세요.
              retryable: true
              details:
                retry_after_seconds: 30
    E500:
