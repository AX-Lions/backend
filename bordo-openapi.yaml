                allow_schedule_change:
                  type: boolean
                allow_midmeeting_question:
                  type: boolean
                disclose_work:
                  type: boolean
                  description: 작업 공개
                disclose_plan:
                  type: boolean
                  description: 계획 공개
                disclose_thought:
