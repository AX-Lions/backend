  /api/v1/me/agent/conversations/{conversation_id}/messages:
    post:
      tags:
      - 10. AI 대리인
      summary: 메시지 전송 → Agent Run 시작
      description: |-
        `start_assistant_run()` 을 호출해 Agent Run 을 만든다. 응답은 즉시 `run_id` 만 주고, **실제 단계는 WebSocket 으로 스트리밍**된다.

        `RECEIVED → ANALYZING → SEARCHING → CHECKING_POLICY → GENERATING → QUEUED_FOR_DELIVERY → COMPLETED`

        MAX_STEPS 초과나 모델 실패 시에는 도구 없는 최종 호출로 **안전한 요약·유보**를 만든다. 추측해서 답하지 않는다.
      operationId: sendAssistantMessage
      responses:
        '202':
          description: Run 시작됨
          content:
            application/json:
              schema:
                type: object
                properties:
                  message_id:
                    type: string
                  conversation_id:
                    type: string
                  run_id:
                    type: string
                  status:
                    $ref: '#/components/schemas/AgentRunStatus'
                  trace_id:
                    type: string
                  max_steps:
                    type: integer
                  stream:
                    type: object
                    properties:
                      channel:
                        type: string
                      event_types:
                        type: array
                        items:
                          type: string
                  poll_url:
                    type: string
                  accepted_at:
                    type: string
                    format: date-time
                    description: RFC3339 (오프셋 포함)
              example:
                message_id: msg_01
                conversation_id: conv_1
                run_id: run_72
                status: RECEIVED
                trace_id: trace_82
                max_steps: 12
                stream:
                  channel: /ws/teams/team_deputy
                  event_types:
                  - agent.run.step.started
                  - agent.run.step.completed
                  - agent.run.completed
                poll_url: /api/v1/agent-runs/run_72
                accepted_at: '2026-08-03T19:45:10+09:00'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
      security:
      - bearerAuth: []
      parameters:
      - name: conversation_id
        in: path
        required: true
        schema:
          type: string
        description: 대화 ID
        example: conv_1
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
                category:
                  $ref: '#/components/schemas/Category'
                requested_action:
                  type: string
                  enum:
                  - feasibility_check
                  - status_check
                  - schedule_suggestion
                  - general
              required:
              - content
            example:
              content: 현재 구조에서 한 사용자가 여러 팀에 참가할 수 있나요?
              category: database
              requested_action: feasibility_check
    get:
      tags:
      - 10. AI 대리인
      summary: 대화 메시지 목록
      description: 히스토리에서 지난 대화를 열었을 때. 전송(`POST`)만 있고 조회가 없어 지난 대화를 다시 볼 수 없었습니다.
      operationId: listAgentMessages
      responses:
        '200':
          description: 조회됨
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        role:
                          type: string
                          enum:
                          - USER
                          - AGENT
                        body:
                          type: string
                        run_id:
                          anyOf:
                          - type: string
                          - type: 'null'
                        sent_at:
                          type: string
                          format: date-time
                          description: RFC3339 (오프셋 포함)
                      required:
                      - id
                      - role
                      - body
                      - sent_at
                  next_before:
                    anyOf:
                    - type: string
                    - type: 'null'
              example:
                results:
                - id: amsg_119
                  role: USER
                  body: 인덱스 어떻게 가는 게 맞아?
                  run_id: null
                  sent_at: '2026-08-10T09:48:00+09:00'
                - id: amsg_120
                  role: AGENT
                  body: 복합 인덱스로 가는 게 맞습니다.
                  run_id: run_91
                  sent_at: '2026-08-10T09:50:00+09:00'
                next_before: null
        '401':
          $ref: '#/components/responses/E401'
        '404':
          $ref: '#/components/responses/E404'
      security:
      - bearerAuth: []
      parameters:
      - name: conversation_id
        in: path
        required: true
        schema:
          type: string
        description: 대화 ID
        example: cnv_31
      - name: before
        in: query
        required: false
        schema:
          type: string
        description: 커서
        example: amsg_120
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 50
        description: 기본 50
        example: 50
