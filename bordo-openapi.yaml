  /internal/v1/discord/commands:
    post:
      tags:
      - 13. Internal API (Discord Bot)
      summary: 자연어 명령 실행
      description: |-
        **Discord 봇이 받은 자연어를 스킬 실행 계획으로 바꿔 수행합니다.**

        `새 음성 채팅방 만들어줘`, `수연님한테 발표자 역할 줘` 같은 말을 그대로 넘기면
        서버가 계획을 세우고 스킬을 순서대로 실행합니다.

        봇은 판단하지 않습니다 — 전달만 하고 결과를 게시합니다. 판단이 봇에 들어가면
        같은 요청이 채널마다 다르게 처리될 수 있고, 정책 판정 기록도 서버 밖에 남게 됩니다.

        `dry_run: true` 로 보내면 계획만 세우고 실행하지 않습니다. `reversible: false` 인
        스킬이 계획에 섞여 있으면 이걸로 먼저 사람 확인을 받는 것을 권장합니다.
      operationId: executeDiscordCommand
      responses:
        '202':
          description: 접수됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillRun'
              example:
                id: skr_31
                surface: DISCORD
                utterance: 내일 2시 스키마 리뷰 음성방 만들고 백엔드 셋한테 알림 걸어줘
                plan_summary: 음성 채널 생성 → 참가 역할 부여 → 리마인더 등록
                status: RUNNING
                steps:
                - seq: 1
                  skill_key: create_voice_channel
                  arguments:
                    name: 스키마 리뷰
                    guild_id: '1122334455'
                  status: SUCCEEDED
                  result:
                    channel_id: '5566778899'
                  error: null
                - seq: 2
                  skill_key: assign_role
                  arguments:
                    role: 리뷰 참가자
                    user_ids:
                    - usr_a
                    - usr_b
                    - usr_c
                  status: RUNNING
                  result: null
                  error: null
                - seq: 3
