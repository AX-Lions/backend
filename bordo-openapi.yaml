        진행 중이거나 이미 끝난 회의의 제목·시각을 바꾸면 참석자들이 합의한 기록과 어긋납니다.
        `DRAFT` · `SCHEDULED` · `CONFIRMED` 에서만 고칠 수 있습니다.
      operationId: updateMeeting
      responses:
        '200':
          description: 수정됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meeting'
              example:
                id: mtg_88
                title: 8/7 스키마 리뷰
                status: SCHEDULED
                scheduled_at: '2026-08-07T14:30:00+09:00'
                duration_min: 60
                discord_channel_id: null
                participants:
                - user_id: usr_backend_01
                  name: 최비성
                  attendance: PENDING
                agenda: []
                calendar_event_id: evt_2
                created_at: '2026-08-05T09:00:00+09:00'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
      security:
      - bearerAuth: []
      parameters:
      - name: meeting_id
        in: path
        required: true
        schema:
          type: string
        description: 회의 ID
        example: mtg_88
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
