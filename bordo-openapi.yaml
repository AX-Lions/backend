  /api/v1/projects/{project_id}/sync-status:
    get:
      tags:
      - 11. 동기화
      summary: 동기화 상태
      description: |-
        🕓 **2차 범위** — 1차에서는 사람이 직접 입력합니다. 회의 대리인 기능이 안정화된 뒤에 MCP·로컬 AI 연동과 함께 붙입니다.

        ---

        `SCANNING → DIFF_READY → WAITING_CONFIRMATION → TRANSFERRING → INDEXING → COMPLETED / CONFLICT`

        **Bordo 는 상시 Watcher 를 두지 않는다.** 사용자가 개인 AI에게 명시적으로 지시할 때, MCP Tool 호출 시점에만 로컬 파일을 스캔한다.
      operationId: getSyncStatus
      responses:
        '200':
          description: 조회됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncStatus'
              example:
                team_id: team_deputy
                user_id: usr_backend_01
                status: COMPLETED
                last_sync_at: '2026-08-03T18:58:00+09:00'
                last_run_id: sync_88
                workspace_path: ~/projects/deputy-backend/.deputy
                manifest:
                  tracked_files: 34
                  base_version_max: 4
                pending:
                  local_only: 0
                  server_only: 0
                  conflicts: 0
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/ProjectId'
