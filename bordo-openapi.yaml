  /ws/projects/{project_id}:
    get:
      tags:
      - 15. WebSocket (문서)
      summary: '[문서 전용] 실시간 이벤트 채널'
      description: |-
        > ⚠️ **HTTP 엔드포인트가 아니다.** WebSocket 업그레이드 경로이며 Try it out 은 동작하지 않는다. 계약 문서용으로만 넣었다.

        **인증** JWT + 팀 멤버십 · **대체** SSE

        **이벤트 종류**

        | event_type | 소비 화면 |
        |---|---|
        | `agent.run.step.*` | 협업 흐름 — ReAct 단계 스트림 |
        | `discord.message.received` | 회의 상세 — Discord 실시간 미러링 |
        | `meeting.*` | 회의 상태·메시지 |
        | `document.*` / `sync.*` | 문서·동기화 |
        | `task.*` / `calendar.*` | 대시보드 |

        **발행 시점** 반드시 **트랜잭션 commit 이후**에 publish 한다.
        **재연결** 마지막 `event_id` 이후를 REST 로 재조회해 복구한다.
      operationId: wsTeamEvents
      responses:
        '101':
          description: Switching Protocols — WebSocket 업그레이드
        '200':
          description: 이벤트 페이로드 예시 (실제로는 WS 프레임으로 전달)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BordoEvent'
              example:
              - event_id: evt_109
                event_type: agent.run.step.completed
                team_id: team_deputy
                occurred_at: '2026-08-03T19:10:24+09:00'
                payload:
                  run_id: run_72
                  step_number: 4
                  step_type: CHECKING_POLICY
                  status: completed
                  summary: 구현 가능성 발언 허용. 근거 첨부 필요.
                  duration_ms: 83
              - event_id: evt_110
                event_type: discord.message.received
                team_id: team_deputy
                occurred_at: '2026-08-07T10:10:22+09:00'
                payload:
                  meeting_id: meeting_3
                  message_id: mm_1042
                  sender:
                    type: human
                    user_id: usr_front_01
                  content: 현재 DB 구조에서 여러 팀을 지원할 수 있나요?
              - event_id: evt_111
                event_type: task.pending_approval
                team_id: team_deputy
                occurred_at: '2026-08-07T11:05:02+09:00'
                payload:
                  task_id: task_9
                  title: team_members 인덱스 추가
                  assignee_id: usr_backend_01
              - event_id: evt_112
                event_type: sync.conflict.detected
                team_id: team_deputy
                occurred_at: '2026-08-03T12:10:05+09:00'
                payload:
                  conflict_id: cf_1
                  local_path: current/plan/index.json
                  base_version: 4
                  local_version: 5
                  server_version: 6
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/ProjectId'
