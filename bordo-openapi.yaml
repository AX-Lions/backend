                date: '2026-08-09'
                one_line: 스키마 변경 범위를 좁히고 마이그레이션 순서를 정했습니다.
                my_todos:
                - team_members 인덱스 추가
                - 8/11까지 마이그레이션 스크립트 공유
                schedules:
                - at: '2026-08-11T14:00:00+09:00'
                  title: 마이그레이션 리뷰
                  kind: MEETING
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/RoomId'
      - name: date
        in: query
        required: false
        schema:
          type: string
          format: date
        description: 선택한 날짜
        example: '2026-08-09'
  /api/v1/chat/rooms/{room_id}/search:
