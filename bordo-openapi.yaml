          type: string
        project_name:
          type: string
        team_name:
          type: string
        scheduled_at:
          type: string
          format: date-time
          description: RFC3339 (오프셋 포함)
        ends_at:
          type: string
          format: date-time
          description: '`scheduled_at + duration_min`. 종료 시각 컬럼은 없다.'
        when:
          type: string
          description: '`8월 18일 14:00 - 15:00` — 요청자 시간대로 조립'
          example: 8월 18일 14:00 - 15:00
        location:
          type: string
          enum:
          - Discord
          - 서비스
        status:
          $ref: '#/components/schemas/MeetingStatus'
        delegated:
          type: boolean
        badge:
          type: string
          description: '`{대리인 이름} 대리 참석 예정` · 진행 중이면 `… 대리 참석 중` · 아니면 `참석 예정`. 클라이언트가 필드 조합으로 만들면 화면마다 갈린다.'
          example: 서재민의 Bordo 대리 참석 예정
        prep_url:
          type: string
          nullable: true
        created:
          type: boolean
          description: 이번 호출로 새로 켜졌는가 (`absence` 응답에만)
      required:
      - meeting_id
      - title
      - when
      - delegated
      - badge
    DebatePoint:
      type: object
      description: 예상 논쟁점 하나 + **내** 입장. 쟁점은 회의에 달리고 입장은 사람마다 갈린다.
      properties:
        id:
          type: string
        order:
          type: integer
        label:
          type: string
          description: '`논쟁점 01`. 두 자리 맞춤을 클라이언트가 하면 10번째에서 갈린다.'
          example: 논쟁점 02
        title:
          type: string
          description: 질문형. `A 할 것인가, B 할 것인가?`
        options:
          type: array
          items:
            type: object
            properties:
              key: {type: string, example: A}
              title: {type: string}
              description: {type: string}
        rationale:
          type: string
          description: '`Bordo가 이렇게 예측했어요` 문단'
        evidence:
          type: array
          description: 근거 카드. **스냅샷이다** — 원본이 나중에 바뀌어도 그때 무엇을 보고 예측했는지가 남아야 한다. 인용문은 모델이 아니라 코드가 원본에서 만든다.
          items:
            type: object
            properties:
              kind:
                type: string
                enum:
                - meeting
                - work
              title: {type: string, example: 8월 15일 · 기능 구현 범위 논의}
              who: {type: string, example: 최비성}
              at: {type: string, format: date-time}
              body: {type: string}
              link:
                type: object
                description: '`{label, meeting_id}` 또는 `{label, work_item_id}`'
                additionalProperties: true
        created_by_agent:
          type: boolean
          description: '`false` 면 안건에서 규칙으로 만든 것이다. 화면이 `Bordo가 예상했어요` 문구를 붙이면 안 된다.'
        status:
          type: string
          enum:
          - NEEDED
          - ANSWERED
        status_label:
          type: string
          enum:
          - 답변필요
          - 답변완료
        stance:
          anyOf:
          - type: object
            properties:
              id: {type: string}
              option_key: {type: string, nullable: true}
              body: {type: string}
              updated_at: {type: string, format: date-time}
          - type: 'null'
      required:
      - id
      - order
      - label
      - title
      - status
      - status_label
    MeetingAgentSetup:
      type: object
      description: 「Bordo 활동 설정」. 실제 적용값과 평소 값을 함께 내려준다 — 되돌렸을 때 무엇으로 돌아가는지 화면이 보여줘야 한다.
      properties:
        mode:
          type: string
          enum:
          - STANDING
          - ONCE
          description: 컬럼이 아니라 파생값이다. 모드와 실제 덮어쓴 값이 어긋나면 화면과 대리인이 서로 다른 것을 본다.
        mode_label:
          type: string
          enum:
          - 현재 설정 사용
          - 이번에만 다르게 사용
        settings:
          type: object
          description: 이번 회의에서 실제로 판정에 쓰일 값 (평소 설정 + 덮어쓰기)
          additionalProperties: true
        standing_settings:
          type: object
          description: 평소 설정. `현재 설정 사용` 을 눌렀을 때 돌아갈 자리.
          additionalProperties: true
        overridden_keys:
          type: array
          items:
            type: string
        prompts:
          type: array
          description: 이번 회의에 실제로 실릴 시스템 프롬프트 본문
          items:
            type: string
        standing_prompts:
          type: array
          description: 설정 화면에 저장해 둔 카드 (`id` 로 수정·삭제)
          items:
            type: object
            properties:
              id: {type: string}
              body: {type: string}
        standing_prompt_limit:
          type: integer
          description: 평소 지시가 실제로 몇 개 실리는지(최근 5개). 화면이 이 수를 모르면 여섯 번째 카드가 조용히 무시된다.
        extra_note:
          type: string
          description: 「추가 설정」 자유 입력. 평소 지시보다 뒤에 실려 우선한다.
        sources:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          description: '`null` = 고른 적 없음(제한 없음), `[]` = 아무 자료도 안 봄'
      required:
      - mode
      - mode_label
      - settings
    MeetingStatus:
      type: string
      enum:
      - DRAFT
      - SCHEDULED
      - CONFIRMED
      - ACTIVE
      - PROCESSING_REPORT
      - ENDED
      description: '`DRAFT → SCHEDULED → CONFIRMED → ACTIVE → PROCESSING_REPORT → ENDED`'
    AgentRunStatus:
      type: string
      enum:
      - RECEIVED
      - ANALYZING
      - SEARCHING
      - CHECKING_POLICY
      - GENERATING
      - QUEUED_FOR_DELIVERY
      - COMPLETED
      - FAILED
      description: '`RECEIVED → ANALYZING → SEARCHING → CHECKING_POLICY → GENERATING → QUEUED_FOR_DELIVERY → COMPLETED`'
    StepType:
      type: string
      enum:
      - ANALYZING
      - SEARCHING
      - CHECKING_POLICY
      - GENERATING
      - DELIVERING
    SyncRunStatus:
      type: string
      enum:
      - IDLE
      - SCANNING
      - DIFF_READY
      - WAITING_CONFIRMATION
      - TRANSFERRING
      - INDEXING
      - COMPLETED
      - CONFLICT
      description: '`SCANNING → DIFF_READY → WAITING_CONFIRMATION → TRANSFERRING → INDEXING → COMPLETED / CONFLICT`'
    OutboxStatus:
      type: string
      enum:
      - PENDING
      - CLAIMED
      - SENT
      - ACKED
      - RETRY_WAIT
      - DEAD
      description: '`PENDING → CLAIMED → SENT → ACKED` / 실패 시 `RETRY_WAIT → DEAD`'
    OutboxType:
      type: string
      enum:
      - agent_utterance
      - meeting_announcement
      - meeting_reminder
      - pending_question
      - meeting_report
      - schedule_changed
      description: Discord 발송 유형 6종 (Discord 설계서 §10)
    PolicyDecisionValue:
      type: string
      enum:
      - ALLOW
      - ALLOW_WITH_EVIDENCE
      - SUGGEST_ONLY
      - ASK_OWNER
      - REQUIRE_APPROVAL
      - APPROVAL_REQUIRED
      - DEFER
      - DENY
    ConflictResolution:
