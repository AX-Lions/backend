openapi: 3.1.0
info:
  title: Bordo API
  version: 0.0.6
  summary: AI 협업 대리인 서비스 — 와이어프레임 실물 대조판
  description: |2

    **Bordo** 는 시간대가 다른 개발팀이 동시에 접속하지 않아도 협업을 이어가도록,
    각 팀원의 작업 맥락과 AI 대리인을 서버에서 연결하는 서비스입니다.

    > 이 문서는 **와이어프레임 실물(홈 · 플로우 · 채팅)** 을 화면 단위로 대조해
    > 고친 판입니다. 화면과 계약이 갈리는 곳은 **화면을 원본으로** 삼았습니다 —
    > 사용자가 보는 건 화면이지 스키마가 아닙니다.
    >
    > 0.0.3 대비 달라진 점은 아래 [변경 요약](#변경-요약)에 정리해 두었습니다.
    > **호환이 깨지는 변경이 있습니다** — 아직 1.0 전이라 버전은 patch 로 올리되,
    > 프론트가 고쳐야 할 곳을 변경 요약에 표로 남겼습니다.

    ---

    ## 4개의 진입점

    | 진입점 | 호출 주체 | 프로토콜 | 인증 |
    |---|---|---|---|
    | `/api/v1` | Next.js 프론트 | HTTPS REST/JSON | JWT |
    | `/internal/v1` | Discord Bot | HTTPS REST/JSON | Service Token (`X-Service-Token`) |
    | `/mcp` | Claude Code · Codex · Cursor | MCP / JSON-RPC 2.0 | `brd_` Token (`POST /me/mcp-token`) |
    | `/ws/projects/{project_id}` | 웹 프론트 | WebSocket | JWT + 프로젝트 멤버십 |

    ---

    ## 자원 계층

    ```
    User ─┬─ Team ─┬─ Project ─┬─ Document · Meeting · WorkItem · Plan · Thought
          │        │           ├─ Task · CalendarEvent
          │        │           └─ ChatRoom (PROJECT)
          │        ├─ Member · InviteCode · Category
          │        └─ ChatRoom (TEAM)
          ├─ AgentSettings · AgentPrompt        (사용자 단위, 팀 무관)
          └─ ChatRoom (AI · DIRECT · PEER_AGENT)
    ```

    **팀은 조직 단위, 프로젝트는 작업 단위입니다.** 문서·회의·작업이 매달리는 곳은 프로젝트입니다.
    반면 AI 대리인 설정은 사람에게 붙습니다 — 팀마다 다른 대리인을 갖지 않습니다.

    ---

    ## 회의는 Discord 에서 열립니다

    역할 분담이 헷갈리기 쉬워 먼저 적어 둡니다.

    | | 하는 일 |
    |---|---|
    | **Discord** | 회의가 실제로 열리는 자리. **AI 대리인이 대신 참석하는 곳**도 여기입니다 |
    | **Bordo 서비스** | 회의 전(불참 통보·시스템 프롬프트 설정)과 회의 후(브리핑·플로우·기록) |
    | **앱 내 채팅** | Discord 회의를 대체하지 않습니다. 팀원의 **AI 대리인끼리** 안건을 주고받고 유보 질문에 답하는 통로입니다 |

    Discord Bot 은 판단하지 않습니다. 자연어를 받아 `POST /internal/v1/discord/commands` 로
    넘기면 **서버가 계획을 세우고 스킬을 실행**합니다. 판단이 봇에 들어가면 같은 요청이
    채널마다 다르게 처리되고, 정책 판정 기록도 서버 밖에 남습니다.

    ### 우선순위

    1. **회의에서 활동하는 AI 대리인** — 이 서비스의 핵심입니다
    2. 프로젝트 협업을 돕는 AI (팀 관리)
    3. 일정 등 일반적인 협업 도구 기능

    2·3 은 다른 도구에도 있는 기능이라, 1 이 묻히지 않도록 순서를 못박아 둡니다.
    `🕓 2차 범위` 표시가 붙은 것들이 2·3 에 해당합니다.

    ---

    ## 부르는 이름

    화면에 그대로 나가는 문자열이 응답 필드에 들어가므로 여기서 고정합니다.

    | 대상 | 표기 | 쓰는 곳 |
    |---|---|---|
    | 서비스 | **Bordo** | `안녕하세요, {이름}님 Bordo에 오신 것을 환영합니다.` |
    | 내 대리인 | **나의 Bordo** | 채팅 사이드바 최상단, `Zero 바로가기` 대상 |
    | 남의 대리인 | **{이름}의 Bordo** | 플로우 노드, `PEER_AGENT` 방 제목 |
    | 대리인이 말할 때의 인격 | **Zero** | `Zero 브리핑`, `Zero 요약`, `Zero에게 물어보세요...` |

    즉 **소유 관계를 말할 때는 `{이름}의 Bordo`, 대리인이 화자로 나설 때는 `Zero`** 입니다.
    이전 판이 쓰던 `AI 대리인` 은 화면 어디에도 없는 낱말이라 걷어냈습니다.

    ⚠️ **가정** — 와이어프레임 안에서도 두 이름이 섞여 있어(`임수연의 Bordo` 와
    `Zero 브리핑` 이 같은 화면에 있음) 위 규칙으로 정리했습니다. 기획 확정 시 알려주십시오.

    ---

    ## 읽는 순서

    1. **00 홈** → `GET /home` 한 방으로 첫 화면이 그려진다
    2. **03-1 프로젝트** → 작업 단위를 만든다. 단체 채팅방이 함께 생긴다
    3. **06 AI 대리인 설정** → 대리인이 *무엇을 말해도 되는지* O/X 4개로 정한다
    4. **05 현재 상태** → `work` · `plan` · `thought` 를 올린다. 대리인이 답할 재료
    5. **09 회의 → 대리 참석 활성화** → 자리를 비우며 허용 범위를 확정한다
    6. **09 회의 → 플로우** → 누가 누구에게 무엇을 전달했는지 그래프로 본다
    7. **10 AI 브리핑** → 대리인이 어디서 답하고 어디서 유보했는지 되짚는다
    8. **16 채팅** → `답변 필요` 질문을 클릭해 답한다

    ---

    ## 3대 설계 원칙

    **1. 사람 최종 승인** — AI가 만든 태스크·일정·결정은 예외 없이 `PENDING_APPROVAL` / `CANDIDATE`
    로 시작합니다. AI는 후보만 만들고 확정은 사람이 합니다.

    > 🕓 승인 화면은 **팀 관리** 영역이라 2차 범위입니다. 1차(회의 대리인)에서는 대리인이
    > 만든 안건·요약이 사람의 확인을 거쳐 확정되는 경로만 씁니다.

    **2. 서버 중재** — AI끼리 직접 통신하지 않습니다. 모든 AI↔AI 메시지는 서버를 거치며
    `trace_id` 와 `hop_count`/`max_hops`(기본 3)로 무한 대화를 차단합니다.
    채팅의 `PEER_AGENT` 방도 마찬가지로 서버를 경유합니다.

    **3. 수동 동기화** — 상시 Watcher 가 없습니다. 충돌 시 자동 병합을 **금지**하며 허용 해결 방식은
    `keep_local` / `keep_server` / `keep_both` / `manual_merge` 4가지뿐입니다.

    ---

    ## 공통 규약

    ### 오류 응답

    모든 4xx·5xx 는 아래 형식입니다. 클라이언트는 **HTTP 상태가 아니라 `error.code` 로 분기**합니다.

    ```json
    {
      "success": false,
      "request_id": "9a1c2b3d-4e5f-6071-8293-a4b5c6d7e8f9",
      "error": {
        "code": "TEAM_ACCESS_DENIED",
        "message": "해당 팀의 멤버가 아닙니다.",
        "retryable": false,
        "details": { "team_id": "team_a" }
      }
    }
    ```

    `retryable: false` 인 코드는 재시도해도 같은 결과입니다. 특히 `DUPLICATE_EVENT` 는
    **성공으로 처리**해야 합니다.

    ### 멱등성

    모든 외부 쓰기 요청은 `Idempotency-Key` 헤더를 가집니다.

    | 경로 | 멱등 키 |
    |---|---|
    | Discord 메시지 | `guild_id + channel_id + message_id` |
    | MCP 문서 업로드 | `project_id + local_path + content_hash` |
    | 리마인더 | `event_id + notification_type` |
    | 채팅 전송 | `room_id + client_message_id` |

    ### 공개 범위

    `visibility: private` 문서·근거는 소유자 Agent 만 접근합니다. 다른 사용자에게는
    **존재 여부조차 노출하지 않으며**, 조회 시 `403` 이 아니라 `404` 를 반환합니다.

    ---

    ## 삭제와 권한

    ### 역할

    | 역할 | 할 수 있는 것 |
    |---|---|
    | `OWNER` | 팀 삭제·역할 변경·소유권 이전 포함 전부. 팀당 1명 |
    | `ADMIN` | 팀 수정, 프로젝트·카테고리 관리, 팀원 내보내기. 팀 삭제와 역할 변경은 불가 |
    | `MEMBER` | 자기가 만든 것만 수정·삭제 |

    ⚠️ **가정** — 와이어프레임에 권한 화면이 없어 3단계로 정했습니다. 실제 운영 방식이 다르면 알려주십시오.

    ### 삭제 방식

    | 방식 | 대상 | 이유 |
    |---|---|---|
    | **소프트 삭제** (30일 복구) | 팀 · 프로젝트 · 문서 · 회의 · 태스크 · 계정 | 되돌릴 수 없으면 사고가 사고로 끝나지 않습니다 |
    | **내용만 비움** | 채팅 메시지 | 자리를 남겨야 앞뒤 맥락이 안 끊깁니다 (`삭제된 메시지입니다`) |
    | **내 목록에서만 숨김** | `DIRECT` · `PEER_AGENT` 채팅방 | 한쪽이 지운다고 상대 기록까지 사라지면 안 됩니다 |
    | **하드 삭제** | 알림 · AI 대화 · work/plan/thought · 첨부 | 파생 데이터거나 개인 소유의 휘발성 데이터입니다 |

    ### 삭제가 막히는 경우 (`409`)

    - 진행 중인 회의(`ACTIVE`)가 있는 프로젝트·회의
    - 담당 태스크가 남은 프로젝트 참여자
    - 소유 중인 팀이 있는 계정
    - 사용 중인 카테고리 (`reassign_to` 로 옮길 곳을 지정해야 함)
    - 논의가 오간 안건 (플로우에 주인 없는 화살표가 남음)
    - Discord 공지가 나간 일정 (취소를 먼저 거쳐야 함)

    ### 삭제해도 남는 것

    **추적성은 삭제보다 우선합니다.** 아래는 원본이 지워져도 남습니다.

    - Agent Run 의 Evidence 스냅샷 — 그때 대리인이 무엇을 보고 답했는지
    - 회의 플로우의 엣지 — 문서가 지워져도 "그때 무언가 오갔다"는 사실
    - 승인된 태스크 — 이미 사람이 하고 있는 일
    - 탈퇴자의 발언 — 작성자 표기만 `(탈퇴한 사용자)` 로

    ### 상태 전이는 PATCH 가 아닙니다

    `Task.status` · `Meeting.status` · `CalendarEvent.status` 는 `PATCH` 로 못 바꿉니다.
    전용 엔드포인트(`approve` · `reject` · `complete` · `confirm` · `cancel`)로만 움직입니다.
    자유롭게 쓸 수 있으면 `PENDING_APPROVAL` 을 건너뛰어 `TODO` 로 직행할 수 있고,
    그러면 설계 1원칙이 무력화됩니다.

    ---

    ## 변경 요약

    ### 0.0.4 — 와이어프레임 실물 대조 (호환 깨짐)

    화면을 열어 놓고 필드 단위로 맞췄습니다. 아래 넷은 **깨지는 변경**입니다.

    | 무엇 | 2.0 | 3.0 | 왜 |
    |---|---|---|---|
    | 플로우 화살표 | `MeetingFlow.edges[]` — 전달 1건이 화살표 1개 | **`MeetingFlow.arrows[]`** — 사람 쌍마다 1개 + 종류별 개수 뱃지(`counts[]`) | 낱개를 그대로 그리면 두 사람 사이에 선이 열 개 겹쳐 그림이 뭉갭니다. 집계를 클라이언트가 하면 필터 걸린 화면마다 숫자가 갈립니다 |
    | 콘텐츠 종류 | 회의 모드 3종 | **6종** — `OPINION` · `REQUEST` · `CHANGE` · `SCHEDULE` · `CONCLUSION` · `ETC` | 필터 칸이 6개이고 화살표에 `일정` 뱃지가 실제로 붙어 있습니다. 3종이면 회의에서 오간 일정 조정과 결론이 그래프에 들어갈 자리가 없습니다 |
    | `REVISION` | 수정사항 | **`CHANGE`** 변동사항 | 화면 라벨도 중앙 요약표 헤더도 `변동 사항` 입니다. `수정사항` 은 API 에만 있던 낱말입니다 |
    | 최근 회의 카드 | `main_agendas` · `main_opinions` | **`main_decisions` · `zero_summary`** (+`team_name` · `occurred_at` · `missed` · `displayed_at` · `status`) | 카드가 묻는 건 "무엇을 다뤘나"가 아니라 "무엇이 정해졌나" 입니다 |

    깨지지 않는 추가는 이렇습니다.

    - **`AiBriefing` 4섹션** — `location_chips`(정보 위치 칩) ·
      `needs_confirmation`(확인이 필요해요) · `requests_to_me`(나에게 요청한 내용) ·
      `needs_answer`(답변이 필요해요). 앞의 셋은 2.0 에 아예 없었습니다.
      `used_answers` / `deferred_answers` 는 화면에서 빠졌지만 **응답에는 남깁니다** —
      대리인이 무엇을 근거로 답했는지는 추적성 자산입니다.
    - **`POST /briefing-confirmations/{id}/confirm`** — 확인은 **사용자별**입니다.
      한 사람이 눌렀다고 모두의 목록에서 사라지면 나머지는 그 변경을 영영 못 봅니다.
    - **`POST /briefing-requests/{id}/accept`** — 회의 요청을 태스크로 받습니다.
      바로 `PENDING_APPROVAL` 로 찍지 않는 이유는 승인 큐가 남의 회의 요청으로
      가득 차면 승인이라는 행위가 뜻을 잃기 때문입니다. 사람이 받은 것이라 `TODO` 입니다.
    - **`GET /meetings/{id}/ai-briefing?q=`** — 브리핑 안 검색.
    - **`HomeDashboard.shortcuts`** — `Zero 바로가기` · `Discord 바로가기`.
      없으면 홈에서 대리인 방으로 가려고 채팅 사이드바를 통째로 더 불러야 합니다.
    - **`today_schedule[].action`** — 행 버튼의 뜻을 서버가 정합니다. 회의가 Discord
      에서 열려 일정마다 달라서, 클라이언트가 필드로 추측하면 채널 없는 회의에도
      `참여하기` 가 뜹니다.
    - **호칭 고정** — `AI 대리인` 은 화면 어디에도 없는 낱말이라 걷어냈습니다.
      소유 관계는 `{이름}의 Bordo`, 대리인이 화자로 나설 때는 `Zero` 입니다.
    - `greeting_mode` 는 **문구를 바꾸지 않습니다.** 인사는 그대로 두고
      `Zero 브리핑 보러가기` 버튼이 함께 뜹니다.

    ### 0.0.3 — 와이어프레임 v2 반영

    ### 새로 생긴 것

    | 태그 | 내용 |
    |---|---|
    | **00. 홈** | 팀을 가로지르는 전역 집계. 기존 팀별 대시보드로는 홈이 안 그려집니다 |
    | **03-1. 프로젝트** | 팀과 내용 사이의 새 계층. 즐겨찾기·최근 항목 포함 |
    | **16. 채팅** | 앱 내 채팅 전체. 방 5종, 중요 표시/확인, 날짜별 요약, 달력 |
    | **09. 회의 (플로우)** | 노드-엣지 그래프, 인덱스, 필터, 3열 요약 표, 안건 상세 |
    | **10. AI 브리핑** | 활용/유보 지점 앵커 + `답변 필요` 질문 |

    ### 자리를 옮긴 것

    | v1 | v2 | 이유 |
    |---|---|---|
    | `/teams/{id}/documents` 외 다수 | `/projects/{id}/...` | 프로젝트 계층 도입 |
    | `/teams/{id}/policy/me` | `/me/agent/settings` | 설정 패널이 팀과 무관 |
    | `/teams/{id}/assistant/conversations` | `/me/agent/conversations` | `나의 Bordo` 는 단일 방 |
    | `/teams/{id}/pending-questions` | `/me/pending-questions` + `/meetings/{id}/pending-questions` | 브리핑이 회의 스코프 |

    ### 모양이 바뀐 것

    - **AgentSettings** — 3단 모드·수치 파라미터를 걷어내고 **boolean 4개**로. `SUGGEST_ONLY`,
      `min_confidence`, `max_shift_hours` 가 사라졌습니다
    - **AgentPrompt** — 정책 안의 단일 문자열이 **독립 리소스 목록**으로
    - **Document** — 본문 통짜에서 `sections[]`(소제목/한 줄 요약/내용) + `delivery_context[]` 로

    ### 없어진 것

    - `POST /teams/{id}/policy/preview` — 대응 화면이 없고 판정 로직 내부로 흡수

    ---

    ## ⚠️ 표시에 대해

    설명에 `⚠️ **가정**` 이 붙은 것은 와이어프레임에 근거가 없어 관례로 채운 부분입니다.
    `🕓 **2차 범위**` 는 1차 구현에서 빠지는 기능입니다. **빼는 것이 아니라 순서를 미루는 것**으로,
    회의 대리인 기능이 안정화된 뒤에 붙입니다.

    ---

    ## 함께 보기

    실제로 호출해 보려면 팀 워크스페이스의 Postman 컬렉션을 쓰십시오.
    `base_url` 만 바꾸면 그대로 회귀 테스트로 돌아갑니다.
  contact:
    name: Bordo 백엔드
    email: backend01@bordo.dev
servers:
- url: http://localhost:8000
  description: 로컬 개발
- url: https://stg-api.bordo.dev
  description: 스테이징
- url: https://api.bordo.dev
  description: 운영
tags:
- name: 00. 홈
  description: 첫 화면. 팀을 가로지르는 전역 집계입니다.
- name: 01. 인증
  description: JWT 발급·갱신. **로그인을 가장 먼저** 하십시오.
- name: 02. 사용자
  description: 프로필·환경설정·알림. `timezone` 은 회의 슬롯 계산에 직접 쓰입니다.
- name: 03. 팀
  description: '**조직 단위.** 멤버·초대·카테고리가 여기 붙습니다. 작업은 프로젝트로 내려갑니다.'
- name: 03-1. 프로젝트
  description: '**작업 단위.** 문서·회의·작업·태스크가 전부 이 스코프입니다.'
- name: 04. 문서
  description: 소제목/한 줄 요약/내용 3단 구조 + 전달 맥락. PRIVATE 은 존재 자체를 숨깁니다.
- name: 05. 현재 상태
  description: '`work`(지금) · `plan`(앞으로) · `thought`(미확정). 대리인 답변의 재료입니다.'
- name: 06. AI 대리인 설정
  description: '**사용자 단위.** O/X 4개 + 시스템 프롬프트 목록. 구 `06. 정책`.'
- name: 07. 태스크
  description: AI는 후보만 만들고 사람이 확정합니다. 🕓 승인 UI 는 **팀 관리**라 2차 범위.
- name: 08. 캘린더
  description: 프로젝트 일정. 개인 일정은 조작 대상이 아닙니다.
- name: 09. 회의
  description: 회의 전·중·후 전 구간 + **플로우 그래프**. 누가 누구에게 무엇을 전달했는지.
- name: 10. AI 대리인
  description: Agent Run·ReAct 단계·검색 근거·**AI 브리핑**. 추적성의 구현체.
- name: 11. 동기화
  description: 로컬 `.bordo` ↔ 서버. 🕓 **2차 범위** — 1차는 수동 입력.
- name: 12. Discord 연동 (웹)
  description: 계정·길드 연결과 권한 진단. **회의는 Discord 에서 열립니다.**
- name: 13. Internal API (Discord Bot)
  description: '**Service Token 전용.** 자연어 명령을 스킬로 실행합니다. Bot 은 판단하지 않고 전달·게시만 합니다.'
- name: 14. MCP (개인 AI · JSON-RPC 2.0)
  description: 개인 AI 클라이언트용 JSON-RPC 2.0. **1단계 — 쓰기 도구 3종** (`bordo_` 접두). dual-era(legacy `initialize` · modern `server/discover`). 나머지 10종은 2단계.
- name: 15. WebSocket (문서)
  description: 실시간 이벤트 계약. 채팅 때문에 필수가 되었습니다.
- name: 16. 채팅
  description: 앱 내 채팅. 방 5종, 중요 표시/확인, 날짜별 요약, 달력.
security:
- bearerAuth: []
paths:
  /api/v1/auth/signup:
    post:
      tags:
      - 01. 인증
      summary: 회원가입
      description: |-
        새 Deputy 계정을 생성한다. 인증 불필요.

        `timezone` 은 단순 표시용이 아니다 — 회의 슬롯 계산(`suggest_meeting_slots`)과 Discord 공지의 현지 시각 표기에 직접 쓰인다.
      operationId: signup
      responses:
        '201':
          description: 생성됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: usr_backend_01
                email: backend01@bordo.dev
                name: 최비성
                locale: ko
                timezone: Asia/Seoul
                project_role: backend
                discord_linked: false
        '400':
          $ref: '#/components/responses/E400'
        '409':
          $ref: '#/components/responses/E409'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                name:
                  type: string
                locale:
                  type: string
                  enum:
                  - ko
                  - en
                  default: ko
                timezone:
                  type: string
                  example: Asia/Seoul
              required:
              - email
              - password
              - name
            example:
              email: backend01@bordo.dev
              password: Deputy!2026
              name: 최비성
              locale: ko
              timezone: Asia/Seoul
  /api/v1/auth/login:
    post:
      tags:
      - 01. 인증
      summary: 로그인
      description: |-
        JWT access/refresh 토큰을 발급한다.

        프론트는 `401 AUTH_TOKEN_EXPIRED` 를 받으면 `/auth/refresh` 를 **한 번만** 시도하고, 실패하면 로그인 화면으로 보낸다.
      operationId: login
      responses:
        '200':
          description: 발급됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
              example:
                access_token: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJ1c3JfYmFja2VuZF8wMSJ9.SIG
                refresh_token: eyJhbGciOiJIUzI1NiJ9.eyJ0eXAiOiJyZWZyZXNoIn0.SIG
                token_type: Bearer
                expires_in: 3600
                user:
                  id: usr_backend_01
                  name: 최비성
                  email: backend01@bordo.dev
                  locale: ko
                  timezone: Asia/Seoul
        '401':
          $ref: '#/components/responses/E401'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
              required:
              - email
              - password
            example:
              email: backend01@bordo.dev
              password: Deputy!2026
  /api/v1/auth/refresh:
    post:
      tags:
      - 01. 인증
      summary: Access Token 갱신
      description: Refresh Token 으로 새 access_token 을 받는다. 실패하면 재시도하지 않고 로그인 화면으로 이동한다.
      operationId: refreshToken
      responses:
        '200':
          description: 갱신됨
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
                    enum:
                    - Bearer
                  expires_in:
                    type: integer
              example:
                access_token: eyJ...
                token_type: Bearer
                expires_in: 3600
        '401':
          $ref: '#/components/responses/E401'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
              required:
              - refresh_token
  /api/v1/auth/logout:
    post:
      tags:
      - 01. 인증
      summary: 로그아웃
      description: Refresh Token 을 폐기한다. 이후 갱신 요청은 `AUTH_INVALID_TOKEN`.
      operationId: logout
      responses:
        '200':
          description: 폐기됨
          content:
            application/json:
              schema:
                type: object
                properties:
                  revoked:
                    type: boolean
                  revoked_at:
                    type: string
                    format: date-time
                    description: RFC3339 (오프셋 포함)
              example:
                revoked: true
                revoked_at: '2026-08-03T19:40:00+09:00'
        '401':
          $ref: '#/components/responses/E401'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
              required:
              - refresh_token
  /api/v1/auth/me:
    get:
      tags:
      - 01. 인증
      summary: 현재 로그인 사용자
      description: JWT 유효성 스모크 테스트용. 소속 팀 목록을 함께 준다.
      operationId: getMe
      responses:
        '200':
          description: 조회됨
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/User'
                - type: object
                  properties:
                    teams:
                      type: array
                      items:
                        type: object
                        properties:
                          team_id:
                            type: string
                          name:
                            type: string
                          team_role:
                            $ref: '#/components/schemas/TeamRole'
              example:
                id: usr_backend_01
                email: backend01@bordo.dev
                name: 최비성
                locale: ko
                timezone: Asia/Seoul
                teams:
                - team_id: team_deputy
                  name: Deputy 개발팀
                  team_role: OWNER
        '401':
          $ref: '#/components/responses/E401'
      security:
      - bearerAuth: []
  /api/v1/users/me:
    get:
      tags:
      - 02. 사용자
      summary: 내 프로필
      description: 온보딩 화면에서 언어·시간대·역할을 확인할 때 사용한다.
      operationId: getProfile
      responses:
        '200':
          description: 조회됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: usr_backend_01
                email: backend01@bordo.dev
                name: 최비성
                locale: ko
                timezone: Asia/Seoul
                project_role: backend
                notification:
                  discord_dm: true
                  email: false
                  web_push: true
                discord_linked: true
                mcp_token_issued_at: '2026-08-01T09:00:00+09:00'
        '401':
          $ref: '#/components/responses/E401'
      security:
      - bearerAuth: []
    patch:
      tags:
      - 02. 사용자
      summary: 내 프로필 수정
      description: |-
        보낸 항목만 바뀝니다.

        `timezone` 을 바꾸면 **이후 생성되는** 회의 슬롯 계산과 Discord 공지의 현지 시각 표기가 달라집니다.
        이미 확정된 일정의 표기는 소급해서 바뀌지 않습니다 — 참석자들이 이미 그 시각으로 합의했기 때문입니다.
      operationId: updateMyProfile
      responses:
        '200':
          description: 수정됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: usr_me
                email: susu@bordo.dev
                name: 유수인
                locale: ko
                timezone: Asia/Seoul
                project_role: backend
                discord_linked: true
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                avatar_url:
                  anyOf:
                  - type: string
                  - type: 'null'
                locale:
                  type: string
                  enum:
                  - ko
                  - en
                timezone:
                  type: string
                project_role:
                  type: string
            example:
              name: 유수인
              timezone: Asia/Seoul
              project_role: backend
    delete:
      tags:
      - 02. 사용자
      summary: 회원 탈퇴
      description: |-
        소프트 삭제 후 30일 뒤 영구 삭제합니다.

        - **팀 OWNER 인 팀이 남아 있으면 `409`** 입니다. 소유권을 넘기거나 팀을 먼저 지워야 합니다.
        - 작성한 문서·회의 발언·채팅 메시지는 남고 작성자 표기만 `(탈퇴한 사용자)` 로 바뀝니다.
          회의 맥락과 결정 근거가 통째로 사라지면 남은 팀원이 기록을 되짚을 수 없기 때문입니다.
        - AI 대리인 설정·프롬프트·대화는 즉시 삭제합니다.

        ⚠️ **가정** — 와이어프레임에 근거가 없어 관례대로 정했습니다. 기획 확정 시 알려주시면 반영합니다. 유예 기간 30일과 보존 범위는 관례값입니다.
      operationId: deleteMyAccount
      responses:
        '200':
          description: 탈퇴 접수됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletedResult'
              example:
                id: usr_me
                deleted_at: '2026-08-10T11:00:00+09:00'
                restorable_until: '2026-09-09T11:00:00+09:00'
        '401':
          $ref: '#/components/responses/E401'
        '409':
          description: '`APPROVAL_REQUIRED` — 소유 중인 팀이 남아 있음'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                success: false
                request_id: 1a2b...
                error:
                  code: APPROVAL_REQUIRED
                  message: 소유 중인 팀이 있어 탈퇴할 수 없습니다.
                  retryable: false
                  details:
                    owned_team_ids:
                    - team_a
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  anyOf:
                  - type: string
                  - type: 'null'
            example:
              reason: 프로젝트 종료
  /api/v1/users/me/preferences:
    patch:
      tags:
      - 02. 사용자
      summary: 환경설정 수정
      description: |-
        언어·시간대·알림 채널을 수정한다. 시간대 변경은 회의 슬롯 계산에 즉시 반영된다.

        ---

        **와이어프레임 v2 추가 항목**

        | 키 | 근거 |
        |---|---|
        | `always_open_briefing` | 홈 팝업 체크박스 `항상 브리핑 보러가기` |
        | `dismissed_tooltips[]` | `당신의 Bordo를 입맛에 맞게 조정해보세요!` 등 온보딩 툴팁의 `x`. 닫은 상태가 기기 간에 유지되어야 합니다 |
        | `chat_sidebar_collapsed` | 채팅창 확대/축소 상태. ⚠️ **가정** — 와이어프레임에 근거가 없어 관례대로 정했습니다. 기획 확정 시 알려주시면 반영합니다. 클라이언트 로컬 저장으로 충분할 수도 있습니다 |
      operationId: updatePreferences
      responses:
        '200':
          description: 수정됨
          content:
            application/json:
              schema:
                type: object
                properties:
                  locale:
                    type: string
                  timezone:
                    type: string
                  notification:
                    type: object
                    properties:
                      discord_dm:
                        type: boolean
                      email:
                        type: boolean
                      web_push:
                        type: boolean
                  updated_at:
                    type: string
                    format: date-time
                    description: RFC3339 (오프셋 포함)
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                locale:
                  type: string
                  enum:
                  - ko
                  - en
                timezone:
                  type: string
                notification:
                  type: object
                  properties:
                    discord_dm:
                      type: boolean
                    email:
                      type: boolean
                    web_push:
                      type: boolean
            example:
              locale: ko
              timezone: Asia/Seoul
              notification:
                discord_dm: true
                email: false
                web_push: true
  /api/v1/users/me/notifications:
    get:
      tags:
      - 02. 사용자
      summary: 알림 목록
      description: 대시보드 상단 '승인 대기 개수' 뱃지의 원본이다.
      operationId: listNotifications
      responses:
        '200':
          description: 조회됨
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/Notification'
                required:
                - results
              example:
                count: 2
                results:
                - id: ntf_301
                  type: pending_question
                  title: 임수연님의 대리인이 질문을 남겼습니다
                  body: 현재 구조에서 한 사용자가 여러 팀에 참가할 수 있나요?
                  link: /t/team_deputy/agent?question=q_12
                  read: false
                  occurred_at: '2026-08-03T19:10:30+09:00'
                - id: ntf_302
                  type: task_pending_approval
                  title: 승인 대기 태스크 1건
                  body: team_members 인덱스 추가
                  link: /t/team_deputy/dashboard
                  read: false
                  occurred_at: '2026-08-03T19:12:04+09:00'
        '401':
          $ref: '#/components/responses/E401'
      security:
      - bearerAuth: []
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - unread
          - all
        description: '`unread` 또는 `all`'
        example: unread
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 20
        description: 최대 개수
  /api/v1/me/mcp-token:
    post:
      tags:
      - 02. 사용자
      summary: MCP 토큰 발급 (재발급)
      description: |-
        개인 AI 클라이언트용 `brd_` 토큰을 발급한다. **원문은 이 응답에 딱 한 번** 실리고 서버에는 해시만 남는다.
        사용자당 활성 1개 — 재발급이 곧 이전 토큰의 폐기다.

        `setup_command` 를 서버가 만들어 주는 이유 — 사용자가 URL 과 헤더 형식을 직접 조립하면 반드시 틀린다. 복사 버튼 하나로 끝나야 한다.

        > 화면 문구에 반드시 넣을 경고. `.mcp.json` 은 **저장소에 커밋되는 파일**이다. 토큰을 거기 적으면 안 된다.
        > `claude mcp add` 의 기본 위치(개인 설정)에 넣도록 안내한다.
      operationId: issueMcpToken
      responses:
        '201':
          description: 발급됨
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: '`brd_` 로 시작. 다시 볼 수 없다.'
                  issued_at:
                    type: string
                    format: date-time
                  setup_command:
                    type: string
                required:
                - token
                - issued_at
                - setup_command
              example:
                token: brd_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
                issued_at: '2026-08-18T14:00:00+09:00'
                setup_command: 'claude mcp add --transport http bordo https://api.bordo.dev/mcp --header "Authorization: Bearer brd_xxxx..."'
        '401':
          $ref: '#/components/responses/E401'
      security:
      - bearerAuth: []
    delete:
      tags:
      - 02. 사용자
      summary: MCP 토큰 폐기
      description: 활성 토큰을 즉시 폐기한다. 없어도 204 다. `GET /users/me` 의 `mcp_token_issued_at` 이 `null` 로 돌아간다.
      operationId: revokeMcpToken
      responses:
        '204':
          description: 폐기됨
        '401':
          $ref: '#/components/responses/E401'
      security:
      - bearerAuth: []
  /api/v1/me/discord/link:
    post:
      tags:
      - 12. Discord 연동 (웹)
      summary: 내 Discord 계정 연결 (코드 입력)
      description: |-
        Discord 에서 `/bordo-connect` 로 DM 받은 6자리 코드를 넣는다. 설정 화면(`/account`)이 부른다.
        `GET /users/me` 의 `discord_linked` 가 `true` 로 바뀐다.

        같은 Discord 계정이 다른 Bordo 계정에 이어져 있었다면 그쪽에서 떼어 이 계정에 붙인다 —
        한 Discord 계정이 두 사람에게 이어지면 봇의 발언이 누구 것인지 정할 수 없다.

        오류 — `DISCORD_CODE_INVALID`(400) · `DISCORD_CODE_EXPIRED`(410, 10분) · `DISCORD_CODE_ALREADY_USED`(409)
      operationId: linkMyDiscord
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                connect_code:
                  type: string
              required:
              - connect_code
            example:
              connect_code: 4F2A91
      responses:
        '200':
          description: 연결됨
          content:
            application/json:
              schema:
                type: object
                properties:
                  linked: {type: boolean}
                  user_id: {type: string}
                  discord_user_id: {type: string, nullable: true}
              example:
                linked: true
                user_id: usr_backend_01
                discord_user_id: '111'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '409':
          $ref: '#/components/responses/E409'
      security:
      - bearerAuth: []
    delete:
      tags:
      - 12. Discord 연동 (웹)
      summary: 내 Discord 계정 연결 해제
      operationId: unlinkMyDiscord
      responses:
        '200':
          description: '해제됨 (`linked: false`)'
        '401':
          $ref: '#/components/responses/E401'
      security:
      - bearerAuth: []
