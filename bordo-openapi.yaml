                  type: string
                  format: date-time
                  description: RFC3339 (오프셋 포함)
                duration_min:
                  type: integer
                participant_ids:
                  type: array
                  items:
                    type: string
            example:
              title: 8/7 스키마 리뷰
              scheduled_at: '2026-08-07T14:30:00+09:00'
    delete:
      tags:
      - 09. 회의
      summary: 회의 삭제
      description: |-
        주최자 또는 `OWNER` · `ADMIN`. 소프트 삭제입니다.

        **`ACTIVE` 면 `409`** 입니다. 진행 중인 회의를 지우면 참석자 화면이 끊깁니다. 먼저 종료해야 합니다.

        `ENDED` 회의를 지우면 보고서·플로우 그래프·AI 브리핑이 함께 감춰집니다.
        다만 그 회의에서 나온 **태스크는 남습니다** — 이미 승인돼 사람이 하고 있는 일이기 때문입니다.
      operationId: deleteMeeting
