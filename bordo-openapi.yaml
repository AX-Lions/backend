        v1 의 `GET /teams/{team_id}/policy/me` 를 대체합니다.
      operationId: getAgentSettings
      responses:
        '200':
          description: 조회됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSettings'
              example:
                mention_feasibility: true
                allow_schedule_change: true
                allow_midmeeting_question: false
                disclose_work_plan_thought: true
                active_version: 8
                updated_at: '2026-08-09T19:30:00+09:00'
        '401':
          $ref: '#/components/responses/E401'
      security:
      - bearerAuth: []
    patch:
      tags:
      - 06. AI 대리인 설정
      summary: 세부 설정 저장
      description: |-
        편집 모달의 `저장`.

        **보낸 항목만 바뀝니다.** 저장할 때마다 `active_version` 이 1 증가한 새 행이 생기며
        덮어쓰지 않습니다 — 모든 AI 발언이 판정 당시 버전과 연결되어야 감사가 가능합니다.

        진행 중인 Agent Run 에는 적용되지 않고 **다음 Run 부터** 적용됩니다.
        `변한 게 있을 때만 저장 버튼이 활성화됨` 은 클라이언트 판정이라 API 와 무관합니다.
      operationId: updateAgentSettings
      responses:
        '200':
          description: 저장됨
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings:
                    $ref: '#/components/schemas/AgentSettings'
                  previous_version:
                    type: integer
                  changed:
                    type: object
                    additionalProperties: true
              example:
                settings:
                  mention_feasibility: true
                  allow_schedule_change: true
                  allow_midmeeting_question: true
                  disclose_work_plan_thought: true
                  active_version: 9
                  updated_at: '2026-08-10T10:40:00+09:00'
                previous_version: 8
                changed:
                  allow_midmeeting_question:
                    from: false
                    to: true
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mention_feasibility:
